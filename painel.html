<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luary Shop - Gestor Oficial</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

<style>
body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
  databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// ================= APP =================
const App = () => {

const [activeTab, setActiveTab] = useState('catalogo');
const [searchTerm, setSearchTerm] = useState('');
const [products, setProducts] = useState([]);
const [marketplaces, setMarketplaces] = useState([]);
const [editingProduct, setEditingProduct] = useState(null);

const logistics = { 
  packaging: { cost: 1.5 }, 
  bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } 
};

// ================= LOAD =================
useEffect(() => {

db.ref('products').on('value', s => {
  const data = s.val();
  setProducts(data ? Object.entries(data).map(([id,v])=>({id,...v})) : []);
});

db.ref('marketplaces').on('value', s => {
  const data = s.val();
  if (data) {
    setMarketplaces(Object.entries(data).map(([id,v])=>({id,...v})));
  } else {
    const initialMP = [
      { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3 },
      { id: 'ml', name: 'Mercado Livre', commission: 16.5, fixedFee: 6 }
    ];
    initialMP.forEach(m => db.ref(`marketplaces/${m.id}`).set(m));
  }
});

// ================= SEED PRODUTOS =================
db.ref("products").once("value", snap=>{
if(!snap.exists()){

const seed = [
{ sku:"CHV-SAOBENTO-01865", name:"Chaveiro São Bento" },
{ sku:"CHV-FRD-CVALO-00611", name:"Ferradura Cavalo" },
{ sku:"SKU-CASAL-SERTANEJO-02343", name:"Casal Sertanejo" },
{ sku:"SKU-NSAPARECIDA-01822", name:"Nossa Senhora Aparecida" },
{ sku:"SKU-MEDALHA-SAGRADO-01811", name:"Sagrado Coração" },
{ sku:"SKU-CRUZ-OURO-01777", name:"Cruz Ouro" },
{ sku:"SKU-ANJO-GUARDA-01999", name:"Anjo da Guarda" },
{ sku:"SKU-FE-OURO-01888", name:"Fé Ouro" },
{ sku:"SKU-TERCO-OURO-02001", name:"Terço Ouro" },
{ sku:"SKU-SAO-JORGE-02002", name:"São Jorge" },
{ sku:"SKU-SAGRADA-FAMILIA-02003", name:"Sagrada Família" },
{ sku:"SKU-CRUCIFIXO-02004", name:"Crucifixo" },
{ sku:"SKU-ESPIRITO-SANTO-02005", name:"Espírito Santo" },
{ sku:"SKU-CORACAO-JESUS-02006", name:"Coração de Jesus" },
{ sku:"SKU-MEDALHA-MILAGROSA-02007", name:"Medalha Milagrosa" },
{ sku:"SKU-ROSARIO-02008", name:"Rosário" },
{ sku:"SKU-FLOR-OURO", name:"Flor Ouro" },
{ sku:"SKU-ESTRELA-OURO", name:"Estrela Ouro" },
{ sku:"SKU-LACO-OURO", name:"Laço Ouro" },
{ sku:"SKU-CORACAO-OURO", name:"Coração Ouro" }
];

seed.forEach(p=>{
const key = db.ref("products").push().key;
db.ref("products/"+key).set({
id:key,
...p,
baseWeight:15,
bathType:"ouro",
strategy:"margem",
targetMargin:50,
salePrice:0,
additionalCosts:[],
selectedMarketplace:"shopee"
});
});

}
});

},[]);

// ================= CALCULO =================
const calculateProduct = (prod) => {

if(!prod) return {totalProdCost:0, suggestedPrice:0, finalPrice:0, profit:0};

const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || { commission:0, fixedFee:0 };

const bathCost = (Number(prod.baseWeight)||0) * (logistics.bathCosts[prod.bathType]||0);

const extraCosts = (prod.additionalCosts||[]).reduce((a,c)=>a+Number(c.value||0),0);

const totalProdCost = bathCost + extraCosts + Number(logistics.packaging.cost);

const divisor = (1 - (Number(mp.commission) + Number(prod.targetMargin||0))/100);

const suggestedPrice = divisor>0 ? (totalProdCost + Number(mp.fixedFee)) / divisor : 0;

const finalPrice = prod.strategy === 'margem'
? suggestedPrice
: Number(prod.salePrice||0);

const feesVal = (finalPrice * (Number(mp.commission)/100)) + Number(mp.fixedFee);

const profit = finalPrice - totalProdCost - feesVal;

return { totalProdCost, suggestedPrice, finalPrice, profit };
};

// ================= SAVE =================
const handleSave = () => {
db.ref(`products/${editingProduct.id}`).update(editingProduct);
setEditingProduct(null);
};

// ================= UI =================
return (
<div className="flex min-h-screen">

<aside className="w-64 bg-slate-900 text-white p-8 fixed h-full">
<h1 className="text-2xl font-black">LUARY SHOP</h1>

<button onClick={()=>setActiveTab('catalogo')}>Catálogo</button>
</aside>

<main className="ml-64 p-12 w-full">

<div className="mb-6">
<input placeholder="Buscar SKU"
onChange={e=>setSearchTerm(e.target.value)}
className="p-3 border rounded"/>
</div>

<div className="grid grid-cols-4 gap-6">

{products
.filter(p=>p.sku?.toLowerCase().includes(searchTerm.toLowerCase()))
.map(p=>{
const r = calculateProduct(p);

return(
<div key={p.id} className="bg-white p-4 rounded shadow">

<p>{p.name}</p>
<p>{p.sku}</p>

<p>R$ {r.finalPrice.toFixed(2)}</p>
<p className={r.profit>0?"text-green-600":"text-red-600"}>
R$ {r.profit.toFixed(2)}
</p>

<button onClick={()=>setEditingProduct(p)}>Editar</button>

</div>
);
})}

</div>

</main>

</div>
);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
