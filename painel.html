<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão de Precisão</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuração Firebase Original
        const firebaseConfig = { databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Canais de Venda baseados na Tabela Profissa
        const salesChannels = {
            shopee: { name: "Shopee", commission: 0.18, fixedFee: 5.00, tax: 0.04 },
            ml: { name: "Mercado Livre", commission: 0.14, fixedFee: 5.00, tax: 0.04 },
            amazon: { name: "Amazon", commission: 0.15, fixedFee: 0.00, tax: 0.04 },
            direto: { name: "Venda Direta", commission: 0.02, fixedFee: 0.00, tax: 0.04 }
        };

        const App = () => {
            const [products, setProducts] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [activeChannel, setActiveChannel] = useState('shopee');

            useEffect(() => {
                const ref = db.ref('products');
                ref.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setProducts(Object.keys(data).map(key => ({ id: key, ...data[key] })));
                    }
                });
                return () => ref.off();
            }, []);

            // Lógica de Cálculo da Planilha Profissional
            const calculateProduct = (product) => {
                const cost = parseFloat(product.price) || 0;
                const margin = (parseFloat(product.margin) || 35) / 100;
                const channel = salesChannels[activeChannel];
                
                // Fórmula: Preço = (Custo + Taxa Fixa) / (1 - (Comissão + Margem + Imposto))
                const divisor = 1 - (channel.commission + margin + channel.tax);
                const suggested = (cost + channel.fixedFee) / (divisor > 0 ? divisor : 1);
                
                const profit = suggested - cost - (suggested * channel.commission) - channel.fixedFee - (suggested * channel.tax);
                
                return { 
                    suggested: suggested || 0, 
                    profit: profit || 0,
                    weight: parseFloat(product.weight) || 0 
                };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24 px-6">
                    <header className="py-10 flex justify-between items-center">
                        <div>
                            <h1 className="text-4xl font-black tracking-tighter text-slate-900">LUARY<span className="text-amber-500">.</span></h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Painel Administrativo</p>
                        </div>
                        <button onClick={() => setEditingProduct({ name: '', price: '', weight: '', margin: '35', stock: '0' })} 
                                className="bg-slate-900 text-white w-12 h-12 rounded-2xl shadow-lg flex items-center justify-center font-bold">+</button>
                    </header>

                    {/* Seletor de Canais (Inteligência da Tabela) */}
                    <div className="flex gap-2 overflow-x-auto no-scrollbar mb-8">
                        {Object.keys(salesChannels).map(key => (
                            <button key={key} onClick={() => setActiveChannel(key)}
                                className={`px-5 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap transition-all ${activeChannel === key ? 'bg-amber-500 text-white shadow-md' : 'bg-white text-slate-400'}`}>
                                {salesChannels[key].name}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-4">
                        {products.map(p => {
                            const res = calculateProduct(p);
                            return (
                                <div key={p.id} onClick={() => setEditingProduct(p)} className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-black text-slate-800 leading-tight">{p.name || 'Novo Item'}</h3>
                                            <span className="text-[10px] font-bold text-slate-400 uppercase italic">{p.weight}g | Estoque: {p.stock}</span>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[8px] font-black text-slate-400 uppercase">Sugestão {salesChannels[activeChannel].name}</p>
                                            <p className="text-xl font-black text-slate-900">R$ {res.suggested.toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-slate-50 flex justify-between items-center text-[10px] font-black uppercase">
                                        <span className="text-slate-400 italic">Custo: R$ {p.price}</span>
                                        <span className="text-emerald-500">Lucro: R$ {res.profit.toFixed(2)}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal de Cadastro Completo (IGUAL AO ANTERIOR) */}
                    {editingProduct && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-end">
                            <div className="bg-slate-50 w-full max-h-[90vh] rounded-t-[3rem] p-8 overflow-y-auto custom-scroll shadow-2xl">
                                <div className="max-w-md mx-auto space-y-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-black italic">Editor de Produto</h2>
                                        <button onClick={() => setEditingProduct(null)} className="text-slate-400 font-bold">FECHAR</button>
                                    </div>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Nome do Item</label>
                                            <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" placeholder="Ex: Chaveiro Boi Nelore" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Custo (R$)</label>
                                                <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Peso (g)</label>
                                                <input type="number" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Estoque</label>
                                                <input type="number" value={editingProduct.stock} onChange={e => setEditingProduct({...editingProduct, stock: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Margem (%)</label>
                                                <input type="number" value={editingProduct.margin} onChange={e => setEditingProduct({...editingProduct, margin: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 p-8 rounded-[2.5rem] text-white">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 block italic">Venda em {salesChannels[activeChannel].name}</span>
                                                    <span className="text-3xl font-black italic">R$ {calculateProduct(editingProduct).suggested.toFixed(2)}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[9px] font-black uppercase text-slate-500 block">Lucro Limpo</span>
                                                    <span className="text-lg font-black text-emerald-400">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <button onClick={() => {
                                            const id = editingProduct.id || db.ref('products').push().key;
                                            db.ref(`products/${id}`).set({...editingProduct, id});
                                            setEditingProduct(null);
                                        }} className="w-full bg-amber-500 text-white py-6 rounded-3xl font-black uppercase shadow-lg shadow-amber-200">Salvar no Firebase</button>

                                        {editingProduct.id && (
                                            <button onClick={() => confirm('Apagar?') && (db.ref(`products/${editingProduct.id}`).remove(), setEditingProduct(null))}
                                                    className="w-full text-rose-500 font-black text-[9px] uppercase tracking-widest opacity-50">Excluir Produto</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
