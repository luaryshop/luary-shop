<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão de Precisão</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // CONFIGURAÇÃO FIREBASE (Mantendo sua estrutura original)
        const firebaseConfig = { databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // CANAIS DE VENDA - ATUALIZADOS COM A TABELA PROFISSA
        const salesChannels = {
            shopee: { name: "Shopee", commission: 0.18, fixedFee: 5.00, tax: 0.04 },
            mercadoLivre: { name: "M. Livre", commission: 0.14, fixedFee: 5.00, tax: 0.04 },
            amazon: { name: "Amazon", commission: 0.15, fixedFee: 0.00, tax: 0.04 },
            magalu: { name: "Magalu", commission: 0.16, fixedFee: 5.00, tax: 0.04 },
            direto: { name: "Direto/Site", commission: 0.02, fixedFee: 0.00, tax: 0.04 }
        };

        const App = () => {
            const [products, setProducts] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [activeChannel, setActiveChannel] = useState('shopee');

            useEffect(() => {
                const ref = db.ref('products');
                ref.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        setProducts(list);
                    }
                });
                return () => ref.off();
            }, []);

            // FUNÇÃO DE CÁLCULO MELHORADA (Integração Tabela Profissa + Sua Lógica Original)
            const calculateProduct = (product) => {
                if (!product) return {};
                const cost = parseFloat(product.price) || 0;
                const margin = (parseFloat(product.margin) || 35) / 100;
                const channel = salesChannels[activeChannel];

                // Fórmula da Tabela Profissa: Preço = (Custo + TaxaFixa) / (1 - (Comissão + Margem + Imposto))
                const divisor = 1 - (channel.commission + margin + channel.tax);
                const suggestedPrice = (cost + channel.fixedFee) / divisor;
                
                const fees = (suggestedPrice * channel.commission) + channel.fixedFee + (suggestedPrice * channel.tax);
                const profit = suggestedPrice - cost - fees;

                return {
                    suggestedPrice: suggestedPrice || 0,
                    profit: profit || 0,
                    totalWeight: parseFloat(product.weight) || 0
                };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24">
                    {/* Header Estilo Luary */}
                    <header className="p-8 pt-12">
                        <div className="flex justify-between items-end">
                            <div>
                                <h1 className="text-4xl font-black tracking-tighter text-slate-900">LUARY<span className="text-amber-500">.</span></h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">Gestão de Precisão</p>
                            </div>
                            <button onClick={() => {
                                const newRef = db.ref('products').push();
                                setEditingProduct({ id: newRef.key, name: '', price: '', weight: '', margin: '35' });
                            }} className="bg-slate-900 text-white p-4 rounded-3xl shadow-xl shadow-slate-200 hover:scale-105 transition-all">
                                <i data-lucide="plus"></i>
                            </button>
                        </div>
                    </header>

                    {/* Seletor de Canais (NOVO - Baseado na Tabela Profissa) */}
                    <div className="px-8 mb-6 overflow-x-auto flex gap-2 no-scrollbar">
                        {Object.keys(salesChannels).map(key => (
                            <button 
                                key={key}
                                onClick={() => setActiveChannel(key)}
                                className={`px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${activeChannel === key ? 'bg-amber-500 text-white shadow-lg' : 'bg-white text-slate-400'}`}
                            >
                                {salesChannels[key].name}
                            </button>
                        ))}
                    </div>

                    {/* Lista de Produtos (Mantendo seu design original) */}
                    <div className="px-8 space-y-4">
                        {products.map(product => {
                            const stats = calculateProduct(product);
                            return (
                                <div key={product.id} onClick={() => setEditingProduct(product)} className="bg-white p-6 rounded-[2.5rem] shadow-sm hover:shadow-xl transition-all border border-slate-50 cursor-pointer group">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="max-w-[180px]">
                                            <h3 className="text-lg font-black text-slate-800 leading-tight group-hover:text-amber-600 transition-colors">{product.name || 'Sem nome'}</h3>
                                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{product.weight || 0}g</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[9px] font-black text-slate-400 uppercase block mb-1">Preço Sugerido</span>
                                            <span className="text-xl font-black text-slate-900 italic">R$ {stats.suggestedPrice?.toFixed(2)}</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center pt-4 border-t border-slate-50">
                                        <div className="flex gap-4">
                                            <div><span className="text-[8px] font-black text-slate-400 uppercase block">Custo</span><span className="text-xs font-bold text-slate-600 italic">R$ {product.price}</span></div>
                                            <div><span className="text-[8px] font-black text-slate-400 uppercase block italic">Lucro</span><span className="text-xs font-bold text-emerald-500">R$ {stats.profit?.toFixed(2)}</span></div>
                                        </div>
                                        <div className="bg-slate-50 px-3 py-1 rounded-full"><span className="text-[9px] font-black text-slate-400">{activeChannel.toUpperCase()}</span></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal de Edição (Restaura os nomes dos campos que você pediu) */}
                    {editingProduct && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-end">
                            <div className="bg-slate-50 w-full max-h-[90vh] rounded-t-[3rem] p-8 overflow-y-auto custom-scroll shadow-2xl">
                                <div className="max-w-md mx-auto">
                                    <div className="flex justify-between items-center mb-8">
                                        <h2 className="text-2xl font-black italic text-slate-900">Editor<span className="text-amber-500">.</span></h2>
                                        <button onClick={() => setEditingProduct(null)} className="p-3 bg-white rounded-full text-slate-400 hover:text-slate-900"><i data-lucide="x"></i></button>
                                    </div>

                                    <div className="space-y-6">
                                        {/* NOMES DOS CAMPOS RESTAURADOS */}
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Nome do Item</label>
                                            <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-white p-6 rounded-3xl font-bold text-slate-800 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all shadow-sm" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Preço de Custo</label>
                                                <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} className="w-full bg-white p-6 rounded-3xl font-bold text-slate-800 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all shadow-sm" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Peso (g)</label>
                                                <input type="number" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} className="w-full bg-white p-6 rounded-3xl font-bold text-slate-800 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all shadow-sm" />
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4 tracking-widest">Margem de Lucro Desejada (%)</label>
                                            <input type="number" value={editingProduct.margin} onChange={e => setEditingProduct({...editingProduct, margin: e.target.value})} className="w-full bg-white p-6 rounded-3xl font-bold text-slate-800 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all shadow-sm" />
                                        </div>

                                        <div className="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl shadow-slate-300 relative overflow-hidden">
                                            <div className="relative z-10 flex justify-between items-center">
                                                <div><span className="text-[9px] font-black uppercase text-slate-500 block italic">Venda Sugerida ({activeChannel})</span><span className="text-3xl font-black italic">R$ {calculateProduct(editingProduct).suggestedPrice?.toFixed(2)}</span></div>
                                                <div className="text-right">
                                                    <div><span className="text-[9px] font-black uppercase text-slate-500 block">Lucro Real</span><span className="text-lg font-black text-emerald-400">R$ {calculateProduct(editingProduct).profit?.toFixed(2)}</span></div>
                                                </div>
                                            </div>
                                        </div>

                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full bg-amber-500 text-white py-6 rounded-3xl font-black text-[10px] uppercase hover:bg-amber-600 transition-all shadow-lg shadow-amber-200">Salvar Dados</button>
                                        <button onClick={() => confirm('Excluir produto?') && (db.ref(`products/${editingProduct.id}`).remove(), setEditingProduct(null))} className="w-full text-rose-500 font-black text-[9px] uppercase tracking-widest opacity-40 hover:opacity-100 transition-all">Excluir Permanente</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Inicializar Ícones
        setTimeout(() => { lucide.createIcons(); }, 500);
    </script>
</body>
</html>
