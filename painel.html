<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema de Gestão Total</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F1F5F9; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 1.5, weight: 20 }, 
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } 
            });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('marketplaces').on('value', s => setMarketplaces(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            const calculateProduct = (prod) => {
                if(!prod) return {};
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || { commission: 20, fixedFee: 3, extraFees: [] };
                
                // Custo do Banho
                const bathVal = (Number(prod.baseWeight) || 0) * (logistics.bathCosts[prod.bathType] || 0);
                
                // Custos Adicionais do Produto
                const productExtras = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0);
                
                // Taxas Extras do Canal
                const channelExtras = (mp.extraFees || []).reduce((acc, f) => acc + Number(f.value || 0), 0);
                
                const totalProdCost = bathVal + productExtras + Number(logistics.packaging.cost);
                const totalFixedFees = Number(mp.fixedFee) + channelExtras;
                
                const divisor = (1 - (Number(mp.commission) + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + totalFixedFees) / divisor : 0;
                
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                const comissaoVal = finalPrice * (Number(mp.commission) / 100);
                const profit = finalPrice - totalProdCost - comissaoVal - totalFixedFees;
                
                return { totalProdCost, finalPrice, profit, suggestedPrice };
            };

            return (
                <div className="flex min-h-screen bg-[#F8FAFC]">
                    {/* Sidebar Original */}
                    <aside className="w-20 lg:w-64 bg-slate-900 text-white p-6 fixed h-full z-50">
                        <div className="mb-12 flex items-center gap-3 px-2">
                            <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-900 font-black">L</div>
                            <span className="hidden lg:block font-black tracking-tighter text-xl italic">LUARY SHOP</span>
                        </div>
                        <nav className="space-y-2">
                            {[
                                { id: 'catalogo', icon: 'package', label: 'Produtos' },
                                { id: 'marketplaces', icon: 'shopping-cart', label: 'Canais' },
                                { id: 'logistics', icon: 'truck', label: 'Logística' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl font-bold transition-all ${activeTab === item.id ? 'bg-amber-500 text-slate-900 shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:bg-white/5'}`}>
                                    <Icon name={item.icon} />
                                    <span className="hidden lg:block text-sm">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <main className="ml-20 lg:ml-64 p-8 w-full max-w-7xl mx-auto">
                        
                        {/* ABA: PRODUTOS COM IMAGEM */}
                        {activeTab === 'catalogo' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <header className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-900">Catálogo de SKUs</h2>
                                        <p className="text-slate-500 font-medium">Gestão de custos e semijoias</p>
                                    </div>
                                    <button onClick={() => {
                                        const key = db.ref('products').push().key;
                                        const p = { id: key, sku: 'SKU-000', name: 'Novo Produto Luary', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 50, selectedMarketplace: marketplaces[0]?.id || 'shopee', imageUrl: '', additionalCosts: [] };
                                        db.ref(`products/${key}`).set(p);
                                        setEditingProduct(p);
                                    }} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">+ NOVO PRODUTO</button>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {products.map(p => {
                                        const res = calculateProduct(p);
                                        return (
                                            <div key={p.id} className="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl transition-all group">
                                                <div className="aspect-video bg-slate-100 relative overflow-hidden">
                                                    {p.imageUrl ? <img src={p.imageUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="image" size={48} /></div>}
                                                    <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter shadow-sm">{p.sku}</div>
                                                    <button onClick={() => setEditingProduct(p)} className="absolute bottom-4 right-4 bg-slate-900 text-white p-4 rounded-2xl shadow-xl opacity-0 group-hover:opacity-100 transition-all translate-y-2 group-hover:translate-y-0"><Icon name="edit-3" size={18}/></button>
                                                </div>
                                                <div className="p-6">
                                                    <h3 className="font-bold text-slate-800 mb-4 h-12 line-clamp-2">{p.name}</h3>
                                                    <div className="flex justify-between items-end bg-slate-50 p-4 rounded-2xl">
                                                        <div><p className="text-[9px] font-black text-slate-400 uppercase">Preço Venda</p><p className="font-black text-slate-900">R$ {res.finalPrice?.toFixed(2)}</p></div>
                                                        <div className="text-right"><p className="text-[9px] font-black text-slate-400 uppercase">Lucro</p><p className="font-black text-emerald-500">R$ {res.profit?.toFixed(2)}</p></div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ABA: CANAIS COM ADIÇÃO DE CUSTOS */}
                        {activeTab === 'marketplaces' && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-4">
                                <h2 className="text-3xl font-black italic">Configuração de Canais</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {marketplaces.map(mp => (
                                        <div key={mp.id} className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-4 mb-8">
                                                <div className="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center text-amber-500"><Icon name="shopping-bag" size={28}/></div>
                                                <h3 className="text-2xl font-black">{mp.name}</h3>
                                            </div>
                                            <div className="space-y-6">
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Comissão %</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none focus:ring-2 ring-amber-500/20" value={mp.commission} onChange={e => db.ref(`marketplaces/${mp.id}`).update({commission: e.target.value})} /></div>
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Taxa Fixa R$</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none focus:ring-2 ring-amber-500/20" value={mp.fixedFee} onChange={e => db.ref(`marketplaces/${mp.id}`).update({fixedFee: e.target.value})} /></div>
                                                </div>
                                                
                                                <div className="pt-6 border-t border-slate-100">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Taxas Extras do Canal</h4>
                                                        <button onClick={() => {
                                                            const fees = [...(mp.extraFees || []), { label: 'Nova Taxa', value: 0 }];
                                                            db.ref(`marketplaces/${mp.id}`).update({ extraFees: fees });
                                                        }} className="text-[10px] font-black bg-slate-900 text-white px-3 py-1 rounded-full">+ ADD TAXA</button>
                                                    </div>
                                                    <div className="space-y-3">
                                                        {(mp.extraFees || []).map((fee, idx) => (
                                                            <div key={idx} className="flex gap-2">
                                                                <input className="flex-1 bg-slate-50 p-3 rounded-xl text-xs font-bold" value={fee.label} onChange={e => {
                                                                    const fees = [...mp.extraFees]; fees[idx].label = e.target.value;
                                                                    db.ref(`marketplaces/${mp.id}`).update({ extraFees: fees });
                                                                }} />
                                                                <input type="number" className="w-20 bg-slate-50 p-3 rounded-xl text-xs font-black text-amber-600" value={fee.value} onChange={e => {
                                                                    const fees = [...mp.extraFees]; fees[idx].value = e.target.value;
                                                                    db.ref(`marketplaces/${mp.id}`).update({ extraFees: fees });
                                                                }} />
                                                                <button onClick={() => {
                                                                    const fees = mp.extraFees.filter((_, i) => i !== idx);
                                                                    db.ref(`marketplaces/${mp.id}`).update({ extraFees: fees });
                                                                }} className="text-rose-500 p-2"><Icon name="trash-2" size={16}/></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ABA: LOGÍSTICA COMPLETA */}
                        {activeTab === 'logistics' && (
                            <div className="space-y-8 animate-in slide-in-from-right-4">
                                <h2 className="text-3xl font-black italic">Logística & Insumos</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 text-white p-10 rounded-[3.5rem] shadow-2xl">
                                        <h3 className="text-amber-500 font-black mb-8 uppercase tracking-widest text-xs flex items-center gap-2"><Icon name="droplet"/> Tabela de Banhos (R$/grama)</h3>
                                        <div className="space-y-4">
                                            {Object.entries(logistics.bathCosts).map(([key, val]) => (
                                                <div key={key} className="flex items-center justify-between bg-white/5 p-5 rounded-3xl border border-white/5 group hover:border-amber-500/50 transition-all">
                                                    <span className="capitalize font-black tracking-tight">{key.replace('_', ' ')}</span>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-slate-500 font-bold text-xs">R$</span>
                                                        <input type="number" step="0.01" className="bg-transparent text-right font-black text-amber-500 w-24 outline-none text-xl" value={val} onChange={e => {
                                                            const newBaths = {...logistics.bathCosts, [key]: e.target.value};
                                                            db.ref('logistics').update({bathCosts: newBaths});
                                                        }} />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-8">
                                        <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                            <h3 className="font-black mb-6 uppercase text-slate-400 text-[10px] tracking-widest flex items-center gap-2"><Icon name="package" size={16}/> Embalagem & Brindes</h3>
                                            <div className="grid grid-cols-2 gap-6">
                                                <div className="bg-slate-50 p-6 rounded-3xl">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Custo Fixo (R$)</label>
                                                    <input type="number" className="bg-transparent text-3xl font-black outline-none w-full" value={logistics.packaging.cost} onChange={e => db.ref('logistics/packaging').update({cost: e.target.value})} />
                                                </div>
                                                <div className="bg-slate-50 p-6 rounded-3xl">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Peso Médio (g)</label>
                                                    <input type="number" className="bg-transparent text-3xl font-black outline-none w-full" value={logistics.packaging.weight} onChange={e => db.ref('logistics/packaging').update({weight: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE EDIÇÃO RESTAURADO - COM TODOS OS CAMPOS */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
                            <div className="bg-slate-900 text-white w-full max-w-5xl rounded-[3rem] p-10 shadow-2xl border border-white/10 max-h-[90vh] overflow-y-auto custom-scroll">
                                <div className="flex justify-between items-center mb-10">
                                    <div><h2 className="text-3xl font-black italic uppercase tracking-tighter">Editor de Produto</h2><p className="text-amber-500 font-bold text-[10px] tracking-[0.3em]">LUARY SHOP BUSINESS</p></div>
                                    <button onClick={() => setEditingProduct(null)} className="p-4 bg-white/5 rounded-full hover:bg-rose-500 transition-all"><Icon name="x" /></button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                                    <div className="lg:col-span-7 space-y-8">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-500 uppercase ml-4 tracking-widest">Link da Imagem</label>
                                                <input className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-medium outline-none focus:border-amber-500 transition-all text-xs" placeholder="URL da foto (Shopee/Pinterest)" value={editingProduct.imageUrl} onChange={e => setEditingProduct({...editingProduct, imageUrl: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-500 uppercase ml-4 tracking-widest">SKU</label>
                                                    <input className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-black text-amber-500 outline-none uppercase" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-500 uppercase ml-4 tracking-widest">Peso (g)</label>
                                                    <input type="number" className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-black outline-none" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-500 uppercase ml-4 tracking-widest">Nome do Produto</label>
                                            <input className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-bold outline-none" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} />
                                        </div>

                                        <div className="bg-white/5 p-8 rounded-[2.5rem] border border-white/5">
                                            <div className="flex justify-between items-center mb-6">
                                                <h4 className="text-[10px] font-black uppercase text-amber-500 tracking-widest">Custos Adicionais (Insumos)</h4>
                                                <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...(editingProduct.additionalCosts || []), {item: '', value: 0}]})} className="bg-white/10 px-4 py-2 rounded-full text-[9px] font-black hover:bg-white/20">+ ADD ITEM</button>
                                            </div>
                                            <div className="space-y-3">
                                                {(editingProduct.additionalCosts || []).map((c, idx) => (
                                                    <div key={idx} className="flex gap-4">
                                                        <input className="flex-1 bg-slate-800 p-4 rounded-2xl text-xs font-bold" placeholder="Ex: Argola Especial" value={c.item} onChange={e => {
                                                            const nc = [...editingProduct.additionalCosts]; nc[idx].item = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} />
                                                        <input type="number" className="w-24 bg-slate-800 p-4 rounded-2xl text-xs font-black text-amber-500" value={c.value} onChange={e => {
                                                            const nc = [...editingProduct.additionalCosts]; nc[idx].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} />
                                                        <button onClick={() => {
                                                            const nc = editingProduct.additionalCosts.filter((_, i) => i !== idx); setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} className="text-rose-500"><Icon name="trash-2" size={18}/></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-5 space-y-6">
                                        <div className="bg-amber-500 rounded-[2.5rem] p-8 text-slate-900">
                                            <p className="text-[10px] font-black uppercase opacity-60 mb-2 tracking-widest">Preço Sugerido</p>
                                            <div className="flex items-baseline gap-1">
                                                <span className="text-2xl font-bold">R$</span>
                                                <span className="text-6xl font-black tracking-tighter">{calculateProduct(editingProduct).suggestedPrice?.toFixed(2)}</span>
                                            </div>
                                        </div>

                                        <div className="bg-white/5 border border-white/10 rounded-[2.5rem] p-8 space-y-6">
                                            <div>
                                                <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-4">Estratégia</label>
                                                <div className="flex bg-slate-800 p-2 rounded-2xl gap-2">
                                                    <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`flex-1 py-3 rounded-xl font-black text-[10px] transition-all ${editingProduct.strategy === 'margem' ? 'bg-white text-slate-900 shadow-xl' : 'text-slate-500'}`}>POR MARGEM %</button>
                                                    <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`flex-1 py-3 rounded-xl font-black text-[10px] transition-all ${editingProduct.strategy === 'fixo' ? 'bg-white text-slate-900 shadow-xl' : 'text-slate-500'}`}>PREÇO FIXO R$</button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">{editingProduct.strategy === 'margem' ? 'Margem Desejada %' : 'Preço de Venda Final'}</label>
                                                <input type="number" className="w-full bg-transparent text-5xl font-black outline-none border-b-2 border-white/10 focus:border-amber-500 pb-2" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} />
                                            </div>

                                            <div className="pt-6 border-t border-white/5 space-y-4">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase text-slate-500">Lucro Real</span><span className="text-2xl font-black text-emerald-400">R$ {calculateProduct(editingProduct).profit?.toFixed(2)}</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase text-slate-500">Custo Produção</span><span className="text-lg font-black text-slate-300">R$ {calculateProduct(editingProduct).totalProdCost?.toFixed(2)}</span></div>
                                            </div>
                                        </div>

                                        <div className="flex gap-4">
                                            <button onClick={() => { if(confirm("Apagar permanentemente?")) { db.ref(`products/${editingProduct.id}`).remove(); setEditingProduct(null); } }} className="flex-1 bg-rose-500/10 text-rose-500 py-5 rounded-3xl font-black text-xs hover:bg-rose-500 hover:text-white transition-all">EXCLUIR</button>
                                            <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="flex-[2] bg-white text-slate-900 py-5 rounded-3xl font-black text-xs hover:bg-amber-500 transition-all">SALVAR SKU</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
