<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Empire Edition</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0F172A; color: #F8FAFC; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-gradient { background: linear-gradient(135deg, #FDE047 0%, #EAB308 100%); }
        .product-card:hover { transform: translateY(-10px); border-color: #EAB308; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #EAB308; border-radius: 10px; }
        input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = { databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [products, setProducts] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeTab, setActiveTab] = useState('estoque');

            // Canais e Logística do arquivo 666
            const channels = {
                shopee: { name: "Shopee", commission: 0.20, fixed: 3 },
                ml: { name: "M. Livre", commission: 0.14, fixed: 5 },
                site: { name: "Loja Direta", commission: 0.02, fixed: 0 }
            };

            const bathRates = { ouro: 0.85, prata: 0.60, niquel: 0.40 };

            useEffect(() => {
                const ref = db.ref('products');
                ref.on('value', (snap) => {
                    const data = snap.val();
                    setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                return () => ref.off();
            }, []);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [products, editingProduct, activeTab]);

            const calculate = (p) => {
                if (!p) return {};
                const cost = parseFloat(p.price) || 0;
                const weight = parseFloat(p.weight) || 0;
                const bathVal = bathRates[p.bathType] || parseFloat(p.bathPrice) || 0;
                const totalCost = cost + (weight * bathVal);
                
                const results = {};
                Object.keys(channels).forEach(c => {
                    const chan = channels[c];
                    const margin = (parseFloat(p.margin) || 35) / 100;
                    const divisor = 1 - (chan.commission + margin + 0.04);
                    results[c] = divisor > 0 ? (totalCost + chan.fixed) / divisor : 0;
                });
                return { totalCost, results };
            };

            const filtered = products.filter(p => p.name?.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="max-w-5xl mx-auto min-h-screen p-6 pb-32">
                    {/* Header Luxo */}
                    <header className="flex justify-between items-center mb-12 py-6">
                        <div>
                            <h1 className="text-5xl font-black tracking-tighter gold-gradient bg-clip-text text-transparent italic">LUARY SHOP</h1>
                            <p className="text-[10px] tracking-[0.3em] font-bold text-slate-500 uppercase">Jewelry Business Intelligence</p>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setEditingProduct({ name: '', price: '', weight: '', margin: '35', bathType: 'ouro', stock: 0, image: '' })} 
                                    className="gold-gradient text-slate-900 px-8 py-4 rounded-2xl font-black text-xs uppercase flex items-center gap-2 shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                                <i data-lucide="plus-circle" className="w-5 h-5"></i> Novo Produto
                            </button>
                        </div>
                    </header>

                    {/* Dashboard Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                        <div className="glass p-8 rounded-[2.5rem]">
                            <p className="text-slate-500 text-[10px] font-black uppercase mb-2">Total Itens</p>
                            <p className="text-4xl font-black tracking-tighter">{products.length}</p>
                        </div>
                        <div className="glass p-8 rounded-[2.5rem] border-l-4 border-amber-500">
                            <p className="text-slate-500 text-[10px] font-black uppercase mb-2">Valor em Estoque</p>
                            <p className="text-4xl font-black tracking-tighter">
                                R$ {products.reduce((acc, p) => acc + (parseFloat(p.price) * (p.stock || 0)), 0).toFixed(2)}
                            </p>
                        </div>
                        <div className="glass p-8 rounded-[2.5rem]">
                            <div className="relative">
                                <i data-lucide="search" className="absolute left-0 top-1/2 -translate-y-1/2 text-slate-500 w-5 h-5"></i>
                                <input 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="bg-transparent border-b border-slate-700 w-full pl-8 py-2 outline-none focus:border-amber-500 transition-all font-bold" 
                                    placeholder="FILTRAR ACERVO..." 
                                />
                            </div>
                        </div>
                    </div>

                    {/* Galeria de Produtos */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                        {filtered.map(p => {
                            const res = calculate(p);
                            return (
                                <div key={p.id} onClick={() => setEditingProduct(p)} className="product-card glass rounded-[3rem] overflow-hidden cursor-pointer transition-all duration-500 group">
                                    <div className="h-64 relative overflow-hidden">
                                        <img src={p.image || 'https://images.unsplash.com/photo-1617038220319-276d3cfab638?q=80&w=640'} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#0F172A] via-transparent to-transparent"></div>
                                        <div className="absolute top-6 left-6 flex gap-2">
                                            <span className="glass px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest text-amber-400">
                                                {p.bathType || 'Banho Personalizado'}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="p-8">
                                        <h3 className="text-xl font-black mb-1 truncate">{p.name}</h3>
                                        <p className="text-[10px] text-slate-500 font-bold uppercase mb-6 tracking-widest">{p.weight}g | {p.stock} UNID.</p>
                                        
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-black text-slate-500 uppercase">Shopee</span>
                                                <span className="text-lg font-black italic text-amber-500">R$ {res.results.shopee?.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-black text-slate-500 uppercase">M. Livre</span>
                                                <span className="text-lg font-black italic">R$ {res.results.ml?.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal Editor Elite */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-xl" onClick={() => setEditingProduct(null)}></div>
                            <div className="glass w-full max-w-4xl max-h-[90vh] rounded-[4rem] overflow-hidden relative flex flex-col md:flex-row shadow-2xl border border-amber-500/30">
                                <div className="w-full md:w-1/2 h-64 md:h-auto relative bg-slate-800">
                                    <img src={editingProduct.image} className="w-full h-full object-cover" />
                                    <div className="absolute bottom-8 left-8 right-8">
                                        <input 
                                            value={editingProduct.image} 
                                            onChange={e => setEditingProduct({...editingProduct, image: e.target.value})}
                                            className="w-full glass p-4 rounded-2xl text-xs outline-none focus:ring-1 ring-amber-500" 
                                            placeholder="URL da Imagem..." 
                                        />
                                    </div>
                                </div>
                                <div className="p-10 flex-1 overflow-y-auto custom-scroll space-y-8">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-3xl font-black italic uppercase">Configurar Item</h2>
                                        <button onClick={() => setEditingProduct(null)} className="text-slate-500 hover:text-white transition-colors"><i data-lucide="x-circle"></i></button>
                                    </div>

                                    <div className="grid grid-cols-1 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-amber-500 tracking-tighter">Nome do Produto</label>
                                            <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-white/5 p-6 rounded-3xl font-bold text-2xl outline-none border border-transparent focus:border-amber-500" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Custo Bruto (R$)</label>
                                                <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} className="w-full bg-white/5 p-5 rounded-2xl font-bold outline-none" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Peso Peça (g)</label>
                                                <input type="number" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} className="w-full bg-white/5 p-5 rounded-2xl font-bold outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Tipo de Banho</label>
                                                <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-slate-800 p-5 rounded-2xl font-bold outline-none border border-slate-700">
                                                    <option value="ouro">Ouro (18k)</option>
                                                    <option value="prata">Prata (925)</option>
                                                    <option value="niquel">Níquel</option>
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase text-slate-500">Margem Lucro (%)</label>
                                                <input type="number" value={editingProduct.margin} onChange={e => setEditingProduct({...editingProduct, margin: e.target.value})} className="w-full bg-white/5 p-5 rounded-2xl font-bold outline-none" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-amber-500/10 p-8 rounded-[2.5rem] border border-amber-500/20">
                                        <p className="text-[10px] font-black uppercase text-amber-500 mb-4">Projeção Inteligente</p>
                                        <div className="flex justify-between items-end">
                                            <div>
                                                <p className="text-[9px] text-slate-500 font-bold uppercase">Sugerido Shopee</p>
                                                <p className="text-4xl font-black italic">R$ {calculate(editingProduct).results?.shopee.toFixed(2)}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[9px] text-slate-500 font-bold uppercase">Custo Total</p>
                                                <p className="text-xl font-black text-slate-400">R$ {calculate(editingProduct).totalCost.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-4">
                                        <button onClick={() => {
                                            const id = editingProduct.id || db.ref('products').push().key;
                                            db.ref(`products/${id}`).set({...editingProduct, id});
                                            setEditingProduct(null);
                                        }} className="flex-1 gold-gradient text-slate-950 py-6 rounded-[2rem] font-black uppercase italic shadow-lg">Salvar Acervo</button>
                                        
                                        {editingProduct.id && (
                                            <button onClick={() => confirm('Apagar item do sistema?') && (db.ref(`products/${editingProduct.id}`).remove(), setEditingProduct(null))} className="bg-rose-500/10 text-rose-500 px-8 rounded-[2rem] hover:bg-rose-500 hover:text-white transition-all">
                                                <i data-lucide="trash-2"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Barra de Navegação Flutuante */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 glass px-8 py-4 rounded-full flex gap-12 z-40 border-amber-500/20 shadow-2xl">
                        <button onClick={() => setActiveTab('estoque')} className={`flex flex-col items-center gap-1 ${activeTab === 'estoque' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <i data-lucide="layout-grid" className="w-6 h-6"></i>
                            <span className="text-[8px] font-black uppercase">Acervo</span>
                        </button>
                        <button onClick={() => setActiveTab('logistica')} className={`flex flex-col items-center gap-1 ${activeTab === 'logistica' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <i data-lucide="truck" className="w-6 h-6"></i>
                            <span className="text-[8px] font-black uppercase">Logística</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
