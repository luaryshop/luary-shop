<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema Completo</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select, textarea { background: #0f172a !important; color: white !important; border: 1px solid #334155 !important; border-radius: 12px !important; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 1.5, weight: 20 }, 
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4 },
                extraLogistics: [] 
            });
            const [marketplaces, setMarketplaces] = useState([
                { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3, tax: 0, extraFees: [] }
            ]);
            const [editingProduct, setEditingProduct] = useState(null);

            // Sincronização Firebase
            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
                db.ref('marketplaces').on('value', s => s.val() && setMarketplaces(Object.values(s.val())));
            }, []);

            // Lógica de Cálculo Original do arquivo 666.txt
            const calculateProduct = (p) => {
                if (!p) return { totalWeight: 0, totalProdCost: 0, profit: 0, finalPrice: 0, suggestedPrice: 0 };
                
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0];
                
                const addW = (p.additionalCosts || []).reduce((a, c) => a + Number(c.weight || 0), 0);
                const mimW = (p.mimos || []).reduce((a, m) => a + Number(m.weight || 0), 0);
                const logW = (logistics?.extraLogistics || []).reduce((a, l) => a + Number(l.weight || 0), 0);
                const totalWeight = Number(p.baseWeight || 0) + Number(logistics?.packaging?.weight || 0) + addW + mimW + logW;

                let bath = p.bathType !== 'sem_banho' ? Number(p.baseWeight || 0) * (Number(logistics?.bathCosts?.[p.bathType] || 0)) : 0;
                const addC = (p.additionalCosts || []).reduce((a, c) => a + Number(c.value || 0), 0);
                const mimC = (p.mimos || []).reduce((a, m) => a + Number(m.value || 0), 0);
                const logC = (logistics?.extraLogistics || []).reduce((a, l) => a + Number(l.value || 0), 0);
                const totalProdCost = bath + addC + mimC + Number(logistics?.packaging?.cost || 0) + logC;

                const taxP = Number(mp?.commission || 0) + Number(mp?.tax || 0) + (mp?.extraFees || []).filter(f => f.type === 'percent').reduce((a, f) => a + Number(f.value || 0), 0);
                const taxF = Number(mp?.fixedFee || 0) + (mp?.extraFees || []).filter(f => f.type === 'fixed').reduce((a, f) => a + Number(f.value || 0), 0);

                const div = (1 - (taxP + Number(p.targetMargin || 0)) / 100);
                const suggestedPrice = div > 0 ? (totalProdCost + taxF) / div : 0;
                const finalPrice = p.strategy === 'margem' ? suggestedPrice : Number(p.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * (taxP / 100)) - taxF;

                return { totalWeight, totalProdCost, finalPrice, profit, suggestedPrice };
            };

            useEffect(() => { if(window.lucide) lucide.createIcons(); });

            return (
                <div className="flex min-h-screen">
                    <aside className="w-20 lg:w-64 border-r border-white/5 bg-slate-900/50 flex flex-col p-4 sticky top-0 h-screen">
                        <div className="h-20 flex items-center px-4 mb-10 text-amber-500 font-black text-2xl italic">LUARY SHOP</div>
                        <nav className="space-y-2">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full p-4 rounded-2xl flex items-center gap-4 ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}><i data-lucide="package"></i><span className="hidden lg:block">Estoque</span></button>
                            <button onClick={() => setActiveTab('marketplaces')} className={`w-full p-4 rounded-2xl flex items-center gap-4 ${activeTab === 'marketplaces' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}><i data-lucide="shopping-bag"></i><span className="hidden lg:block">Canais</span></button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full p-4 rounded-2xl flex items-center gap-4 ${activeTab === 'logistica' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}><i data-lucide="truck"></i><span className="hidden lg:block">Logística</span></button>
                        </nav>
                    </aside>

                    <main className="flex-1 p-8">
                        {activeTab === 'catalogo' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-3xl font-black italic">Catálogo de Vendas</h1>
                                    <button onClick={() => setEditingProduct({ id: Date.now().toString(), name: '', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 40, additionalCosts: [], mimos: [], selectedMarketplace: marketplaces[0]?.id || '' })} className="bg-amber-500 text-slate-950 px-8 py-4 rounded-2xl font-black">+ NOVO SKU</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                                    {products.map(p => {
                                        const res = calculateProduct(p);
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2.5rem] p-6 group border border-white/5 hover:border-amber-500/30 transition-all">
                                                <div className="h-44 bg-slate-800 rounded-3xl mb-4 overflow-hidden relative">
                                                    {p.imageUrl && <img src={p.imageUrl} className="w-full h-full object-cover"/>}
                                                    <button onClick={() => setEditingProduct(p)} className="absolute top-3 right-3 bg-amber-500 text-slate-950 p-2 rounded-xl opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="edit-3" className="size-4"></i></button>
                                                </div>
                                                <h3 className="font-bold text-xs mb-1 uppercase text-slate-400">{p.sku}</h3>
                                                <h2 className="font-black text-sm mb-4 line-clamp-1">{p.name}</h2>
                                                
                                                <div className="space-y-2 border-t border-white/5 pt-4">
                                                    <div className="flex justify-between"><span className="text-[10px] font-bold text-slate-500 uppercase">Preço Sugerido</span><span className="text-xs font-black text-amber-500">R$ {res.suggestedPrice.toFixed(2)}</span></div>
                                                    <div className="flex justify-between font-black"><span className="text-[10px] text-slate-500 uppercase">Lucro Real</span><span className="text-lg text-emerald-400">R$ {res.profit.toFixed(2)}</span></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'marketplaces' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-black italic">Canais de Venda</h2><button onClick={() => {const id = Date.now().toString(); const n = [...marketplaces, {id, name: 'Novo Canal', commission: 0, fixedFee: 0, tax: 0, extraFees: []}]; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="text-amber-500 font-bold">+ Adicionar Canal</button></div>
                                <div className="grid gap-4">
                                    {marketplaces.map((m, idx) => (
                                        <div key={m.id} className="glass-card p-6 rounded-3xl grid grid-cols-4 gap-4 items-end">
                                            <div><label className="text-[10px] font-bold text-slate-500 uppercase">Nome</label><input value={m.name} onChange={e => {const n = [...marketplaces]; n[idx].name = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <div><label className="text-[10px] font-bold text-slate-500 uppercase">Comissão (%)</label><input type="number" value={m.commission} onChange={e => {const n = [...marketplaces]; n[idx].commission = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <div><label className="text-[10px] font-bold text-slate-500 uppercase">Taxa Fixa (R$)</label><input type="number" value={m.fixedFee} onChange={e => {const n = [...marketplaces]; n[idx].fixedFee = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <button onClick={() => {const n = marketplaces.filter(item => item.id !== m.id); setMarketplaces(n); db.ref('marketplaces').set(n)}} className="bg-rose-500/10 text-rose-500 p-3 rounded-xl hover:bg-rose-500 hover:text-white transition-all">Remover</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-2xl mx-auto glass-card p-10 rounded-[3rem] space-y-8">
                                <h2 className="text-2xl font-black italic text-amber-500 uppercase">Custos de Logística</h2>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="p-4 bg-black/20 rounded-2xl border border-white/5">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Custo da Caixa (R$)</label>
                                        <input type="number" step="0.01" value={logistics.packaging.cost} onChange={e => {const d = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}}; setLogistics(d); db.ref('logistics').set(d)}} className="w-full bg-transparent border-none text-xl font-black focus:ring-0 p-0"/>
                                    </div>
                                    <div className="p-4 bg-black/20 rounded-2xl border border-white/5">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Peso da Caixa (g)</label>
                                        <input type="number" value={logistics.packaging.weight} onChange={e => {const d = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}}; setLogistics(d); db.ref('logistics').set(d)}} className="w-full bg-transparent border-none text-xl font-black focus:ring-0 p-0"/>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <p className="text-[10px] font-black text-slate-500 uppercase border-b border-white/10 pb-2">Preço do Banho (por grama)</p>
                                    <div className="grid grid-cols-3 gap-4">
                                        {Object.keys(logistics.bathCosts).map(key => (
                                            <div key={key} className="p-3 bg-black/20 rounded-xl">
                                                <label className="text-[9px] font-bold uppercase opacity-50">{key}</label>
                                                <input type="number" step="0.01" value={logistics.bathCosts[key]} onChange={e => {const d = {...logistics, bathCosts: {...logistics.bathCosts, [key]: e.target.value}}; setLogistics(d); db.ref('logistics').set(d)}} className="w-full bg-transparent border-none p-0 text-amber-500 font-black"/>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/98 p-4 backdrop-blur-xl">
                            <div className="bg-slate-900 w-full max-w-6xl rounded-[3.5rem] border border-white/10 flex flex-col max-h-[95vh] overflow-hidden shadow-2xl">
                                <div className="p-8 border-b border-white/5 flex justify-between items-center bg-black/40">
                                    <h2 className="text-amber-500 font-black uppercase tracking-widest italic">Configurar SKU: {editingProduct.sku}</h2>
                                    <button onClick={() => setEditingProduct(null)} className="bg-white/5 p-4 rounded-2xl text-slate-400 hover:text-white transition-all"><i data-lucide="x"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-10 grid grid-cols-1 lg:grid-cols-2 gap-12 custom-scroll">
                                    <div className="space-y-8">
                                        <div className="grid grid-cols-2 gap-4">
                                            <input value={editingProduct.sku || ''} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} className="p-4 font-black text-amber-500" placeholder="SKU" />
                                            <select value={editingProduct.selectedMarketplace} onChange={e => setEditingProduct({...editingProduct, selectedMarketplace: e.target.value})} className="p-4 font-bold uppercase text-[10px]">
                                                {marketplaces.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <textarea value={editingProduct.name || ''} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full p-5 h-24 font-bold text-lg" placeholder="Nome do Produto" />
                                        
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="p-6 bg-black/40 rounded-[2rem] border border-white/5">
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-2">Peso Peça Bruta (g)</label>
                                                <input type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} className="w-full bg-transparent border-none text-4xl font-black p-0 focus:ring-0" />
                                            </div>
                                            <div className="p-6 bg-black/40 rounded-[2rem] border border-white/5">
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-2">Tipo de Banho</label>
                                                <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-transparent border-none text-xl font-black p-0 focus:ring-0 text-amber-500 uppercase">
                                                    {Object.keys(logistics.bathCosts).map(b => <option key={b} value={b} className="bg-slate-900">{b}</option>)}
                                                    <option value="sem_banho" className="bg-slate-900">Sem Banho (Bruto)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-amber-500 rounded-[3rem] p-10 text-slate-950 flex flex-col justify-between">
                                        <div className="space-y-10">
                                            <div className="flex gap-2 p-1.5 bg-black/10 rounded-2xl w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-8 py-3 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-8 py-3 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>PREÇO FIXO</button>
                                            </div>
                                            <div>
                                                <label className="text-[12px] font-black uppercase opacity-60 block">{editingProduct.strategy === 'fixo' ? 'Venda Final (R$)' : 'Margem de Lucro Alvo (%)'}</label>
                                                <input type="number" step="0.01" value={editingProduct.strategy === 'fixo' ? editingProduct.salePrice : editingProduct.targetMargin} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'fixo' ? 'salePrice' : 'targetMargin']: e.target.value})} className="bg-transparent border-none text-8xl font-black w-full p-0 focus:ring-0" />
                                            </div>
                                            <div className="border-t border-black/10 pt-10 grid grid-cols-2 gap-8 font-black">
                                                <div><p className="text-[10px] opacity-60 uppercase">Sugestão de Preço</p><p className="text-3xl italic">R$ {calculateProduct(editingProduct).suggestedPrice.toFixed(2)}</p></div>
                                                <div><p className="text-[10px] opacity-60 uppercase">Lucro Líquido Real</p><p className="text-3xl italic text-slate-900">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</p></div>
                                            </div>
                                        </div>
                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full py-8 bg-slate-950 text-amber-500 rounded-[2rem] font-black text-2xl shadow-2xl uppercase tracking-tighter hover:scale-[1.02] transition-all">Salvar SKU no Sistema</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
