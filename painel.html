<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema Anti-Falha</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        input, select, textarea { 
            background: #0f172a !important; 
            color: #fff !important; 
            border: 1px solid #334155 !important; 
            border-radius: 12px !important; 
            padding: 10px 14px !important;
        }
        label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; letter-spacing: 0.5px; }
        .btn-gold { background: #fbbf24; color: #0f172a; font-weight: 900; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            
            // Estado inicial blindado para evitar tela branca
            const [logistics, setLogistics] = useState({
                packaging: { cost: 0, weight: 0 },
                bathCosts: { ouro: 0, prata: 0, niquel: 0 }
            });

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('marketplaces').on('value', s => s.val() ? setMarketplaces(Object.values(s.val())) : setMarketplaces([{id:'shopee', name:'Shopee', commission:20, fixedFee:3}]));
                db.ref('logistics').on('value', s => {
                    if (s.val()) setLogistics(s.val());
                });
            }, []);

            // --- MOTOR DE CÁLCULO PROTEGIDO ---
            const calculate = (p) => {
                if (!p) return { totalProdCost: 0, totalWeight: 0, finalPrice: 0, profit: 0 };
                
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0] || {commission: 20, fixedFee: 3};
                
                // Banho seguro
                const bathVal = p.bathType === 'sem_banho' ? 0 : Number(logistics?.bathCosts?.[p.bathType] || 0);
                const bathCost = Number(p.baseWeight || 0) * bathVal;
                
                // Componentes seguros
                const compCost = (p.components || []).reduce((a, b) => a + Number(b.value || 0), 0);
                const compWeight = (p.components || []).reduce((a, b) => a + Number(b.weight || 0), 0);
                
                const totalProdCost = bathCost + compCost + Number(logistics?.packaging?.cost || 0);
                const totalWeight = Number(p.baseWeight || 0) + compWeight + Number(logistics?.packaging?.weight || 0);

                const comm = Number(mp.commission || 0) / 100;
                const fee = Number(mp.fixedFee || 0);
                const margin = Number(p.targetMargin || 0) / 100;

                const suggested = (totalProdCost + fee) / (1 - comm - margin);
                const finalPrice = p.strategy === 'margem' ? suggested : Number(p.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * comm) - fee;

                return { totalProdCost, totalWeight, finalPrice, profit };
            };

            useEffect(() => { if(window.lucide) lucide.createIcons(); });

            return (
                <div className="flex min-h-screen">
                    {/* Menu Lateral */}
                    <aside className="w-64 border-r border-white/5 bg-slate-900/50 p-6 flex flex-col gap-4 sticky top-0 h-screen">
                        <div className="text-amber-500 font-black text-2xl mb-8 italic">LUARY SHOP</div>
                        <button onClick={() => setActiveTab('catalogo')} className={`flex items-center gap-3 p-4 rounded-xl transition-all ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="layout-grid"></i> Catálogo</button>
                        <button onClick={() => setActiveTab('logistica')} className={`flex items-center gap-3 p-4 rounded-xl transition-all ${activeTab === 'logistica' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="truck"></i> Logística</button>
                        <button onClick={() => setActiveTab('canais')} className={`flex items-center gap-3 p-4 rounded-xl transition-all ${activeTab === 'canais' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="shopping-bag"></i> Canais</button>
                    </aside>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 p-10">
                        {activeTab === 'catalogo' && (
                            <div className="animate-in fade-in duration-500">
                                <div className="flex justify-between items-center mb-10">
                                    <h1 className="text-3xl font-black italic uppercase tracking-tighter">Produtos & Custos</h1>
                                    <button onClick={() => setEditingProduct({ id: Date.now().toString(), sku: '', name: '', baseWeight: 0, bathType: 'ouro', components: [], strategy: 'margem', targetMargin: 40, selectedMarketplace: marketplaces[0]?.id })} className="btn-gold px-8 py-4 rounded-2xl shadow-lg shadow-amber-500/20 hover:scale-105 transition-all">+ NOVO PRODUTO</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {products.map(p => {
                                        const res = calculate(p);
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2.5rem] p-7 border border-white/5 hover:border-amber-500/40 transition-all group">
                                                <div className="flex justify-between items-start mb-6">
                                                    <div>
                                                        <span className="text-[9px] font-black text-amber-500 block mb-1">{p.sku || 'SEM SKU'}</span>
                                                        <h3 className="font-bold text-lg leading-tight line-clamp-1">{p.name || 'Produto sem nome'}</h3>
                                                    </div>
                                                    <button onClick={() => setEditingProduct(p)} className="p-2 bg-white/5 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition-all"><i data-lucide="edit-3" className="size-4"></i></button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4 border-t border-white/5 pt-5">
                                                    <div><label>Preço Venda</label><p className="text-xl font-black">R$ {res.finalPrice?.toFixed(2)}</p></div>
                                                    <div className="text-right"><label>Lucro Real</label><p className="text-xl font-black text-emerald-400">R$ {res.profit?.toFixed(2)}</p></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-3xl space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                                <h2 className="text-2xl font-black italic">Painel de Logística</h2>
                                <div className="glass-card p-8 rounded-[2.5rem] grid grid-cols-3 gap-6">
                                    <div className="col-span-3 pb-2 border-b border-white/5 font-black text-amber-500 text-[10px] uppercase">Custos de Banho (Valor por Grama)</div>
                                    <div><label>Ouro (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.ouro} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, ouro: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    <div><label>Prata (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.prata} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, prata: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    <div><label>Níquel (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.niquel} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, niquel: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    
                                    <div className="col-span-3 pt-6 pb-2 border-b border-white/5 font-black text-amber-500 text-[10px] uppercase">Embalagem Padrão</div>
                                    <div className="col-span-1"><label>Custo Caixa (R$)</label><input type="number" step="0.01" value={logistics.packaging.cost} onChange={e => {const nl = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    <div className="col-span-1"><label>Peso Caixa (g)</label><input type="number" value={logistics.packaging.weight} onChange={e => {const nl = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'canais' && (
                            <div className="max-w-4xl space-y-6">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-black italic">Canais de Venda</h2><button onClick={() => {const id = Date.now().toString(); const n = [...marketplaces, {id, name: 'Novo', commission: 0, fixedFee: 0}]; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="text-amber-500 font-bold text-xs">+ NOVO CANAL</button></div>
                                {marketplaces.map((m, i) => (
                                    <div key={m.id} className="glass-card p-6 rounded-2xl grid grid-cols-4 gap-4 items-end">
                                        <div><label>Plataforma</label><input value={m.name} onChange={e => {const n = [...marketplaces]; n[i].name = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} /></div>
                                        <div><label>Comissão %</label><input type="number" value={m.commission} onChange={e => {const n = [...marketplaces]; n[i].commission = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} /></div>
                                        <div><label>Taxa Fixa R$</label><input type="number" value={m.fixedFee} onChange={e => {const n = [...marketplaces]; n[i].fixedFee = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} /></div>
                                        <button onClick={() => {const n = marketplaces.filter(it => it.id !== m.id); setMarketplaces(n); db.ref('marketplaces').set(n)}} className="p-3 bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500 hover:text-white transition-all"><i data-lucide="trash-2" className="size-4 mx-auto"></i></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Modal Editor - Blindado */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
                            <div className="bg-slate-900 w-full max-w-6xl rounded-[3.5rem] border border-white/10 flex flex-col max-h-[95vh] overflow-hidden shadow-2xl">
                                <div className="p-8 border-b border-white/5 flex justify-between items-center bg-black/20">
                                    <h2 className="text-amber-500 font-black italic uppercase tracking-widest">Editor de Produto</h2>
                                    <button onClick={() => setEditingProduct(null)} className="text-slate-500 hover:text-white transition-colors"><i data-lucide="x"></i></button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-10 grid grid-cols-1 lg:grid-cols-2 gap-12 custom-scroll">
                                    <div className="space-y-8">
                                        <div className="space-y-4">
                                            <div><label>Nome do Produto</label><input className="w-full font-bold text-lg" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} placeholder="Ex: Chaveiro Ferradura" /></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label>SKU / Referência</label><input className="w-full font-black text-amber-500 uppercase" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} placeholder="LUARY-001" /></div>
                                                <div><label>Canal de Venda</label>
                                                    <select className="w-full" value={editingProduct.selectedMarketplace} onChange={e => setEditingProduct({...editingProduct, selectedMarketplace: e.target.value})}>
                                                        {marketplaces.map(m => <option key={m.id} value={m.id} className="bg-slate-900">{m.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-6 p-7 bg-white/5 rounded-[2rem] border border-white/5">
                                            <div><label>Peso Bruto da Peça (g)</label><input type="number" className="w-full text-3xl font-black bg-transparent border-none p-0" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} /></div>
                                            <div><label>Tipo de Banho</label>
                                                <select className="w-full text-amber-500 font-black uppercase text-sm" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}>
                                                    <option value="ouro">Ouro</option>
                                                    <option value="prata">Prata</option>
                                                    <option value="niquel">Níquel</option>
                                                    <option value="sem_banho">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center"><label>Itens Agregados (Argolas, Correntes, Brindes)</label><button onClick={() => setEditingProduct({...editingProduct, components: [...(editingProduct.components || []), {name:'', value:0, weight:0}]})} className="text-amber-500 font-black text-[10px]">+ ADICIONAR ITEM</button></div>
                                            {(editingProduct.components || []).map((c, i) => (
                                                <div key={i} className="flex gap-2 items-center bg-black/20 p-2 rounded-xl animate-in zoom-in-95 duration-200">
                                                    <div className="flex-1"><label>Item</label><input placeholder="Nome" value={c.name} onChange={e => {const n = [...editingProduct.components]; n[i].name = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                    <div className="w-24"><label>Peso (g)</label><input type="number" value={c.weight} onChange={e => {const n = [...editingProduct.components]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                    <div className="w-24"><label>Custo R$</label><input type="number" value={c.value} onChange={e => {const n = [...editingProduct.components]; n[i].value = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                    <button onClick={() => setEditingProduct({...editingProduct, components: editingProduct.components.filter((_, idx) => idx !== i)})} className="text-rose-500 pt-5 px-2"><i data-lucide="trash-2" className="size-4"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Painel de Resultado Lateral */}
                                    <div className="bg-amber-500 rounded-[3rem] p-10 text-slate-950 flex flex-col justify-between shadow-2xl">
                                        <div className="space-y-8">
                                            <div className="flex gap-2 p-1 bg-black/10 rounded-2xl w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-8 py-3 rounded-xl text-[10px] font-black transition-all ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500 shadow-xl' : 'opacity-40'}`}>CALCULAR PELA MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-8 py-3 rounded-xl text-[10px] font-black transition-all ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500 shadow-xl' : 'opacity-40'}`}>PREÇO FIXO DE VENDA</button>
                                            </div>
                                            <div>
                                                <label className="text-slate-900 opacity-60">{editingProduct.strategy === 'margem' ? 'Quanto você quer de lucro (%)?' : 'Por quanto quer vender (R$)?'}</label>
                                                <input type="number" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} className="!bg-slate-950/20 !border-slate-950/30 !text-7xl font-black !w-full" />
                                            </div>
                                            <div className="pt-8 border-t border-black/10 space-y-4">
                                                <div className="flex justify-between font-bold text-sm"><span>Custo de Produção:</span><span>R$ {calculate(editingProduct).totalProdCost.toFixed(2)}</span></div>
                                                <div className="flex justify-between font-bold text-sm"><span>Peso Total Envio:</span><span>{calculate(editingProduct).totalWeight.toFixed(1)}g</span></div>
                                                <div className="flex justify-between font-black text-3xl pt-4"><span>LUCRO LÍQUIDO:</span><span className="text-slate-900 italic">R$ {calculate(editingProduct).profit.toFixed(2)}</span></div>
                                            </div>
                                        </div>
                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full py-8 bg-slate-950 text-amber-500 rounded-[2rem] font-black text-2xl uppercase tracking-tighter hover:scale-[1.02] transition-all shadow-2xl">Finalizar & Salvar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
