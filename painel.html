<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão de Precisão</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            // --- ESTADOS PRESERVADOS (666.txt) ---
            const [activeTab, setActiveTab] = useState('catalogo');
            const [searchTerm, setSearchTerm] = useState('');
            
            const [logistics, setLogistics] = useState({
                packaging: { cost: 1.5, weight: 20 },
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4 }
            });

            const [marketplaces, setMarketplaces] = useState([
                { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3, tax: 0, extraFees: [] },
                { id: 'ml', name: 'Mercado Livre', commission: 16, fixedFee: 6, tax: 4, extraFees: [] }
            ]);

            const [products, setProducts] = useState([
                { id: '1', sku: 'CHV-SAOBENTO-01865', name: 'Chaveiro Medalha de São Bento Dourada Semijoia Proteção Banhado a Ouro 18k Presente Luary Shop', baseWeight: 15, imageUrl: 'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=400', bathType: 'ouro', strategy: 'fixo', salePrice: 39.9, targetMargin: 50, additionalCosts: [], mimos: [], selectedMarketplace: 'shopee' },
                { id: '2', sku: 'CHV-FRD-CVALO-00611', name: 'Chaveiro Folheado a Ouro 18k Ferradura Sorte e Cavalo Country Dourado Semijoia Presente Agropecuário', baseWeight: 15, imageUrl: 'https://images.unsplash.com/photo-1598560917505-59a3ad559071?q=80&w=400', bathType: 'ouro', strategy: 'fixo', salePrice: 45.0, targetMargin: 50, additionalCosts: [], mimos: [], selectedMarketplace: 'shopee' }
            ]);

            const [editingProduct, setEditingProduct] = useState(null);
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);

            // --- LÓGICA DE CÁLCULO PRESERVADA ---
            const calculateProduct = (prod) => {
                if (!prod) return { totalWeight: 0, bathCost: 0, totalProdCost: 0, finalPrice: 0, suggestedPrice: 0, profit: 0, realMargin: 0, totalMpFees: 0 };
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || marketplaces[0];
                const addWeight = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.weight || 0), 0);
                const mimWeight = (prod.mimos || []).reduce((acc, m) => acc + Number(m.weight || 0), 0);
                const totalWeight = Number(prod.baseWeight || 0) + Number(logistics.packaging.weight || 0) + addWeight + mimWeight;
                let bathCost = prod.bathType !== 'sem_banho' ? Number(prod.baseWeight || 0) * (Number(logistics.bathCosts[prod.bathType]) || 0) : 0;
                const totalProdCost = bathCost + (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0) + (prod.mimos || []).reduce((acc, m) => acc + Number(m.value || 0), 0) + Number(logistics.packaging.cost || 0);
                const totalPercentTax = Number(mp.commission || 0) + Number(mp.tax || 0);
                const divisor = (1 - (totalPercentTax + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + Number(mp.fixedFee || 0)) / divisor : 0;
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                const totalMpFees = (finalPrice * (totalPercentTax / 100)) + Number(mp.fixedFee || 0);
                const profit = finalPrice - totalProdCost - totalMpFees;
                return { totalWeight, totalProdCost, finalPrice, suggestedPrice, profit, realMargin: finalPrice > 0 ? (profit / finalPrice) * 100 : 0 };
            };

            const saveProduct = () => {
                setProducts(products.map(p => p.id === editingProduct.id ? editingProduct : p));
                setIsProductModalOpen(false);
            };

            const filteredProducts = products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.sku.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="flex min-h-screen bg-[#F8FAFC] text-slate-800">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-64 bg-slate-900 flex flex-col p-4 lg:p-6 sticky top-0 h-screen z-20">
                        <div className="mb-10 flex items-center gap-3">
                            <div className="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center text-white font-black shadow-lg">L</div>
                            <h1 className="hidden lg:block text-white font-bold text-lg">Luary Shop</h1>
                        </div>
                        <nav className="space-y-2">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full flex items-center gap-4 px-3 py-3 rounded-xl ${activeTab === 'catalogo' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="layout-grid"></i> <span className="hidden lg:block font-bold text-sm">Meus SKUs</span>
                            </button>
                            <button onClick={() => setActiveTab('marketplaces')} className={`w-full flex items-center gap-4 px-3 py-3 rounded-xl ${activeTab === 'marketplaces' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="shopping-bag"></i> <span className="hidden lg:block font-bold text-sm">Canais</span>
                            </button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full flex items-center gap-4 px-3 py-3 rounded-xl ${activeTab === 'logistica' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="truck"></i> <span className="hidden lg:block font-bold text-sm">Logística</span>
                            </button>
                        </nav>
                    </aside>

                    <main className="flex-1 p-4 lg:p-8">
                        {activeTab === 'catalogo' && (
                            <div className="max-w-7xl mx-auto space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border flex justify-between items-center">
                                    <h2 className="text-2xl font-black">Catálogo Luary</h2>
                                    <input placeholder="Buscar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-50 border rounded-2xl px-4 py-2 outline-none w-64" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {filteredProducts.map(prod => {
                                        const res = calculateProduct(prod);
                                        return (
                                            <div key={prod.id} className="bg-white rounded-[2.5rem] border overflow-hidden group hover:shadow-xl transition-all">
                                                <div className="relative pt-[100%] bg-slate-100">
                                                    <img src={prod.imageUrl} className="absolute inset-0 w-full h-full object-cover" />
                                                    <button onClick={() => { setEditingProduct({...prod}); setIsProductModalOpen(true); }} className="absolute top-4 right-4 p-2 bg-indigo-600 text-white rounded-xl opacity-0 group-hover:opacity-100 transition-all">Editar</button>
                                                </div>
                                                <div className="p-6">
                                                    <h3 className="font-bold text-[13px] line-clamp-2 h-10 mb-4">{prod.name}</h3>
                                                    <div className={`p-4 rounded-3xl ${res.profit > 0 ? 'bg-slate-900 text-white' : 'bg-rose-900 text-white'}`}>
                                                        <div className="flex justify-between text-[10px] uppercase opacity-50 mb-1"><span>Margem</span><span>{res.realMargin.toFixed(1)}%</span></div>
                                                        <div className="flex justify-between items-end"><span>LUCRO</span><span className="text-xl font-black">R$ {res.profit.toFixed(2)}</span></div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                        {/* Outras abas aqui (Marketplace/Logística) seguindo o padrão... */}
                    </main>

                    {/* Modal Simples para o Github */}
                    {isProductModalOpen && editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md">
                            <div className="bg-white w-full max-w-4xl p-8 rounded-[3rem] shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-black italic">Editar Produto</h2>
                                    <button onClick={saveProduct} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black uppercase text-xs">Salvar Alterações</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <label className="text-[10px] font-black uppercase">Preço de Venda (R$)</label>
                                        <input type="number" value={editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, salePrice: e.target.value})} className="w-full bg-slate-50 border p-4 rounded-2xl text-2xl font-black" />
                                        <label className="text-[10px] font-black uppercase">Margem Alvo (%)</label>
                                        <input type="number" value={editingProduct.targetMargin} onChange={e => setEditingProduct({...editingProduct, targetMargin: e.target.value})} className="w-full bg-slate-50 border p-4 rounded-2xl text-2xl font-black" />
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-3xl space-y-4">
                                        <div className="flex justify-between font-bold"><span>Custo Prod:</span><span>R$ {calculateProduct(editingProduct).totalProdCost.toFixed(2)}</span></div>
                                        <div className="flex justify-between font-bold"><span>Sugerido:</span><span className="text-indigo-600">R$ {calculateProduct(editingProduct).suggestedPrice.toFixed(2)}</span></div>
                                        <div className="pt-4 border-t flex justify-between text-2xl font-black"><span>LUCRO:</span><span className="text-emerald-500">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Inicializa os ícones do Lucide após o render
        setTimeout(() => lucide.createIcons(), 500);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
