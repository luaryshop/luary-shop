<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão Inteligente v3</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        select { appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 1.5, weight: 20 }, 
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } 
            });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('marketplaces').on('value', s => setMarketplaces(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            const calculateProduct = (prod) => {
                if(!prod) return { totalProdCost: 0, finalPrice: 0, profit: 0, suggestedPrice: 0, totalWeight: 0 };
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || { commission: 20, fixedFee: 3, extraFees: [] };
                
                const extraCostsSum = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0);
                const extraWeightsSum = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.weight || 0), 0);
                const totalWeight = Number(prod.baseWeight || 0) + Number(logistics.packaging.weight || 0) + extraWeightsSum;
                const bathVal = (Number(prod.baseWeight) || 0) * (Number(logistics.bathCosts[prod.bathType]) || 0);
                
                const totalProdCost = bathVal + extraCostsSum + Number(logistics.packaging.cost);
                
                // Lógica de Taxas Extras do Canal (Valor vs Porcentagem)
                const fixedFeesSum = Number(mp.fixedFee || 0) + (mp.extraFees || []).reduce((acc, f) => f.type === 'fixo' ? acc + Number(f.value || 0) : acc, 0);
                const percentFeesSum = Number(mp.commission || 0) + (mp.extraFees || []).reduce((acc, f) => f.type === 'percent' ? acc + Number(f.value || 0) : acc, 0);
                
                const divisor = (1 - (percentFeesSum + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + fixedFeesSum) / divisor : 0;
                
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                
                // Cálculo das taxas variáveis sobre o preço final para o lucro
                const variableFeesAmount = finalPrice * (percentFeesSum / 100);
                const profit = finalPrice - totalProdCost - variableFeesAmount - fixedFeesSum;
                
                return { totalProdCost, finalPrice, profit, suggestedPrice, totalWeight };
            };

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-64 bg-slate-900 text-white p-6 fixed h-full z-20 shadow-xl">
                        <div className="mb-12 font-black italic text-xl hidden lg:block text-amber-500 uppercase tracking-tighter">Luary Shop</div>
                        <nav className="space-y-4">
                            {[
                                { id: 'catalogo', icon: 'package', label: 'Produtos' },
                                { id: 'marketplaces', icon: 'shopping-cart', label: 'Canais' },
                                { id: 'logistics', icon: 'truck', label: 'Logística' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-900 shadow-lg' : 'text-slate-500 hover:bg-white/5'}`}>
                                    <Icon name={tab.icon} />
                                    <span className="hidden lg:block font-bold text-xs uppercase tracking-widest">{tab.label}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <main className="ml-20 lg:ml-64 p-8 w-full max-w-7xl mx-auto">
                        
                        {/* CATÁLOGO COM TROCA DE CANAL */}
                        {activeTab === 'catalogo' && (
                            <div className="space-y-8 animate-in fade-in">
                                <header className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black text-slate-900 italic uppercase">Catálogo Inteligente</h2>
                                    <button onClick={() => {
                                        const key = db.ref('products').push().key;
                                        db.ref(`products/${key}`).set({ id: key, sku: 'SKU-TEMP', name: 'Nova Peça', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 50, selectedMarketplace: marketplaces[0]?.id || 'shopee', imageUrl: '', additionalCosts: [] });
                                    }} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black shadow-xl hover:bg-amber-500 transition-all text-[10px] uppercase tracking-widest">+ Adicionar SKU</button>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {products.map(p => {
                                        const res = calculateProduct(p);
                                        return (
                                            <div key={p.id} className="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl transition-all group flex flex-col">
                                                <div className="aspect-square bg-slate-100 relative overflow-hidden">
                                                    {p.imageUrl ? <img src={p.imageUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="image" size={48} /></div>}
                                                    <div className="absolute top-4 left-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-sm">{p.sku}</div>
                                                    <div className="absolute top-4 right-4 bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] font-black shadow-sm">{res.totalWeight?.toFixed(1)}g</div>
                                                    <button onClick={() => setEditingProduct(p)} className="absolute bottom-4 right-4 bg-slate-900 text-white p-4 rounded-2xl shadow-xl opacity-0 group-hover:opacity-100 transition-all hover:bg-amber-500"><Icon name="edit-3" /></button>
                                                </div>
                                                <div className="p-6 space-y-4 flex-1 flex flex-col">
                                                    <h3 className="font-bold text-slate-800 text-sm line-clamp-2 h-10">{p.name}</h3>
                                                    <div className="relative">
                                                        <select className="w-full bg-slate-900 text-white text-[10px] font-black p-3.5 rounded-xl uppercase tracking-widest outline-none cursor-pointer" value={p.selectedMarketplace} onChange={(e) => db.ref(`products/${p.id}`).update({ selectedMarketplace: e.target.value })}>
                                                            {marketplaces.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                                        </select>
                                                    </div>
                                                    <div className="mt-auto grid grid-cols-2 gap-3 pt-4 border-t border-slate-50">
                                                        <div className="bg-slate-50 p-4 rounded-2xl text-center">
                                                            <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Venda</p>
                                                            <p className="font-black text-slate-900 text-base">R$ {res.finalPrice?.toFixed(2)}</p>
                                                        </div>
                                                        <div className={`p-4 rounded-2xl border text-center ${res.profit > 0 ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-rose-50 border-rose-100 text-rose-600'}`}>
                                                            <p className="text-[8px] font-black text-slate-400 uppercase mb-1">Lucro</p>
                                                            <p className="font-black text-base italic">R$ {res.profit?.toFixed(2)}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* CONFIGURAÇÃO DE CANAIS (TAXA FIXA VS PERCENTUAL) */}
                        {activeTab === 'marketplaces' && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-4">
                                <h2 className="text-3xl font-black italic uppercase text-slate-900">Configuração de Canais</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {marketplaces.map(mp => (
                                        <div key={mp.id} className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-4 mb-8">
                                                <div className="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center text-amber-500 shadow-lg"><Icon name="shopping-bag" size={28}/></div>
                                                <h3 className="text-2xl font-black uppercase tracking-tighter">{mp.name}</h3>
                                            </div>
                                            <div className="space-y-6">
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Comissão Padrão %</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.commission} onChange={e => db.ref(`marketplaces/${mp.id}`).update({commission: e.target.value})} /></div>
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Taxa Fixa R$</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.fixedFee} onChange={e => db.ref(`marketplaces/${mp.id}`).update({fixedFee: e.target.value})} /></div>
                                                </div>
                                                <div className="pt-6 border-t border-slate-100">
                                                    <div className="flex justify-between items-center mb-6"><h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Outras Taxas (ADS, Antecipação, etc)</h4><button onClick={() => db.ref(`marketplaces/${mp.id}`).update({ extraFees: [...(mp.extraFees || []), { label: 'Nova Taxa', value: 0, type: 'fixo' }] })} className="text-[9px] font-black bg-slate-900 text-white px-4 py-2 rounded-xl hover:bg-amber-500 hover:text-slate-900 transition-all">+ NOVA TAXA</button></div>
                                                    <div className="space-y-3">
                                                        {(mp.extraFees || []).map((fee, idx) => (
                                                            <div key={idx} className="flex gap-3 bg-slate-50 p-3 rounded-2xl items-center animate-in fade-in">
                                                                <input className="flex-[2] bg-white p-3 rounded-xl text-xs font-bold border border-slate-100" placeholder="Nome" value={fee.label} onChange={e => { const fs = [...mp.extraFees]; fs[idx].label = e.target.value; db.ref(`marketplaces/${mp.id}`).update({extraFees: fs}); }} />
                                                                <input type="number" className="w-20 bg-white p-3 rounded-xl text-xs font-black text-amber-600 border border-slate-100" value={fee.value} onChange={e => { const fs = [...mp.extraFees]; fs[idx].value = e.target.value; db.ref(`marketplaces/${mp.id}`).update({extraFees: fs}); }} />
                                                                <select className="flex-1 bg-slate-900 text-white text-[10px] font-black p-3 rounded-xl uppercase tracking-tighter" value={fee.type} onChange={e => { const fs = [...mp.extraFees]; fs[idx].type = e.target.value; db.ref(`marketplaces/${mp.id}`).update({extraFees: fs}); }}>
                                                                    <option value="fixo">R$ Fixo</option>
                                                                    <option value="percent">% Preço</option>
                                                                </select>
                                                                <button onClick={() => db.ref(`marketplaces/${mp.id}`).update({ extraFees: mp.extraFees.filter((_, i) => i !== idx) })} className="text-rose-500 hover:bg-rose-100 p-2 rounded-xl transition-all"><Icon name="trash-2" size={16}/></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VIEW LOGÍSTICA (Ajuste de Insumos e Banhos) */}
                        {activeTab === 'logistics' && (
                            <div className="space-y-8 animate-in slide-in-from-right-4">
                                <h2 className="text-3xl font-black italic uppercase">Custos Logísticos & Banhos</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 text-white p-12 rounded-[4rem] shadow-2xl">
                                        <h3 className="text-amber-500 font-black mb-10 uppercase tracking-widest text-xs flex items-center gap-2"><Icon name="droplet"/> Preço do Banho (g)</h3>
                                        <div className="space-y-4">
                                            {Object.entries(logistics.bathCosts).map(([key, val]) => (
                                                <div key={key} className="flex items-center justify-between bg-white/5 p-6 rounded-[2rem] border border-white/5 group hover:border-amber-500/30 transition-all">
                                                    <span className="capitalize font-black text-slate-300 tracking-tight">{key.replace('_', ' ')}</span>
                                                    <input type="number" step="0.01" className="bg-transparent text-right font-black text-amber-500 w-28 outline-none text-2xl" value={val} onChange={e => db.ref('logistics/bathCosts').update({[key]: e.target.value})} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-12 rounded-[3.5rem] shadow-sm border border-slate-100 h-fit">
                                        <h3 className="font-black mb-10 uppercase text-slate-400 text-[10px] tracking-widest flex items-center gap-2"><Icon name="box"/> Insumos por Pedido</h3>
                                        <div className="space-y-8">
                                            <div className="bg-slate-50 p-8 rounded-[2.5rem]">
                                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-3">Custo Embalagem (R$)</label>
                                                <input type="number" className="bg-transparent text-5xl font-black outline-none w-full" value={logistics.packaging.cost} onChange={e => db.ref('logistics/packaging').update({cost: e.target.value})} />
                                            </div>
                                            <div className="bg-slate-50 p-8 rounded-[2.5rem]">
                                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-3">Peso Embalagem (g)</label>
                                                <input type="number" className="bg-transparent text-5xl font-black outline-none w-full" value={logistics.packaging.weight} onChange={e => db.ref('logistics/packaging').update({weight: e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE EDIÇÃO AVANÇADA */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/98 backdrop-blur-xl p-4 md:p-8">
                            <div className="bg-slate-900 text-white w-full max-w-6xl rounded-[4rem] p-10 md:p-14 shadow-2xl border border-white/5 max-h-[95vh] overflow-y-auto custom-scroll">
                                <header className="flex justify-between items-center mb-12">
                                    <h2 className="text-3xl font-black italic uppercase tracking-tighter text-amber-500">Editor SKU: {editingProduct.sku}</h2>
                                    <button onClick={() => setEditingProduct(null)} className="p-5 bg-white/5 rounded-full hover:bg-rose-500 transition-all"><Icon name="x" /></button>
                                </header>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                                    <div className="lg:col-span-7 space-y-8">
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Imagem URL</label><input className="w-full bg-white/5 p-5 rounded-3xl outline-none focus:border-amber-500 border border-white/5" value={editingProduct.imageUrl} onChange={e => setEditingProduct({...editingProduct, imageUrl: e.target.value})} /></div>
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Referência SKU</label><input className="w-full bg-white/5 p-5 rounded-3xl font-black text-amber-500 uppercase outline-none" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} /></div>
                                        </div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Nome do Produto</label><input className="w-full bg-white/5 p-5 rounded-3xl font-bold outline-none border border-white/5 focus:border-amber-500" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} /></div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Peso Peça (g)</label><input type="number" className="w-full bg-white/5 p-5 rounded-3xl font-black outline-none border border-white/5 focus:border-amber-500" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} /></div>
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Banho</label><select className="w-full bg-slate-800 p-5 rounded-3xl font-black outline-none border border-white/5 uppercase text-xs" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}><option value="ouro">Ouro 18k</option><option value="prata">Prata 925</option><option value="niquel">Níquel</option><option value="sem_banho">Sem Banho</option></select></div>
                                        </div>
                                        <div className="bg-white/5 p-8 rounded-[3rem] border border-white/5 space-y-6">
                                            <div className="flex justify-between items-center"><h4 className="text-[10px] font-black text-amber-500 uppercase tracking-widest">Custos & Pesos Extras (Somados)</h4><button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...(editingProduct.additionalCosts || []), {item: '', value: 0, weight: 0}]})} className="bg-white/10 px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest">+ ITEM</button></div>
                                            <div className="space-y-3">
                                                {(editingProduct.additionalCosts || []).map((c, idx) => (
                                                    <div key={idx} className="flex gap-4">
                                                        <input className="flex-[2] bg-slate-800 p-4 rounded-2xl text-xs font-bold" placeholder="Item" value={c.item} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].item = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                        <input type="number" className="flex-1 bg-slate-800 p-4 rounded-2xl text-xs font-black text-amber-500" placeholder="R$" value={c.value} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                        <input type="number" className="flex-1 bg-slate-800 p-4 rounded-2xl text-xs font-black text-emerald-400" placeholder="g" value={c.weight} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].weight = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                        <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: editingProduct.additionalCosts.filter((_, i) => i !== idx)})} className="text-rose-500 p-2"><Icon name="trash-2"/></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-5 space-y-8 flex flex-col justify-between">
                                        <div className="bg-amber-500 text-slate-900 p-10 rounded-[3.5rem] shadow-xl relative overflow-hidden">
                                            <p className="text-[11px] font-black uppercase opacity-60 mb-2 tracking-widest">Sugerido p/ Venda</p>
                                            <p className="text-7xl font-black tracking-tighter">R$ {calculateProduct(editingProduct).suggestedPrice?.toFixed(2)}</p>
                                        </div>

                                        <div className="bg-white/5 border border-white/10 rounded-[3.5rem] p-10 space-y-8">
                                            <div className="flex bg-slate-800 p-2 rounded-3xl gap-2">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`flex-1 py-4 rounded-2xl font-black text-[10px] tracking-widest transition-all ${editingProduct.strategy === 'margem' ? 'bg-white text-slate-900' : 'text-slate-500'}`}>MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`flex-1 py-4 rounded-2xl font-black text-[10px] tracking-widest transition-all ${editingProduct.strategy === 'fixo' ? 'bg-white text-slate-900' : 'text-slate-500'}`}>VALOR FIXO</button>
                                            </div>
                                            <div className="text-center group">
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-4 tracking-[0.2em]">{editingProduct.strategy === 'margem' ? 'Lucro Alvo (%)' : 'Venda Final (R$)'}</label>
                                                <input type="number" className="w-full bg-transparent text-7xl font-black outline-none text-center border-b border-white/10 focus:border-amber-500 pb-4 transition-all" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} />
                                            </div>
                                            <div className="pt-8 grid grid-cols-2 gap-8 border-t border-white/5">
                                                <div className="text-center"><span className="text-[9px] font-black uppercase text-slate-500 block mb-1">Peso Total</span><span className="text-2xl font-black italic text-emerald-400">{calculateProduct(editingProduct).totalWeight?.toFixed(1)}g</span></div>
                                                <div className="text-center"><span className="text-[9px] font-black uppercase text-slate-500 block mb-1">Lucro Real</span><span className="text-2xl font-black italic">R$ {calculateProduct(editingProduct).profit?.toFixed(2)}</span></div>
                                            </div>
                                        </div>

                                        <div className="flex gap-4">
                                            <button onClick={() => { if(confirm("Apagar SKU?")) { db.ref(`products/${editingProduct.id}`).remove(); setEditingProduct(null); } }} className="flex-1 bg-rose-500/10 text-rose-500 py-6 rounded-3xl font-black text-[11px] uppercase tracking-widest border border-rose-500/10">Excluir</button>
                                            <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="flex-[2] bg-white text-slate-900 py-6 rounded-3xl font-black text-[11px] uppercase tracking-widest hover:bg-amber-500 transition-all">Salvar Alterações</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
