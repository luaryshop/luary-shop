<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema Profissional</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input, select, textarea { 
            background: #0f172a !important; 
            color: #fff !important; 
            border: 1px solid #334155 !important; 
            border-radius: 12px !important; 
            padding: 12px !important;
            width: 100%;
        }
        label { 
            display: block; 
            font-size: 10px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #94a3b8; 
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .tab-active { background: #fbbf24; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({
                packaging: { cost: 0, weight: 0 },
                bathCosts: { ouro: 0, prata: 0, niquel: 0 }
            });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('marketplaces').on('value', s => s.val() ? setMarketplaces(Object.values(s.val())) : setMarketplaces([{id:'shopee', name:'Shopee', commission:20, fixedFee:3}]));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            const calculate = (p) => {
                if (!p) return { totalProdCost: 0, totalWeight: 0, finalPrice: 0, profit: 0, suggested: 0 };
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0] || {commission: 20, fixedFee: 3};
                
                const bathUnit = p.bathType === 'sem_banho' ? 0 : Number(logistics.bathCosts[p.bathType] || 0);
                const bathCost = Number(p.baseWeight || 0) * bathUnit;
                
                const compCost = (p.components || []).reduce((a, b) => a + Number(b.value || 0), 0);
                const compWeight = (p.components || []).reduce((a, b) => a + Number(b.weight || 0), 0);
                
                const totalProdCost = bathCost + compCost + Number(logistics.packaging.cost || 0);
                const totalWeight = Number(p.baseWeight || 0) + compWeight + Number(logistics.packaging.weight || 0);

                const comm = Number(mp.commission || 0) / 100;
                const fee = Number(mp.fixedFee || 0);
                const margin = Number(p.targetMargin || 0) / 100;

                const suggested = (totalProdCost + fee) / (1 - comm - margin);
                const finalPrice = p.strategy === 'margem' ? suggested : Number(p.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * comm) - fee;

                return { totalProdCost, totalWeight, finalPrice, profit, suggested };
            };

            useEffect(() => { if(window.lucide) lucide.createIcons(); });

            return (
                <div className="flex min-h-screen">
                    <aside className="w-64 border-r border-white/5 bg-slate-900/50 p-6 flex flex-col gap-4 sticky top-0 h-screen">
                        <div className="text-amber-500 font-black text-2xl mb-10 italic">LUARY SHOP</div>
                        <button onClick={() => setActiveTab('catalogo')} className={`flex items-center gap-3 p-4 rounded-xl ${activeTab === 'catalogo' ? 'tab-active' : 'text-slate-400'}`}><i data-lucide="package"></i> Catálogo</button>
                        <button onClick={() => setActiveTab('canais')} className={`flex items-center gap-3 p-4 rounded-xl ${activeTab === 'canais' ? 'tab-active' : 'text-slate-400'}`}><i data-lucide="shopping-bag"></i> Canais</button>
                        <button onClick={() => setActiveTab('logistica')} className={`flex items-center gap-3 p-4 rounded-xl ${activeTab === 'logistica' ? 'tab-active' : 'text-slate-400'}`}><i data-lucide="truck"></i> Logística</button>
                    </aside>

                    <main className="flex-1 p-10">
                        {activeTab === 'catalogo' && (
                            <div>
                                <div className="flex justify-between items-center mb-8">
                                    <h1 className="text-3xl font-black italic uppercase">Gestão de Estoque</h1>
                                    <button onClick={() => setEditingProduct({ id: Date.now().toString(), sku: '', name: '', baseWeight: 0, bathType: 'ouro', components: [], strategy: 'margem', targetMargin: 40, selectedMarketplace: marketplaces[0]?.id })} className="bg-amber-500 text-slate-950 px-8 py-4 rounded-2xl font-black">+ NOVO ITEM</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {products.map(p => {
                                        const res = calculate(p);
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2rem] p-6 hover:border-amber-500/50 transition-all group">
                                                <div className="flex justify-between mb-4">
                                                    <span className="text-[10px] font-black text-amber-500">{p.sku || 'SEM SKU'}</span>
                                                    <button onClick={() => setEditingProduct(p)} className="text-slate-400 hover:text-white"><i data-lucide="edit-3" className="size-4"></i></button>
                                                </div>
                                                <h3 className="font-bold text-lg mb-6">{p.name}</h3>
                                                <div className="grid grid-cols-2 gap-4 border-t border-white/5 pt-4">
                                                    <div><label>Venda</label><p className="text-xl font-black text-white">R$ {res.finalPrice.toFixed(2)}</p></div>
                                                    <div><label>Lucro</label><p className="text-xl font-black text-emerald-400">R$ {res.profit.toFixed(2)}</p></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-2xl space-y-8">
                                <h2 className="text-2xl font-black italic mb-6">Custos de Operação</h2>
                                <div className="glass-card p-8 rounded-[2rem] space-y-8">
                                    <div className="grid grid-cols-3 gap-6">
                                        <div className="col-span-3 text-amber-500 font-bold text-xs uppercase tracking-widest border-b border-white/5 pb-2">Preço do Banho (por grama)</div>
                                        <div><label>Ouro (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.ouro} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, ouro: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                        <div><label>Prata (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.prata} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, prata: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                        <div><label>Níquel (R$)</label><input type="number" step="0.01" value={logistics.bathCosts.niquel} onChange={e => {const nl = {...logistics, bathCosts: {...logistics.bathCosts, niquel: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="col-span-2 text-amber-500 font-bold text-xs uppercase tracking-widest border-b border-white/5 pb-2">Embalagem de Envio</div>
                                        <div><label>Custo da Caixa (R$)</label><input type="number" step="0.01" value={logistics.packaging.cost} onChange={e => {const nl = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                        <div><label>Peso da Caixa (g)</label><input type="number" value={logistics.packaging.weight} onChange={e => {const nl = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}}; setLogistics(nl); db.ref('logistics').set(nl)}} /></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-md p-4">
                            <div className="bg-slate-900 w-full max-w-5xl rounded-[3rem] border border-white/10 flex flex-col max-h-[90vh] overflow-hidden">
                                <div className="p-8 border-b border-white/5 flex justify-between items-center">
                                    <h2 className="text-amber-500 font-black italic uppercase">Editor de Produto</h2>
                                    <button onClick={() => setEditingProduct(null)} className="text-slate-500 hover:text-white"><i data-lucide="x"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-10 grid grid-cols-1 lg:grid-cols-2 gap-10">
                                    <div className="space-y-6">
                                        <div><label>Nome do Produto</label><input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} placeholder="Ex: Chaveiro Touro" /></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label>SKU (Código)</label><input value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} placeholder="LUARY-001" /></div>
                                            <div><label>Canal de Venda</label>
                                                <select value={editingProduct.selectedMarketplace} onChange={e => setEditingProduct({...editingProduct, selectedMarketplace: e.target.value})}>
                                                    {marketplaces.map(m => <option key={m.id} value={m.id} className="bg-slate-900">{m.name}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 p-6 bg-white/5 rounded-2xl">
                                            <div><label>Peso Peça Bruta (g)</label><input type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} /></div>
                                            <div><label>Banho Escolhido</label>
                                                <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="text-amber-500 font-bold">
                                                    <option value="ouro">Ouro</option>
                                                    <option value="prata">Prata</option>
                                                    <option value="niquel">Níquel</option>
                                                    <option value="sem_banho">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center"><label>Componentes (Argolas, Pingentes, Mimos)</label><button onClick={() => setEditingProduct({...editingProduct, components: [...(editingProduct.components || []), {name:'', value:0, weight:0}]})} className="text-amber-500 text-[10px] font-black">+ ADICIONAR ITEM</button></div>
                                            {(editingProduct.components || []).map((c, i) => (
                                                <div key={i} className="flex gap-2 items-center bg-black/20 p-2 rounded-xl">
                                                    <input placeholder="Nome" value={c.name} onChange={e => {const n = [...editingProduct.components]; n[i].name = e.target.value; setEditingProduct({...editingProduct, components: n})}} />
                                                    <input type="number" placeholder="Peso (g)" className="w-24" value={c.weight} onChange={e => {const n = [...editingProduct.components]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, components: n})}} />
                                                    <input type="number" placeholder="Custo (R$)" className="w-24" value={c.value} onChange={e => {const n = [...editingProduct.components]; n[i].value = e.target.value; setEditingProduct({...editingProduct, components: n})}} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-amber-500 rounded-[2.5rem] p-10 text-slate-950 flex flex-col justify-between">
                                        <div className="space-y-6">
                                            <div className="flex gap-2">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`flex-1 p-3 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500' : 'bg-black/10'}`}>MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`flex-1 p-3 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500' : 'bg-black/10'}`}>PREÇO FIXO</button>
                                            </div>
                                            <div>
                                                <label className="text-slate-900 opacity-60">{editingProduct.strategy === 'margem' ? 'Margem Alvo (%)' : 'Preço de Venda (R$)'}</label>
                                                <input type="number" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} className="!bg-slate-950/20 !border-slate-950/30 !text-6xl font-black" />
                                            </div>
                                            <div className="pt-6 border-t border-black/10">
                                                <div className="flex justify-between font-black"><span>Custo Produção:</span><span>R$ {calculate(editingProduct).totalProdCost.toFixed(2)}</span></div>
                                                <div className="flex justify-between font-black text-2xl mt-4"><span>Lucro Real:</span><span>R$ {calculate(editingProduct).profit.toFixed(2)}</span></div>
                                            </div>
                                        </div>
                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full py-6 bg-slate-950 text-amber-500 rounded-2xl font-black text-xl hover:scale-105 transition-all">SALVAR NO SISTEMA</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
