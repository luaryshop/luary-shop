<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestor PRO Marketplace</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>
body { background:#F8FAFC; font-family:Arial }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
  databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// ================= APP =================
const App = () => {

const [products, setProducts] = useState([]);
const [marketplaces, setMarketplaces] = useState([]);
const [editing, setEditing] = useState(null);

// ================= LOGISTICA =================
const [logistics, setLogistics] = useState({
  packaging:{ cost:1.5, weight:20 },
  bathCosts:{ ouro:0.8, prata:0.6, niquel:0.4 }
});

// ================= LOAD =================
useEffect(() => {

db.ref("products").on("value", s => {
  const data = s.val();
  setProducts(data ? Object.values(data) : []);
});

db.ref("marketplaces").once("value", s => {
  if (!s.exists()) {
    db.ref("marketplaces/shopee").set({
      id:"shopee", name:"Shopee", commission:20, fixedFee:3, tax:0, extraFees:[]
    });
    db.ref("marketplaces/ml").set({
      id:"ml", name:"Mercado Livre", commission:16, fixedFee:6, tax:4, extraFees:[]
    });
  }
});

db.ref("marketplaces").on("value", s => {
  const data = s.val();
  setMarketplaces(data ? Object.values(data) : []);
});

},[]);

// ================= CALCULO COMPLETO =================
const calc = (p) => {

if (!p) return {price:0,suggested:0,profit:0,margin:0};

const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || {};

const addWeight = (p.additionalCosts||[]).reduce((a,c)=>a+Number(c.weight||0),0);
const mimWeight = (p.mimos||[]).reduce((a,m)=>a+Number(m.weight||0),0);

const totalWeight = (p.baseWeight||0) + logistics.packaging.weight + addWeight + mimWeight;

let bathCost = p.bathType !== 'sem_banho'
  ? (p.baseWeight||0) * (logistics.bathCosts[p.bathType]||0)
  : 0;

const extraCosts = (p.additionalCosts||[]).reduce((a,c)=>a+Number(c.value||0),0);
const mimosCost = (p.mimos||[]).reduce((a,m)=>a+Number(m.value||0),0);

const totalCost = bathCost + extraCosts + mimosCost + logistics.packaging.cost;

const extraPercent = (mp.extraFees||[]).filter(f=>f.type==="percent")
  .reduce((a,f)=>a+Number(f.value||0),0);

const extraFixed = (mp.extraFees||[]).filter(f=>f.type==="fixed")
  .reduce((a,f)=>a+Number(f.value||0),0);

const percent = (mp.commission||0)+(mp.tax||0)+extraPercent;
const fixed = (mp.fixedFee||0)+extraFixed;

const divisor = 1 - ((percent + (p.targetMargin||0))/100);

const suggested = divisor>0 ? (totalCost + fixed)/divisor : 0;

const price = p.strategy==="margem"
  ? suggested
  : Number(p.salePrice||0);

const fees = (price * percent/100) + fixed;

const profit = price - totalCost - fees;
const margin = price>0 ? (profit/price)*100 : 0;

return {price,suggested,profit,margin,totalCost};
};

// ================= UI =================
return (
<div className="p-6">

<h1 className="text-2xl font-bold mb-6">Gestor PRO</h1>

<div className="grid grid-cols-1 md:grid-cols-3 gap-6">

{products.map(p=>{
const r = calc(p);

return (
<div key={p.id} className="bg-white p-4 rounded-xl shadow">

<h3 className="font-bold">{p.name}</h3>
<p className="text-xs text-gray-400">{p.sku}</p>

<div className="mt-3 text-sm">
<p>Venda: R$ {r.price.toFixed(2)}</p>
<p>Sugerido: R$ {r.suggested.toFixed(2)}</p>
<p>Custo: R$ {r.totalCost.toFixed(2)}</p>

<p className={r.profit>0?"text-green-600":"text-red-600"}>
Lucro: R$ {r.profit.toFixed(2)}
</p>

<p>Margem: {r.margin.toFixed(1)}%</p>
</div>

<button
onClick={()=>setEditing({...p})}
className="mt-3 bg-black text-white px-3 py-2 rounded w-full">
Editar
</button>

</div>
);
})}

</div>

{/* MODAL COMPLETO */}
{editing && (
<div className="fixed inset-0 bg-black/80 flex items-center justify-center">

<div className="bg-white p-6 rounded-xl w-96">

<h2 className="font-bold mb-4">Editor</h2>

<input className="border p-2 w-full mb-2"
value={editing.name}
onChange={e=>setEditing({...editing,name:e.target.value})}
/>

<input type="number" className="border p-2 w-full mb-2"
value={editing.baseWeight}
onChange={e=>setEditing({...editing,baseWeight:e.target.value})}
/>

<input type="number" className="border p-2 w-full mb-2"
value={editing.targetMargin}
onChange={e=>setEditing({...editing,targetMargin:e.target.value})}
/>

<select className="border p-2 w-full mb-2"
value={editing.selectedMarketplace}
onChange={e=>setEditing({...editing,selectedMarketplace:e.target.value})}>
{marketplaces.map(m=>(
<option key={m.id} value={m.id}>{m.name}</option>
))}
</select>

<button
onClick={()=>{
db.ref("products/"+editing.id).update(editing);
setEditing(null);
}}
className="bg-green-600 text-white px-4 py-2 rounded w-full">
Salvar
</button>

</div>
</div>
)}

</div>
);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
