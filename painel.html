<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Engenharia de Custos</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gold-border { border: 1px solid rgba(251, 191, 36, 0.3); }
        input, select, textarea { background: #0f172a !important; color: white !important; border: 1px solid #334155 !important; border-radius: 12px !important; outline: none; }
        input:focus { border-color: #fbbf24 !important; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({
                packaging: { cost: 0, weight: 0 },
                bathCosts: { ouro: 0, prata: 0, niquel: 0 },
                globalExtras: [] // Mimos/Tags que vão em TUDO
            });

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('marketplaces').on('value', s => s.val() ? setMarketplaces(Object.values(s.val())) : setMarketplaces([{id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3}]));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            // --- MOTOR DE CÁLCULO (O CORAÇÃO DO SISTEMA) ---
            const calculate = (p) => {
                if (!p) return {};
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0] || {commission:0, fixedFee:0};
                
                // 1. Cálculo do Banho (Somente sobre o peso da peça bruta)
                const bathUnitCost = p.bathType === 'sem_banho' ? 0 : (Number(logistics.bathCosts[p.bathType]) || 0);
                const totalBathCost = Number(p.baseWeight || 0) * bathUnitCost;

                // 2. Soma de Componentes Agregados (Argolas, Correntes, Pingentes, Mimos específicos)
                const itemsValue = (p.components || []).reduce((a, b) => a + Number(b.value || 0), 0);
                const itemsWeight = (p.components || []).reduce((a, b) => a + Number(b.weight || 0), 0);

                // 3. Custos Globais (Caixa + Mimos Globais)
                const globalValue = Number(logistics.packaging.cost || 0) + (logistics.globalExtras || []).reduce((a, b) => a + Number(b.value || 0), 0);
                const globalWeight = Number(logistics.packaging.weight || 0) + (logistics.globalExtras || []).reduce((a, b) => a + Number(b.weight || 0), 0);

                // Totais de Produção
                const totalProdCost = totalBathCost + itemsValue + globalValue;
                const totalWeight = Number(p.baseWeight || 0) + itemsWeight + globalWeight;

                // 4. Precificação
                const comm = Number(mp.commission || 0) / 100;
                const fee = Number(mp.fixedFee || 0);
                
                let finalPrice = 0;
                let suggested = 0;

                // Cálculo para Margem Desejada
                const margin = Number(p.targetMargin || 0) / 100;
                const divisor = (1 - comm - margin);
                suggested = divisor > 0 ? (totalProdCost + fee) / divisor : 0;

                finalPrice = p.strategy === 'margem' ? suggested : Number(p.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * comm) - fee;

                return { totalProdCost, totalWeight, finalPrice, profit, suggested };
            };

            // --- FUNÇÕES DE AUXÍLIO ---
            const duplicateProduct = (p) => {
                const newId = Date.now().toString();
                const newP = { ...p, id: newId, name: p.name + " (Cópia)" };
                db.ref(`products/${newId}`).set(newP);
            };

            const exportCSV = () => {
                let csv = "SKU;Produto;Custo;Preco;Lucro;Peso\n";
                products.forEach(p => {
                    const res = calculate(p);
                    csv += `${p.sku};${p.name};${res.totalProdCost.toFixed(2)};${res.finalPrice.toFixed(2)};${res.profit.toFixed(2)};${res.totalWeight}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'LuaryShop_Estoque.csv';
                a.click();
            };

            return (
                <div className="flex min-h-screen">
                    {/* Menu Lateral */}
                    <aside className="w-64 border-r border-white/5 bg-slate-900/50 p-6 flex flex-col gap-8 sticky top-0 h-screen">
                        <div className="text-amber-500 font-black text-2xl tracking-tighter italic">LUARY SHOP</div>
                        <nav className="space-y-2 flex-1">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full p-4 rounded-xl flex items-center gap-3 ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="layout-grid"></i>Catálogo</button>
                            <button onClick={() => setActiveTab('canais')} className={`w-full p-4 rounded-xl flex items-center gap-3 ${activeTab === 'canais' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}><i data-lucide="shopping-bag"></i>Canais de Venda</button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full p-4 rounded-xl flex items-center gap-3 ${activeTab === 'logistica' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}><i data-lucide="truck"></i>Logística e Banhos</button>
                        </nav>
                        <button onClick={exportCSV} className="p-4 border border-white/10 rounded-xl text-xs font-bold hover:bg-white/5 flex items-center gap-2"><i data-lucide="download" className="size-4"></i> Exportar Planilha</button>
                    </aside>

                    <main className="flex-1 p-10">
                        {activeTab === 'catalogo' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-3xl font-black">Gestão de Produtos</h1>
                                    <button onClick={() => setEditingProduct({ id: Date.now().toString(), sku: '', name: '', baseWeight: 0, bathType: 'ouro', components: [], strategy: 'margem', targetMargin: 40, selectedMarketplace: marketplaces[0]?.id })} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-xl font-black hover:scale-105 transition-all">+ NOVO PRODUTO</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {products.map(p => {
                                        const res = calculate(p);
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2rem] p-6 border border-white/5 hover:gold-border transition-all group">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className="h-24 w-24 bg-slate-800 rounded-2xl overflow-hidden border border-white/10">
                                                        {p.image ? <img src={p.image} className="w-full h-full object-cover" /> : <div className="flex items-center justify-center h-full opacity-20"><i data-lucide="image"></i></div>}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => duplicateProduct(p)} className="p-2 bg-white/5 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition-all"><i data-lucide="copy" className="size-4"></i></button>
                                                        <button onClick={() => setEditingProduct(p)} className="p-2 bg-white/5 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition-all"><i data-lucide="edit-3" className="size-4"></i></button>
                                                    </div>
                                                </div>
                                                
                                                <div className="mb-4">
                                                    <span className="text-[10px] font-bold text-amber-500 uppercase tracking-widest">{p.sku || 'SEM SKU'}</span>
                                                    <h3 className="font-bold text-lg leading-tight line-clamp-1">{p.name}</h3>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4 border-t border-white/5 pt-4">
                                                    <div><p className="text-[10px] text-slate-500 font-bold uppercase">Preço Venda</p><p className="text-xl font-black">R$ {res.finalPrice.toFixed(2)}</p></div>
                                                    <div className="text-right"><p className="text-[10px] text-slate-500 font-bold uppercase">Lucro Líquido</p><p className="text-xl font-black text-emerald-400">R$ {res.profit.toFixed(2)}</p></div>
                                                </div>

                                                <div className="mt-4 flex gap-2 overflow-x-auto pb-2 custom-scroll">
                                                    {marketplaces.map(m => (
                                                        <button key={m.id} onClick={() => db.ref(`products/${p.id}`).update({selectedMarketplace: m.id})} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase whitespace-nowrap transition-all ${p.selectedMarketplace === m.id ? 'bg-amber-500 text-slate-950' : 'bg-white/5 text-slate-500'}`}>{m.name}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-3xl space-y-8">
                                <h2 className="text-2xl font-black">Configurações de Logística e Banhos</h2>
                                
                                <div className="glass-card p-8 rounded-[2rem] space-y-6">
                                    <h3 className="text-amber-500 font-bold flex items-center gap-2"><i data-lucide="droplet" className="size-4"></i> Valores do Banho (por grama)</h3>
                                    <div className="grid grid-cols-3 gap-6">
                                        {['ouro', 'prata', 'niquel'].map(type => (
                                            <div key={type}>
                                                <label className="text-xs font-bold uppercase text-slate-500">{type}</label>
                                                <input type="number" step="0.01" value={logistics.bathCosts[type]} onChange={e => {
                                                    const newLog = {...logistics, bathCosts: {...logistics.bathCosts, [type]: e.target.value}};
                                                    setLogistics(newLog); db.ref('logistics').set(newLog);
                                                }} className="w-full p-4 mt-1" />
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card p-8 rounded-[2rem] space-y-6">
                                    <h3 className="text-amber-500 font-bold flex items-center gap-2"><i data-lucide="package"></i> Embalagem Padrão de Envio</h3>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div><label className="text-xs font-bold uppercase text-slate-500">Custo Caixa (R$)</label><input type="number" step="0.01" value={logistics.packaging.cost} onChange={e => {const n = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}}; setLogistics(n); db.ref('logistics').set(n)}} className="w-full p-4 mt-1" /></div>
                                        <div><label className="text-xs font-bold uppercase text-slate-500">Peso Caixa (g)</label><input type="number" value={logistics.packaging.weight} onChange={e => {const n = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}}; setLogistics(n); db.ref('logistics').set(n)}} className="w-full p-4 mt-1" /></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'canais' && (
                            <div className="max-w-4xl space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black">Canais de Venda</h2>
                                    <button onClick={() => {
                                        const id = Date.now().toString();
                                        const newList = [...marketplaces, {id, name: 'Novo Canal', commission: 0, fixedFee: 0}];
                                        setMarketplaces(newList); db.ref('marketplaces').set(newList);
                                    }} className="text-amber-500 font-bold">+ Criar Novo Canal</button>
                                </div>
                                <div className="space-y-4">
                                    {marketplaces.map((m, idx) => (
                                        <div key={m.id} className="glass-card p-6 rounded-2xl grid grid-cols-4 gap-4 items-end">
                                            <div><label className="text-xs font-bold text-slate-500 uppercase">Nome</label><input value={m.name} onChange={e => {const n = [...marketplaces]; n[idx].name = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <div><label className="text-xs font-bold text-slate-500 uppercase">Comissão %</label><input type="number" value={m.commission} onChange={e => {const n = [...marketplaces]; n[idx].commission = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <div><label className="text-xs font-bold text-slate-500 uppercase">Taxa Fixa R$</label><input type="number" value={m.fixedFee} onChange={e => {const n = [...marketplaces]; n[idx].fixedFee = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="w-full p-3 mt-1"/></div>
                                            <button onClick={() => {const n = marketplaces.filter(item => item.id !== m.id); setMarketplaces(n); db.ref('marketplaces').set(n)}} className="p-3 bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500 hover:text-white transition-all">Excluir</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL EDITOR DE PRODUTO */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 w-full max-w-6xl rounded-[3rem] border border-white/10 flex flex-col max-h-[95vh] overflow-hidden shadow-2xl">
                                <div className="p-8 border-b border-white/5 flex justify-between items-center">
                                    <h2 className="text-amber-500 font-black uppercase tracking-widest italic">Configurar Produto</h2>
                                    <button onClick={() => setEditingProduct(null)} className="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-10 grid grid-cols-1 lg:grid-cols-2 gap-12 custom-scroll">
                                    {/* Esquerda: Dados e Componentes */}
                                    <div className="space-y-8">
                                        <div className="space-y-4">
                                            <input value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} className="w-full p-4 font-black text-amber-500" placeholder="SKU do Produto" />
                                            <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full p-4 font-bold text-lg" placeholder="Nome Completo" />
                                            <input value={editingProduct.image} onChange={e => setEditingProduct({...editingProduct, image: e.target.value})} className="w-full p-4 text-xs" placeholder="URL da Imagem (opcional)" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-6 p-6 bg-black/20 rounded-3xl border border-white/5">
                                            <div>
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-2">Peso da Peça Bruta (g)</label>
                                                <input type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} className="w-full bg-transparent border-none text-3xl font-black p-0 focus:ring-0" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-2">Banho</label>
                                                <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-transparent border-none text-xl font-black p-0 focus:ring-0 text-amber-500 uppercase">
                                                    <option value="ouro" className="bg-slate-900">Ouro</option>
                                                    <option value="prata" className="bg-slate-900">Prata</option>
                                                    <option value="niquel" className="bg-slate-900">Níquel</option>
                                                    <option value="sem_banho" className="bg-slate-900">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Componentes / Insumos / Mimos</span><button onClick={() => setEditingProduct({...editingProduct, components: [...(editingProduct.components || []), {name: '', value: 0, weight: 0}]})} className="text-amber-500 text-xs font-bold">+ Adicionar Item</button></div>
                                            <div className="space-y-2">
                                                {(editingProduct.components || []).map((c, i) => (
                                                    <div key={i} className="flex gap-2 items-center bg-black/20 p-2 rounded-xl">
                                                        <input placeholder="Item (ex: argola)" value={c.name} onChange={e => {const n = [...editingProduct.components]; n[i].name = e.target.value; setEditingProduct({...editingProduct, components: n})}} className="flex-1 p-2 text-xs" />
                                                        <input type="number" placeholder="g" value={c.weight} onChange={e => {const n = [...editingProduct.components]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, components: n})}} className="w-16 p-2 text-xs text-center" />
                                                        <input type="number" placeholder="R$" value={c.value} onChange={e => {const n = [...editingProduct.components]; n[i].value = e.target.value; setEditingProduct({...editingProduct, components: n})}} className="w-20 p-2 text-xs font-bold text-emerald-400" />
                                                        <button onClick={() => setEditingProduct({...editingProduct, components: editingProduct.components.filter((_, idx) => idx !== i)})} className="text-rose-500 px-2"><i data-lucide="trash-2" className="size-4"></i></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Direita: Cálculos e Preço */}
                                    <div className="bg-amber-500 rounded-[3rem] p-10 text-slate-950 flex flex-col justify-between shadow-xl">
                                        <div className="space-y-8">
                                            <div className="flex gap-2 p-1.5 bg-black/10 rounded-2xl w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-6 py-2 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-6 py-2 rounded-xl text-[10px] font-black ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>PREÇO FIXO</button>
                                            </div>

                                            <div>
                                                <label className="text-[12px] font-black uppercase opacity-60 block">{editingProduct.strategy === 'margem' ? 'Margem Alvo (%)' : 'Preço Final Desejado (R$)'}</label>
                                                <input type="number" step="0.01" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} className="bg-transparent border-none text-8xl font-black w-full p-0 focus:ring-0" />
                                            </div>

                                            <div className="border-t border-black/10 pt-8 grid grid-cols-2 gap-8 font-black">
                                                <div><p className="text-[10px] opacity-60 uppercase">Custo de Produção</p><p className="text-3xl italic">R$ {calculate(editingProduct).totalProdCost.toFixed(2)}</p></div>
                                                <div><p className="text-[10px] opacity-60 uppercase">Lucro Líquido</p><p className="text-3xl italic">R$ {calculate(editingProduct).profit.toFixed(2)}</p></div>
                                                <div className="col-span-2 pt-4"><p className="text-[10px] opacity-60 uppercase">Peso Total de Envio</p><p className="text-xl">{calculate(editingProduct).totalWeight.toFixed(1)} gramas</p></div>
                                            </div>
                                        </div>

                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full py-8 bg-slate-950 text-amber-500 rounded-[2rem] font-black text-2xl hover:scale-[1.02] transition-all uppercase tracking-tighter">Salvar Produto</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Iniciar ícones após render
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
