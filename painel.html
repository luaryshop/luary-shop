<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão Completa</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-field { border: 1px solid #CBD5E1 !important; background-color: #F8FAFC !important; }
        .input-field:focus { border-color: #6366F1 !important; background-color: #FFFFFF !important; }
    </style>
</head>
<body class="bg-[#F1F5F9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [searchTerm, setSearchTerm] = useState('');
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);

            const [logistics, setLogistics] = useState({
                packaging: { cost: 1.5, weight: 20 },
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4 },
                extraLogistics: [] // Novos custos extras fixos da logística
            });

            const [marketplaces, setMarketplaces] = useState([
                { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3, tax: 0, extraFees: [] },
                { id: 'ml', name: 'Mercado Livre', commission: 16, fixedFee: 6, tax: 4, extraFees: [] }
            ]);

            const [products, setProducts] = useState([
                { id: '1', sku: 'CHV-FRD-CVALO-00611', name: 'Chaveiro Cavalo com Ferradura Luary Shop', baseWeight: 15, imageUrl: 'https://images.unsplash.com/photo-1598560917505-59a3ad559071?q=80&w=400', bathType: 'ouro', strategy: 'fixo', salePrice: 45.0, targetMargin: 50, additionalCosts: [], mimos: [], selectedMarketplace: 'shopee' }
            ]);

            const calculateProduct = (prod) => {
                if (!prod) return { totalWeight: 0, totalProdCost: 0, profit: 0 };
                
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || marketplaces[0];
                
                // Soma de pesos (Base + Embalagem + Extras + Mimos)
                const addWeight = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.weight || 0), 0);
                const mimWeight = (prod.mimos || []).reduce((acc, m) => acc + Number(m.weight || 0), 0);
                const totalWeight = Number(prod.baseWeight || 0) + Number(logistics.packaging.weight || 0) + addWeight + mimWeight;

                // Custos de Banho (Incluso opção sem banho)
                let bathCost = prod.bathType !== 'sem_banho' ? Number(prod.baseWeight || 0) * (Number(logistics.bathCosts[prod.bathType]) || 0) : 0;
                
                // Soma de valores extras (Produto + Mimos + Logística Fixa)
                const extraCostsVal = (prod.additionalCosts || []).reduce((acc, curr) => acc + Number(curr.value || 0), 0);
                const mimosCost = (prod.mimos || []).reduce((acc, m) => acc + Number(m.value || 0), 0);
                const logExtraCost = (logistics.extraLogistics || []).reduce((acc, curr) => acc + Number(curr.value || 0), 0);
                
                const totalProdCost = bathCost + extraCostsVal + mimosCost + Number(logistics.packaging.cost || 0) + logExtraCost;

                // Marketplace e Impostos
                const extraPercentFees = (mp.extraFees || []).filter(f => f.type === 'percent').reduce((acc, f) => acc + Number(f.value || 0), 0);
                const extraFixedFees = (mp.extraFees || []).filter(f => f.type === 'fixed').reduce((acc, f) => acc + Number(f.value || 0), 0);
                const totalPercentTax = Number(mp.commission || 0) + Number(mp.tax || 0) + extraPercentFees;
                const totalFixedTax = Number(mp.fixedFee || 0) + extraFixedFees;

                const divisor = (1 - (totalPercentTax + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + totalFixedTax) / divisor : 0;
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                
                const totalMpFees = (finalPrice * (totalPercentTax / 100)) + totalFixedTax;
                const profit = finalPrice - totalProdCost - totalMpFees;

                return { totalWeight, totalProdCost, finalPrice, profit, realMargin: finalPrice > 0 ? (profit / finalPrice) * 100 : 0 };
            };

            useEffect(() => { lucide.createIcons(); }, [activeTab, isProductModalOpen, logistics]);

            return (
                <div className="flex min-h-screen">
                    <aside className="w-20 lg:w-64 bg-slate-900 flex flex-col p-4 lg:p-6 sticky top-0 h-screen z-20">
                        <div className="mb-10 flex items-center gap-3 text-white font-black italic uppercase tracking-tighter text-xl">Luary</div>
                        <nav className="space-y-2">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full flex items-center gap-4 p-3 rounded-xl ${activeTab === 'catalogo' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="layout-grid"></i><span className="hidden lg:block font-bold text-sm">Catálogo</span></button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full flex items-center gap-4 p-3 rounded-xl ${activeTab === 'logistica' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="truck"></i><span className="hidden lg:block font-bold text-sm">Logística</span></button>
                        </nav>
                    </aside>

                    <main className="flex-1 p-8">
                        {activeTab === 'catalogo' && (
                            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {products.map(prod => {
                                    const res = calculateProduct(prod);
                                    return (
                                        <div key={prod.id} className="bg-white rounded-[2rem] border-2 border-slate-200 overflow-hidden shadow-sm">
                                            <div className="p-6 space-y-4">
                                                <h3 className="font-bold text-xs h-8 line-clamp-2">{prod.name}</h3>
                                                <div className="bg-slate-100 p-3 rounded-xl text-[10px] font-black space-y-1">
                                                    <div className="flex justify-between"><span>PESO TOTAL:</span><span className="text-indigo-600">{res.totalWeight.toFixed(1)}g</span></div>
                                                    <div className="flex justify-between"><span>CUSTO ACUM.:</span><span className="text-slate-900">R$ {res.totalProdCost.toFixed(2)}</span></div>
                                                </div>
                                                <div className={`p-4 rounded-2xl border-2 ${res.profit > 0 ? 'bg-slate-900 border-slate-700' : 'bg-rose-900 border-rose-700'} text-white`}>
                                                    <p className="text-[9px] font-black opacity-50 uppercase">Lucro Líquido</p>
                                                    <p className="text-xl font-black">R$ {res.profit.toFixed(2)}</p>
                                                </div>
                                                <button onClick={() => { setEditingProduct({...prod}); setIsProductModalOpen(true); }} className="w-full py-3 bg-indigo-50 text-indigo-600 rounded-xl font-black text-xs border border-indigo-200 hover:bg-indigo-100 transition-all uppercase">Editar Detalhes</button>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-200 shadow-sm space-y-6">
                                    <h3 className="font-black text-lg border-b pb-4">Custos Fixos de Logística</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400">Embalagem (R$)</label>
                                            <input type="number" value={logistics.packaging.cost} onChange={e => setLogistics({...logistics, packaging: {...logistics.packaging, cost: e.target.value}})} className="w-full input-field p-4 rounded-2xl font-black outline-none" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400">Peso Emb. (g)</label>
                                            <input type="number" value={logistics.packaging.weight} onChange={e => setLogistics({...logistics, packaging: {...logistics.packaging, weight: e.target.value}})} className="w-full input-field p-4 rounded-2xl font-black outline-none" />
                                        </div>
                                    </div>

                                    <div className="space-y-3 pt-4">
                                        <h4 className="text-xs font-black text-indigo-500 uppercase">Custos Extras da Loja (Tags, Brindes, etc)</h4>
                                        {logistics.extraLogistics.map((cost, idx) => (
                                            <div key={idx} className="flex gap-2">
                                                <input placeholder="Nome" value={cost.name} onChange={e => { const n = [...logistics.extraLogistics]; n[idx].name = e.target.value; setLogistics({...logistics, extraLogistics: n})}} className="flex-1 input-field p-3 rounded-xl text-xs font-bold" />
                                                <input type="number" placeholder="R$" value={cost.value} onChange={e => { const n = [...logistics.extraLogistics]; n[idx].value = e.target.value; setLogistics({...logistics, extraLogistics: n})}} className="w-24 input-field p-3 rounded-xl text-xs font-black text-right" />
                                                <button onClick={() => setLogistics({...logistics, extraLogistics: logistics.extraLogistics.filter((_, i) => i !== idx)})} className="text-rose-500 p-2"><i data-lucide="trash-2" className="size-4"></i></button>
                                            </div>
                                        ))}
                                        <button onClick={() => setLogistics({...logistics, extraLogistics: [...logistics.extraLogistics, {name: '', value: 0}]})} className="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl font-black text-slate-400 text-[10px] hover:border-indigo-400 hover:text-indigo-400 transition-all">+ ADICIONAR CUSTO FIXO À LOGÍSTICA</button>
                                    </div>
                                    
                                    <div className="pt-6 border-t">
                                        <h4 className="text-xs font-black text-amber-600 uppercase mb-4">Valor do Banho por Grama</h4>
                                        <div className="grid grid-cols-3 gap-3">
                                            {Object.keys(logistics.bathCosts).map(type => (
                                                <div key={type} className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                                    <span className="text-[9px] font-black uppercase text-slate-400 block mb-1">{type}</span>
                                                    <input type="number" value={logistics.bathCosts[type]} onChange={e => setLogistics({...logistics, bathCosts: {...logistics.bathCosts, [type]: e.target.value}})} className="w-full bg-white border-2 border-slate-200 p-2 rounded-xl text-right font-black" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {isProductModalOpen && editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-5xl rounded-[3rem] shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
                                <div className="p-8 border-b-2 border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-2xl font-black italic uppercase">Ajustar SKU</h2>
                                    <button onClick={() => setIsProductModalOpen(false)} className="bg-slate-200 p-2 rounded-full"><i data-lucide="x"></i></button>
                                </div>
                                <div className="p-8 overflow-y-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Dados do Produto</label>
                                            <textarea value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full input-field p-4 rounded-2xl font-bold text-sm h-24 mb-4" />
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                                    <label className="text-[10px] font-black uppercase text-slate-400">Peso Base (g)</label>
                                                    <input type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} className="w-full bg-white border border-slate-300 p-2 rounded-xl font-black mt-1" />
                                                </div>
                                                <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                                    <label className="text-[10px] font-black uppercase text-slate-400">Tipo de Banho</label>
                                                    <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-white border border-slate-300 p-2 rounded-xl font-black mt-1 uppercase text-xs">
                                                        {Object.keys(logistics.bathCosts).map(b => <option key={b} value={b}>{b}</option>)}
                                                        <option value="sem_banho">SEM BANHO</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* ITENS EXTRAS DETALHADOS */}
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center bg-slate-900 p-3 rounded-2xl text-white">
                                                <span className="text-[10px] font-black uppercase">Componentes / Custos Extras</span>
                                                <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...editingProduct.additionalCosts, {name: '', value: 0, weight: 0}]})}><i data-lucide="plus-circle" className="size-5"></i></button>
                                            </div>
                                            {editingProduct.additionalCosts.map((c, i) => (
                                                <div key={i} className="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-2xl border-2 border-slate-200 shadow-sm">
                                                    <input placeholder="Nome" value={c.name} onChange={e => { const n = [...editingProduct.additionalCosts]; n[i].name = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="col-span-6 bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold" />
                                                    <input type="number" placeholder="Peso" value={c.weight} onChange={e => { const n = [...editingProduct.additionalCosts]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="col-span-2 bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-black text-right" />
                                                    <input type="number" placeholder="R$" value={c.value} onChange={e => { const n = [...editingProduct.additionalCosts]; n[i].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="col-span-3 bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-black text-right" />
                                                    <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: editingProduct.additionalCosts.filter((_, idx) => idx !== i)})} className="col-span-1 text-rose-500"><i data-lucide="trash-2" className="size-4"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-indigo-600 rounded-[3rem] p-8 text-white flex flex-col justify-between shadow-xl">
                                        <div className="space-y-6">
                                            <div className="flex gap-2 p-1 bg-black/20 rounded-xl w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-4 py-2 rounded-lg text-[10px] font-black ${editingProduct.strategy === 'fixo' ? 'bg-white text-indigo-600' : ''}`}>PREÇO FIXO</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-4 py-2 rounded-lg text-[10px] font-black ${editingProduct.strategy === 'margem' ? 'bg-white text-indigo-600' : ''}`}>MARGEM %</button>
                                            </div>
                                            <input type="number" value={editingProduct.strategy === 'fixo' ? editingProduct.salePrice : editingProduct.targetMargin} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'fixo' ? 'salePrice' : 'targetMargin']: e.target.value})} className="bg-transparent border-b-4 border-white/30 text-6xl font-black w-full outline-none focus:border-white" />
                                        </div>
                                        <div className="mt-8 pt-8 border-t border-white/20 flex justify-between items-end">
                                            <div className="space-y-1">
                                                <p className="text-[10px] font-black opacity-60 uppercase">Peso Final Acumulado</p>
                                                <p className="text-2xl font-black">{calculateProduct(editingProduct).totalWeight.toFixed(1)}g</p>
                                                <p className="text-[10px] font-black opacity-60 uppercase mt-2">Custo de Produção Total</p>
                                                <p className="text-2xl font-black">R$ {calculateProduct(editingProduct).totalProdCost.toFixed(2)}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[10px] font-black opacity-60 uppercase">Lucro Líquido</p>
                                                <p className="text-5xl font-black text-emerald-300 italic">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => { setProducts(products.map(p => p.id === editingProduct.id ? editingProduct : p)); setIsProductModalOpen(false); }} className="mt-8 w-full py-5 bg-white text-indigo-600 rounded-2xl font-black shadow-lg uppercase tracking-wider hover:scale-105 transition-all">Salvar SKU</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
