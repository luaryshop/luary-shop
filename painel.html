<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão de Precisão</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        select { appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 1.5, weight: 20 }, 
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } 
            });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('marketplaces').on('value', s => setMarketplaces(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            const calculateProduct = (prod) => {
                if(!prod) return {};
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || { commission: 20, fixedFee: 3, extraFees: [] };
                
                // Cálculo de Custos e Pesos Extras (Somatória)
                const extraCostsSum = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0);
                const extraWeightsSum = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.weight || 0), 0);
                
                // Peso Total (Base + Embalagem + Extras)
                const totalWeight = Number(prod.baseWeight || 0) + Number(logistics.packaging.weight || 0) + extraWeightsSum;
                
                // Custo de Banho (Baseado apenas no peso da peça)
                const bathVal = (Number(prod.baseWeight) || 0) * (Number(logistics.bathCosts[prod.bathType]) || 0);
                
                // Taxas Extras do Canal
                const channelExtras = (mp.extraFees || []).reduce((acc, f) => acc + Number(f.value || 0), 0);
                
                // Custo Total de Produção
                const totalProdCost = bathVal + extraCostsSum + Number(logistics.packaging.cost);
                const totalFixedFees = Number(mp.fixedFee) + channelExtras;
                
                const divisor = (1 - (Number(mp.commission) + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + totalFixedFees) / divisor : 0;
                
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * (Number(mp.commission)/100)) - totalFixedFees;
                
                return { totalProdCost, finalPrice, profit, suggestedPrice, totalWeight };
            };

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-64 bg-slate-900 text-white p-6 fixed h-full z-20 shadow-xl">
                        <div className="mb-12 font-black italic text-xl hidden lg:block text-amber-500 uppercase tracking-tighter">Luary Shop</div>
                        <nav className="space-y-4">
                            {['catalogo', 'marketplaces', 'logistics'].map(id => (
                                <button key={id} onClick={() => setActiveTab(id)} className={`w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl transition-all ${activeTab === id ? 'bg-amber-500 text-slate-900 shadow-lg' : 'text-slate-500 hover:bg-white/5'}`}>
                                    <Icon name={id === 'catalogo' ? 'package' : id === 'marketplaces' ? 'shopping-cart' : 'truck'} />
                                    <span className="hidden lg:block font-bold text-xs uppercase tracking-widest">{id === 'logistics' ? 'Logística' : id === 'marketplaces' ? 'Canais' : 'Produtos'}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <main className="ml-20 lg:ml-64 p-8 w-full max-w-7xl mx-auto">
                        {activeTab === 'catalogo' && (
                            <div className="space-y-8 animate-in fade-in">
                                <header className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black text-slate-900 italic uppercase">Dashboard de Produtos</h2>
                                    <button onClick={() => {
                                        const key = db.ref('products').push().key;
                                        db.ref(`products/${key}`).set({ id: key, sku: 'SKU-NOVO', name: 'Nova Semijoia', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 50, selectedMarketplace: marketplaces[0]?.id || 'shopee', imageUrl: '', additionalCosts: [] });
                                    }} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black shadow-xl hover:bg-amber-500 transition-all text-xs uppercase tracking-widest">+ Novo Item</button>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {products.map(p => {
                                        const res = calculateProduct(p);
                                        return (
                                            <div key={p.id} className="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl transition-all group flex flex-col">
                                                <div className="aspect-square bg-slate-100 relative overflow-hidden">
                                                    {p.imageUrl ? <img src={p.imageUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="image" size={48} /></div>}
                                                    <div className="absolute top-4 left-4 bg-white/95 backdrop-blur px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-sm">{p.sku}</div>
                                                    <div className="absolute top-4 right-4 bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] font-black shadow-sm">{res.totalWeight?.toFixed(1)}g total</div>
                                                    <button onClick={() => setEditingProduct(p)} className="absolute bottom-4 right-4 bg-slate-900 text-white p-4 rounded-2xl shadow-xl opacity-0 group-hover:opacity-100 transition-all"><Icon name="edit-3" /></button>
                                                </div>
                                                <div className="p-6 space-y-4 flex-1 flex flex-col">
                                                    <h3 className="font-bold text-slate-800 text-sm line-clamp-2 h-10">{p.name}</h3>
                                                    <div className="relative">
                                                        <select className="w-full bg-slate-900 text-white text-[10px] font-black p-3 rounded-xl uppercase tracking-widest outline-none cursor-pointer" value={p.selectedMarketplace} onChange={(e) => db.ref(`products/${p.id}`).update({ selectedMarketplace: e.target.value })}>
                                                            {marketplaces.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                                        </select>
                                                    </div>
                                                    <div className="mt-auto grid grid-cols-2 gap-3 pt-4 border-t border-slate-50">
                                                        <div className="bg-slate-50 p-4 rounded-2xl">
                                                            <p className="text-[8px] font-black text-slate-400 uppercase">Preço Venda</p>
                                                            <p className="font-black text-slate-900 text-lg">R$ {res.finalPrice?.toFixed(2)}</p>
                                                        </div>
                                                        <div className={`p-4 rounded-2xl border ${res.profit > 0 ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-rose-50 border-rose-100 text-rose-600'}`}>
                                                            <p className="text-[8px] font-black text-slate-400 uppercase">Lucro</p>
                                                            <p className="font-black text-lg italic">R$ {res.profit?.toFixed(2)}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* VIEW: LOGÍSTICA (Ajuste de Peso e Custo) */}
                        {activeTab === 'logistics' && (
                            <div className="space-y-8 animate-in slide-in-from-right-4">
                                <h2 className="text-3xl font-black italic uppercase">Configurações Logísticas</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 text-white p-10 rounded-[3.5rem] shadow-2xl">
                                        <h3 className="text-amber-500 font-black mb-8 uppercase text-xs flex items-center gap-2 tracking-[0.2em]"><Icon name="droplet"/> Tabela de Banhos (R$/grama)</h3>
                                        <div className="space-y-4">
                                            {Object.entries(logistics.bathCosts).map(([key, val]) => (
                                                <div key={key} className="flex items-center justify-between bg-white/5 p-5 rounded-3xl border border-white/5 group hover:border-amber-500/30 transition-all">
                                                    <span className="capitalize font-black text-slate-300">{key.replace('_', ' ')}</span>
                                                    <input type="number" step="0.01" className="bg-transparent text-right font-black text-amber-500 w-24 outline-none text-xl" value={val} onChange={e => db.ref('logistics/bathCosts').update({[key]: e.target.value})} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100">
                                        <h3 className="font-black mb-8 uppercase text-slate-400 text-[10px] tracking-widest flex items-center gap-2"><Icon name="package"/> Insumos Padrão (Por Pedido)</h3>
                                        <div className="space-y-6">
                                            <div className="bg-slate-50 p-6 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Custo Embalagem (R$)</label>
                                                <input type="number" className="bg-transparent text-4xl font-black outline-none w-full" value={logistics.packaging.cost} onChange={e => db.ref('logistics/packaging').update({cost: e.target.value})} />
                                            </div>
                                            <div className="bg-slate-50 p-6 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Peso Embalagem (g)</label>
                                                <input type="number" className="bg-transparent text-4xl font-black outline-none w-full" value={logistics.packaging.weight} onChange={e => db.ref('logistics/packaging').update({weight: e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'marketplaces' && (
                             <div className="space-y-8 animate-in slide-in-from-bottom-4">
                                <h2 className="text-3xl font-black italic uppercase text-slate-900">Configuração de Canais</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {marketplaces.map(mp => (
                                        <div key={mp.id} className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-4 mb-8">
                                                <div className="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center text-amber-500 shadow-lg"><Icon name="shopping-bag" size={28}/></div>
                                                <h3 className="text-2xl font-black uppercase tracking-tighter">{mp.name}</h3>
                                            </div>
                                            <div className="space-y-6">
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Comissão %</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.commission} onChange={e => db.ref(`marketplaces/${mp.id}`).update({commission: e.target.value})} /></div>
                                                    <div><label className="text-[10px] font-black text-slate-400 uppercase ml-2">Taxa Fixa R$</label><input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.fixedFee} onChange={e => db.ref(`marketplaces/${mp.id}`).update({fixedFee: e.target.value})} /></div>
                                                </div>
                                                <div className="pt-6 border-t border-slate-100">
                                                    <div className="flex justify-between items-center mb-4"><h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Taxas Extras</h4><button onClick={() => db.ref(`marketplaces/${mp.id}`).update({ extraFees: [...(mp.extraFees || []), { label: 'Nova Taxa', value: 0 }] })} className="text-[9px] font-black bg-slate-900 text-white px-3 py-1.5 rounded-full hover:bg-amber-500 transition-all">+ ADD TAXA</button></div>
                                                    {(mp.extraFees || []).map((fee, idx) => (
                                                        <div key={idx} className="flex gap-2 mb-2">
                                                            <input className="flex-1 bg-slate-50 p-3 rounded-xl text-xs font-bold" value={fee.label} onChange={e => { const fs = [...mp.extraFees]; fs[idx].label = e.target.value; db.ref(`marketplaces/${mp.id}`).update({extraFees: fs}); }} />
                                                            <input type="number" className="w-20 bg-slate-50 p-3 rounded-xl text-xs font-black text-amber-600" value={fee.value} onChange={e => { const fs = [...mp.extraFees]; fs[idx].value = e.target.value; db.ref(`marketplaces/${mp.id}`).update({extraFees: fs}); }} />
                                                            <button onClick={() => db.ref(`marketplaces/${mp.id}`).update({ extraFees: mp.extraFees.filter((_, i) => i !== idx) })} className="text-rose-500 px-2"><Icon name="trash-2" size={16}/></button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE EDIÇÃO COM CAMPOS DE VALOR E PESO EXTRA */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4">
                            <div className="bg-slate-900 text-white w-full max-w-5xl rounded-[3rem] p-10 shadow-2xl border border-white/10 max-h-[90vh] overflow-y-auto custom-scroll">
                                <div className="flex justify-between items-center mb-8">
                                    <div><h2 className="text-2xl font-black italic uppercase tracking-tighter">Editor SKU: <span className="text-amber-500">{editingProduct.sku}</span></h2><p className="text-slate-500 text-[9px] font-black tracking-widest uppercase">Sistema de Cálculo Integrado</p></div>
                                    <button onClick={() => setEditingProduct(null)} className="p-4 bg-white/5 rounded-full hover:bg-rose-500 transition-all"><Icon name="x" /></button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">URL da Imagem</label><input className="w-full bg-white/5 p-4 rounded-2xl border border-white/5 outline-none focus:border-amber-500" value={editingProduct.imageUrl} onChange={e => setEditingProduct({...editingProduct, imageUrl: e.target.value})} /></div>
                                            <div className="space-y-1"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">SKU</label><input className="w-full bg-white/5 p-4 rounded-2xl font-black text-amber-500 outline-none uppercase" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} /></div>
                                        </div>
                                        <div className="space-y-1"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Nome do Produto</label><input className="w-full bg-white/5 p-4 rounded-2xl font-bold outline-none border border-white/5 focus:border-amber-500" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} /></div>
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Peso Bruto Peça (g)</label><input type="number" className="w-full bg-white/5 p-4 rounded-2xl font-black outline-none border border-white/5 focus:border-amber-500" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} /></div>
                                            <div className="space-y-1"><label className="text-[10px] font-black text-slate-500 ml-4 uppercase tracking-widest">Tipo de Banho</label>
                                                <select className="w-full bg-slate-800 p-4 rounded-2xl font-black outline-none border border-white/5 focus:border-amber-500 uppercase text-xs" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}>
                                                    <option value="ouro">Ouro 18k</option><option value="prata">Prata 925</option><option value="niquel">Níquel</option><option value="sem_banho">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* ITENS EXTRAS COM VALOR E PESO SOMADOS */}
                                        <div className="bg-white/5 p-8 rounded-[2.5rem] border border-white/5">
                                            <div className="flex justify-between items-center mb-6">
                                                <h4 className="text-[10px] font-black text-amber-500 uppercase tracking-widest">Custos & Pesos Adicionais (Somados ao final)</h4>
                                                <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...(editingProduct.additionalCosts || []), {item: '', value: 0, weight: 0}]})} className="bg-white/10 px-4 py-2 rounded-xl text-[9px] font-black hover:bg-white/20 transition-all uppercase">+ ADD ITEM</button>
                                            </div>
                                            <div className="space-y-3">
                                                {(editingProduct.additionalCosts || []).map((c, idx) => (
                                                    <div key={idx} className="flex gap-3 animate-in slide-in-from-left-2">
                                                        <input className="flex-[2] bg-slate-800 p-4 rounded-xl text-xs font-bold border border-transparent focus:border-white/10" placeholder="Ex: Saquinho Veludo" value={c.item} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].item = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                        <div className="flex-1 relative">
                                                            <input type="number" className="w-full bg-slate-800 p-4 rounded-xl text-xs font-black text-amber-500 border border-transparent focus:border-amber-500 pl-8" placeholder="R$" value={c.value} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-500 uppercase tracking-tighter">R$</span>
                                                        </div>
                                                        <div className="flex-1 relative">
                                                            <input type="number" className="w-full bg-slate-800 p-4 rounded-xl text-xs font-black text-emerald-400 border border-transparent focus:border-emerald-500 pr-8 text-right" placeholder="g" value={c.weight} onChange={e => { const nc = [...editingProduct.additionalCosts]; nc[idx].weight = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc}); }} />
                                                            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-500 uppercase tracking-tighter italic">g</span>
                                                        </div>
                                                        <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: editingProduct.additionalCosts.filter((_, i) => i !== idx)})} className="text-rose-500 p-2 hover:bg-rose-500/10 rounded-xl transition-all"><Icon name="trash-2" size={18}/></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* PAINEL DE RESULTADOS COM SOMATÓRIA TOTAL */}
                                    <div className="lg:col-span-5 space-y-6">
                                        <div className="bg-amber-500 text-slate-900 p-8 rounded-[3rem] shadow-xl relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-4 font-black italic text-slate-900/10 text-6xl">TOTAL</div>
                                            <p className="text-[10px] font-black uppercase opacity-60 mb-2 tracking-widest relative">Preço Sugerido de Venda</p>
                                            <p className="text-7xl font-black tracking-tighter relative">R$ {calculateProduct(editingProduct).suggestedPrice?.toFixed(2)}</p>
                                        </div>

                                        <div className="bg-white/5 border border-white/10 rounded-[3rem] p-8 space-y-6">
                                            <div className="flex gap-2 p-1 bg-slate-800 rounded-2xl">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`flex-1 py-4 rounded-xl font-black text-[10px] transition-all tracking-widest ${editingProduct.strategy === 'margem' ? 'bg-white text-slate-900 shadow-xl' : 'text-slate-500'}`}>MARGEM %</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`flex-1 py-4 rounded-xl font-black text-[10px] transition-all tracking-widest ${editingProduct.strategy === 'fixo' ? 'bg-white text-slate-900 shadow-xl' : 'text-slate-500'}`}>PREÇO FIXO</button>
                                            </div>
                                            
                                            <div className="text-center group">
                                                <label className="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-2">{editingProduct.strategy === 'margem' ? 'Margem Desejada (%)' : 'Venda Final (R$)'}</label>
                                                <input type="number" className="w-full bg-transparent text-6xl font-black outline-none text-center border-b-2 border-white/5 focus:border-amber-500 transition-all pb-4" value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} />
                                            </div>

                                            <div className="pt-6 border-t border-white/5 space-y-4">
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Peso Total Final:</span><span className="text-xl font-black text-emerald-400 italic">{calculateProduct(editingProduct).totalWeight?.toFixed(1)}g</span></div>
                                                <div className="flex justify-between items-center"><span className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Lucro Real:</span><span className="text-2xl font-black text-white italic">R$ {calculateProduct(editingProduct).profit?.toFixed(2)}</span></div>
                                                <div className="flex justify-between items-center opacity-50"><span className="text-[9px] font-black uppercase">Custo Total Prod:</span><span className="text-sm font-black">R$ {calculateProduct(editingProduct).totalProdCost?.toFixed(2)}</span></div>
                                            </div>
                                        </div>

                                        <div className="flex gap-4">
                                            <button onClick={() => { if(confirm("Deseja apagar este SKU?")) { db.ref(`products/${editingProduct.id}`).remove(); setEditingProduct(null); } }} className="flex-1 bg-rose-500/10 text-rose-500 py-6 rounded-3xl font-black text-[10px] uppercase tracking-widest border border-rose-500/10 hover:bg-rose-500 hover:text-white transition-all">Excluir</button>
                                            <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="flex-[2] bg-white text-slate-900 py-6 rounded-3xl font-black text-[10px] uppercase tracking-widest hover:bg-amber-500 transition-all shadow-xl">Salvar SKU</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
