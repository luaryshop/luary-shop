<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Dashboard</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({ packaging: { cost: 1.5 }, bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('marketplaces').on('value', s => setMarketplaces(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('logistics').on('value', s => s.val() && setLogistics(s.val()));
            }, []);

            const calculateProduct = (prod) => {
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || { commission: 20, fixedFee: 3 };
                const bathVal = (Number(prod.baseWeight) || 0) * (logistics.bathCosts[prod.bathType] || 0);
                const extraCosts = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0);
                const totalProdCost = bathVal + extraCosts + Number(logistics.packaging.cost);
                const divisor = (1 - (Number(mp.commission) + Number(prod.targetMargin || 0)) / 100);
                const finalPrice = prod.strategy === 'margem' ? (totalProdCost + Number(mp.fixedFee)) / divisor : Number(prod.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * (mp.commission/100)) - mp.fixedFee;
                return { totalProdCost, finalPrice, profit };
            };

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-64 bg-slate-900 text-white p-6 fixed h-full">
                        <div className="mb-10 font-black italic text-xl hidden lg:block text-amber-500">LUARY SHOP</div>
                        <nav className="space-y-4">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full flex items-center gap-4 p-4 rounded-2xl ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}>
                                <Icon name="package" /><span className="hidden lg:block font-bold">Produtos</span>
                            </button>
                            <button onClick={() => setActiveTab('marketplaces')} className={`w-full flex items-center gap-4 p-4 rounded-2xl ${activeTab === 'marketplaces' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}>
                                <Icon name="shopping-cart" /><span className="hidden lg:block font-bold">Canais</span>
                            </button>
                            <button onClick={() => setActiveTab('logistics')} className={`w-full flex items-center gap-4 p-4 rounded-2xl ${activeTab === 'logistics' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}>
                                <Icon name="truck" /><span className="hidden lg:block font-bold">Logística</span>
                            </button>
                        </nav>
                    </aside>

                    <main className="ml-20 lg:ml-64 p-10 w-full">
                        {/* ABA: CATÁLOGO */}
                        {activeTab === 'catalogo' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black">Meus SKUs</h2>
                                    <button onClick={() => {
                                        const key = db.ref('products').push().key;
                                        db.ref(`products/${key}`).set({ id: key, sku: 'NOVO', name: 'Novo Produto', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 50, selectedMarketplace: marketplaces[0]?.id || 'shopee' });
                                    }} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold">+ Novo SKU</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 group">
                                            <div className="flex justify-between mb-4">
                                                <span className="text-[10px] font-black bg-slate-100 px-2 py-1 rounded-md">{p.sku}</span>
                                                <button onClick={() => setEditingProduct(p)} className="text-slate-400 hover:text-slate-900"><Icon name="edit" size={16}/></button>
                                            </div>
                                            <h3 className="font-bold text-sm mb-4 line-clamp-1">{p.name}</h3>
                                            <div className="flex justify-between border-t pt-4">
                                                <span className="font-black">R$ {calculateProduct(p).finalPrice.toFixed(2)}</span>
                                                <span className="text-emerald-500 font-black">R$ {calculateProduct(p).profit.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ABA: CANAIS (MARKETPLACES) */}
                        {activeTab === 'marketplaces' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-3xl font-black italic">Gestão de Canais</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {marketplaces.map(mp => (
                                        <div key={mp.id} className="bg-white p-8 rounded-[2.5rem] shadow-xl border-t-4 border-amber-500">
                                            <div className="flex items-center gap-4 mb-6">
                                                <Icon name="store" size={32} className="text-slate-900" />
                                                <h3 className="text-2xl font-black">{mp.name}</h3>
                                            </div>
                                            <div className="grid grid-cols-2 gap-6">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase">Comissão %</label>
                                                    <input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.commission} onChange={e => db.ref(`marketplaces/${mp.id}`).update({commission: e.target.value})} />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase">Taxa Fixa R$</label>
                                                    <input type="number" className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-amber-500" value={mp.fixedFee} onChange={e => db.ref(`marketplaces/${mp.id}`).update({fixedFee: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ABA: LOGÍSTICA (BANHOS E EMBALAGENS) */}
                        {activeTab === 'logistics' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-3xl font-black italic">Custos Operacionais</h2>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 text-white p-8 rounded-[3rem] shadow-2xl">
                                        <h3 className="text-amber-500 font-black mb-6 uppercase tracking-widest text-xs">Tabela de Banhos (R$ por grama)</h3>
                                        <div className="space-y-4">
                                            {Object.entries(logistics.bathCosts).map(([key, val]) => (
                                                <div key={key} className="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5">
                                                    <span className="capitalize font-bold">{key}</span>
                                                    <input type="number" step="0.01" className="bg-transparent text-right font-black text-amber-500 w-24 outline-none" value={val} onChange={e => {
                                                        const newBaths = {...logistics.bathCosts, [key]: e.target.value};
                                                        db.ref('logistics').update({bathCosts: newBaths});
                                                    }} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                        <h3 className="font-black mb-6 uppercase text-slate-400 text-xs">Insumos Gerais</h3>
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <label className="text-[10px] font-black text-slate-400 uppercase">Custo Médio de Embalagem/Brinde</label>
                                            <div className="flex items-center gap-2 mt-2">
                                                <span className="font-black text-2xl">R$</span>
                                                <input type="number" className="bg-transparent text-4xl font-black outline-none w-full" value={logistics.packaging.cost} onChange={e => {
                                                    db.ref('logistics/packaging').update({cost: e.target.value});
                                                }} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DE EDIÇÃO (DARK MODE) */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-md p-4">
                            <div className="bg-slate-900 text-white w-full max-w-4xl rounded-[3rem] p-10 shadow-2xl border border-white/10">
                                <div className="flex justify-between mb-8 items-start">
                                    <h2 className="text-2xl font-black italic">EDITOR: <span className="text-amber-500">{editingProduct.sku}</span></h2>
                                    <button onClick={() => setEditingProduct(null)} className="p-2 hover:bg-white/10 rounded-full"><Icon name="x" /></button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <input className="w-full bg-white/5 p-4 rounded-2xl border border-white/10 font-bold" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <input type="number" placeholder="Peso" className="bg-white/5 p-4 rounded-2xl border border-white/10" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} />
                                            <select className="bg-slate-800 p-4 rounded-2xl" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}>
                                                <option value="ouro">Ouro</option><option value="prata">Prata</option><option value="niquel">Níquel</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="bg-amber-500 text-slate-900 p-8 rounded-[2.5rem] flex flex-col justify-between">
                                        <div>
                                            <p className="text-[10px] font-black uppercase opacity-60">Preço Sugerido</p>
                                            <p className="text-5xl font-black">R$ {calculateProduct(editingProduct).finalPrice.toFixed(2)}</p>
                                        </div>
                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black mt-4">SALVAR</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
