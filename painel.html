<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão de Precisão</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuração Firebase
        const firebaseConfig = { databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Configurações de Canais (Tabela Profissa)
        const salesChannels = {
            shopee: { name: "Shopee", commission: 0.18, fixedFee: 5.00, tax: 0.04 },
            ml: { name: "M. Livre", commission: 0.14, fixedFee: 5.00, tax: 0.04 },
            direto: { name: "Site/Whats", commission: 0.02, fixedFee: 0.00, tax: 0.04 }
        };

        const App = () => {
            const [products, setProducts] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [activeChannel, setActiveChannel] = useState('shopee');

            useEffect(() => {
                const ref = db.ref('products');
                ref.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        setProducts(list);
                    }
                });
                return () => ref.off();
            }, []);

            const calculateProduct = (p) => {
                if (!p) return {};
                const baseCost = parseFloat(p.price) || 0;
                const weight = parseFloat(p.weight) || 0;
                const bathPrice = parseFloat(p.bathPrice) || 0;
                
                // Custo Total = Preço Peça + (Peso x Valor do Banho)
                const totalCost = baseCost + (weight * bathPrice);
                
                const margin = (parseFloat(p.margin) || 35) / 100;
                const channel = salesChannels[activeChannel];
                
                const divisor = 1 - (channel.commission + margin + channel.tax);
                const suggested = divisor > 0 ? (totalCost + channel.fixedFee) / divisor : 0;
                const profit = suggested > 0 ? suggested - totalCost - (suggested * channel.commission) - channel.fixedFee - (suggested * channel.tax) : 0;

                return { suggested, profit, totalCost };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24">
                    <header className="p-8 pt-12 flex justify-between items-center">
                        <div>
                            <h1 className="text-4xl font-black tracking-tighter text-slate-900">LUARY<span className="text-amber-500">.</span></h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest italic">Logística e Banho</p>
                        </div>
                        <button onClick={() => setEditingProduct({ name: '', price: '', weight: '', margin: '35', stock: '0', bathPrice: '0' })} 
                                className="bg-slate-900 text-white w-12 h-12 rounded-2xl shadow-xl font-bold text-2xl flex items-center justify-center">+</button>
                    </header>

                    <div className="px-8 flex gap-2 overflow-x-auto no-scrollbar mb-6">
                        {Object.keys(salesChannels).map(key => (
                            <button key={key} onClick={() => setActiveChannel(key)}
                                className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap transition-all ${activeChannel === key ? 'bg-amber-500 text-white shadow-md' : 'bg-white text-slate-400'}`}>
                                {salesChannels[key].name}
                            </button>
                        ))}
                    </div>

                    <div className="px-8 space-y-4">
                        {products.map(p => {
                            const res = calculateProduct(p);
                            return (
                                <div key={p.id} onClick={() => setEditingProduct(p)} className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-50 cursor-pointer active:scale-95 transition-all">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="max-w-[180px]">
                                            <h3 className="text-lg font-black text-slate-800 leading-tight">{p.name || 'Sem nome'}</h3>
                                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{p.weight}g | Est: {p.stock}</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[8px] font-black text-slate-400 uppercase block">Venda Sugerida</span>
                                            <span className="text-xl font-black text-slate-900 italic">R$ {res.suggested?.toFixed(2)}</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center pt-4 border-t border-slate-50">
                                        <span className="text-[9px] font-black text-slate-400 uppercase italic text-amber-600">Banho: R$ {p.bathPrice}/g</span>
                                        <span className="text-[9px] font-black text-emerald-500 uppercase">Lucro: R$ {res.profit?.toFixed(2)}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {editingProduct && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-end">
                            <div className="bg-slate-50 w-full max-h-[95vh] rounded-t-[3rem] p-8 overflow-y-auto custom-scroll shadow-2xl border-t-4 border-amber-500">
                                <div className="max-w-md mx-auto space-y-6">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-black italic text-slate-900">Editor Profissa</h2>
                                        <button onClick={() => setEditingProduct(null)} className="font-bold text-slate-400 text-xs uppercase bg-white px-4 py-2 rounded-full shadow-sm">Fechar</button>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Nome do Item</label>
                                            <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none border-2 border-transparent focus:border-amber-400 transition-all" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Custo Base (R$)</label>
                                                <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Peso (g)</label>
                                                <input type="number" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-amber-600 ml-4 italic font-bold">Valor do Banho (g)</label>
                                                <input type="number" value={editingProduct.bathPrice} onChange={e => setEditingProduct({...editingProduct, bathPrice: e.target.value})} className="w-full bg-amber-50 p-5 rounded-3xl font-bold shadow-sm outline-none border-2 border-amber-200" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Margem (%)</label>
                                                <input type="number" value={editingProduct.margin} onChange={e => setEditingProduct({...editingProduct, margin: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4 italic">Estoque Atual</label>
                                            <input type="number" value={editingProduct.stock} onChange={e => setEditingProduct({...editingProduct, stock: e.target.value})} className="w-full bg-white p-5 rounded-3xl font-bold shadow-sm outline-none" />
                                        </div>

                                        <div className="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-24 h-24 bg-amber-500/10 rounded-full -mr-10 -mt-10"></div>
                                            <div className="flex justify-between items-center relative z-10">
                                                <div>
                                                    <span className="text-[9px] font-black uppercase text-slate-500 block">Sugerido ({salesChannels[activeChannel].name})</span>
                                                    <span className="text-3xl font-black italic text-amber-500">R$ {calculateProduct(editingProduct).suggested?.toFixed(2)}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[9px] font-black uppercase text-slate-500 block">Lucro Limpo</span>
                                                    <span className="text-xl font-black text-emerald-400">R$ {calculateProduct(editingProduct).profit?.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <button onClick={() => {
                                            const id = editingProduct.id || db.ref('products').push().key;
                                            db.ref(`products/${id}`).set({...editingProduct, id});
                                            setEditingProduct(null);
                                        }} className="w-full bg-slate-900 text-white py-6 rounded-3xl font-black uppercase hover:bg-amber-500 transition-all shadow-xl shadow-slate-200 italic">Salvar Dados</button>
                                        
                                        {editingProduct.id && (
                                            <button onClick={() => confirm('Remover este item?') && (db.ref(`products/${editingProduct.id}`).remove(), setEditingProduct(null))} className="w-full text-rose-500 font-black text-[9px] uppercase tracking-widest opacity-40 hover:opacity-100 transition-all">Excluir Permanente</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
