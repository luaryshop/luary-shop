<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Gestão Total</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0F172A; color: #F8FAFC; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-gradient { background: linear-gradient(135deg, #FDE047 0%, #EAB308 100%); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #EAB308; border-radius: 10px; }
        .tab-active { color: #EAB308; border-bottom: 2px solid #EAB308; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = { databaseURL: "https://luary-shop-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [products, setProducts] = useState([]);
            const [channels, setChannels] = useState([]);
            const [logistics, setLogistics] = useState({ bathOuro: 0.85, bathPrata: 0.60, packaging: 2.00 });
            const [editingProduct, setEditingProduct] = useState(null);
            const [editingChannel, setEditingChannel] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeTab, setActiveTab] = useState('estoque'); // 'estoque' ou 'logistica'

            useEffect(() => {
                db.ref('products').on('value', snap => {
                    const data = snap.val();
                    setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                db.ref('channels').on('value', snap => {
                    const data = snap.val();
                    setChannels(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [
                        { id: 'shopee', name: 'Shopee', commission: 20, fixed: 3, tax: 0 },
                        { id: 'ml', name: 'M. Livre', commission: 14, fixed: 5, tax: 0 }
                    ]);
                });
                db.ref('logistics').on('value', snap => { if(snap.val()) setLogistics(snap.val()); });
            }, []);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [products, activeTab, editingProduct, editingChannel]);

            const calculate = (p, channel) => {
                if (!p || !channel) return { suggested: 0, profit: 0 };
                const costBase = parseFloat(p.price) || 0;
                const weight = parseFloat(p.weight) || 0;
                const extraVal = parseFloat(p.extraCash) || 0;
                const extraPerc = (parseFloat(p.extraPerc) || 0) / 100;
                
                const bathRate = p.bathType === 'prata' ? logistics.bathPrata : logistics.bathOuro;
                const totalProdCost = costBase + (weight * bathRate) + extraVal + (costBase * extraPerc) + (parseFloat(logistics.packaging) || 0);
                
                const margin = (parseFloat(p.margin) || 35) / 100;
                const chanComm = (parseFloat(channel.commission) || 0) / 100;
                const chanTax = (parseFloat(channel.tax) || 0) / 100;
                const chanFixed = parseFloat(channel.fixed) || 0;

                const divisor = 1 - (chanComm + margin + chanTax);
                const suggested = divisor > 0 ? (totalProdCost + chanFixed) / divisor : 0;
                const profit = suggested > 0 ? suggested - totalProdCost - (suggested * chanComm) - chanFixed - (suggested * chanTax) : 0;

                return { suggested, profit, totalProdCost };
            };

            return (
                <div className="max-w-5xl mx-auto min-h-screen p-6 pb-32">
                    {/* Header */}
                    <header className="flex justify-between items-center mb-10">
                        <div>
                            <h1 className="text-4xl font-black gold-gradient bg-clip-text text-transparent italic tracking-tighter">LUARY SHOP</h1>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Painel Administrativo v3.0</p>
                        </div>
                        {activeTab === 'estoque' && (
                            <button onClick={() => setEditingProduct({ name: '', price: '', weight: '', margin: '35', bathType: 'ouro', stock: 0, extraCash: 0, extraPerc: 0, image: '' })} 
                                    className="gold-gradient text-slate-900 px-6 py-3 rounded-2xl font-black text-xs uppercase flex items-center gap-2">
                                <i data-lucide="plus" className="w-4 h-4"></i> Novo Item
                            </button>
                        )}
                    </header>

                    {/* Conteúdo: ESTOQUE */}
                    {activeTab === 'estoque' && (
                        <div className="space-y-6">
                            <div className="glass p-4 rounded-3xl flex items-center px-6">
                                <i data-lucide="search" className="text-slate-500 mr-4"></i>
                                <input onChange={e => setSearchTerm(e.target.value)} className="bg-transparent w-full outline-none font-bold" placeholder="Buscar no catálogo..." />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => (
                                    <div key={p.id} onClick={() => setEditingProduct(p)} className="glass rounded-[2.5rem] overflow-hidden cursor-pointer product-card transition-all">
                                        <div className="h-48 bg-slate-800 relative">
                                            <img src={p.image || 'https://via.placeholder.com/400x300/1e293b/fbbf24?text=Luary+Shop'} className="w-full h-full object-cover" />
                                            <div className="absolute top-4 right-4 glass px-3 py-1 rounded-full text-[10px] font-bold text-amber-500">Estoque: {p.stock}</div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="font-black text-lg truncate">{p.name}</h3>
                                            <div className="mt-4 space-y-2">
                                                {channels.slice(0, 2).map(c => (
                                                    <div key={c.id} className="flex justify-between text-xs">
                                                        <span className="text-slate-500 font-bold uppercase">{c.name}</span>
                                                        <span className="font-black text-amber-500">R$ {calculate(p, c).suggested.toFixed(2)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Conteúdo: LOGÍSTICA & CANAIS */}
                    {activeTab === 'logistica' && (
                        <div className="space-y-8">
                            <section className="glass p-8 rounded-[3rem]">
                                <h2 className="text-xl font-black mb-6 flex items-center gap-2"><i data-lucide="settings" className="text-amber-500"></i> Custos Globais</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Banho Ouro (R$/g)</label>
                                        <input type="number" value={logistics.bathOuro} onChange={e => { const val = {...logistics, bathOuro: e.target.value}; setLogistics(val); db.ref('logistics').set(val); }} className="w-full bg-white/5 p-4 rounded-2xl font-bold outline-none border border-white/10 focus:border-amber-500" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Banho Prata (R$/g)</label>
                                        <input type="number" value={logistics.bathPrata} onChange={e => { const val = {...logistics, bathPrata: e.target.value}; setLogistics(val); db.ref('logistics').set(val); }} className="w-full bg-white/5 p-4 rounded-2xl font-bold outline-none border border-white/10 focus:border-amber-500" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Embalagem/Brinde (R$)</label>
                                        <input type="number" value={logistics.packaging} onChange={e => { const val = {...logistics, packaging: e.target.value}; setLogistics(val); db.ref('logistics').set(val); }} className="w-full bg-white/5 p-4 rounded-2xl font-bold outline-none border border-white/10 focus:border-amber-500" />
                                    </div>
                                </div>
                            </section>

                            <section className="glass p-8 rounded-[3rem]">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-black flex items-center gap-2"><i data-lucide="shopping-cart" className="text-amber-500"></i> Canais de Venda</h2>
                                    <button onClick={() => setEditingChannel({ name: '', commission: 0, fixed: 0, tax: 0 })} className="text-[10px] font-black uppercase text-amber-500 border border-amber-500/30 px-4 py-2 rounded-xl">+ Adicionar Canal</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {channels.map(c => (
                                        <div key={c.id} onClick={() => setEditingChannel(c)} className="bg-white/5 p-6 rounded-[2rem] border border-white/5 cursor-pointer hover:border-amber-500/50 transition-all flex justify-between items-center">
                                            <div>
                                                <p className="font-black italic">{c.name}</p>
                                                <p className="text-[10px] text-slate-500 font-bold uppercase">{c.commission}% comissão | R$ {c.fixed} fixo</p>
                                            </div>
                                            <i data-lucide="edit-3" className="w-4 h-4 text-slate-600"></i>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    )}

                    {/* Modal Produto com Custos Extras */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-md" onClick={() => setEditingProduct(null)}></div>
                            <div className="glass w-full max-w-2xl max-h-[90vh] rounded-[3rem] p-8 overflow-y-auto custom-scroll relative">
                                <h2 className="text-2xl font-black italic mb-8 uppercase tracking-tighter">Detalhes da Peça</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="md:col-span-2 space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Nome do Produto</label>
                                        <input value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Preço Bruto Peça (R$)</label>
                                        <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Peso (g)</label>
                                        <input type="number" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-amber-500 uppercase">Custo Extra Fixo (R$)</label>
                                        <input type="number" value={editingProduct.extraCash} onChange={e => setEditingProduct({...editingProduct, extraCash: e.target.value})} className="w-full bg-amber-500/5 border border-amber-500/20 p-4 rounded-2xl font-bold text-amber-500" placeholder="Ex: Brinde..." />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-amber-500 uppercase">Custo Extra Variável (%)</label>
                                        <input type="number" value={editingProduct.extraPerc} onChange={e => setEditingProduct({...editingProduct, extraPerc: e.target.value})} className="w-full bg-amber-500/5 border border-amber-500/20 p-4 rounded-2xl font-bold text-amber-500" placeholder="Ex: % Perda..." />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Margem Desejada (%)</label>
                                        <input type="number" value={editingProduct.margin} onChange={e => setEditingProduct({...editingProduct, margin: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold outline-none" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Banho</label>
                                        <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-slate-800 p-4 rounded-2xl font-bold">
                                            <option value="ouro">Ouro</option>
                                            <option value="prata">Prata</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="mt-8 flex gap-4">
                                    <button onClick={() => {
                                        const id = editingProduct.id || db.ref('products').push().key;
                                        db.ref(`products/${id}`).set({...editingProduct, id});
                                        setEditingProduct(null);
                                    }} className="flex-1 gold-gradient text-slate-900 py-5 rounded-2xl font-black uppercase">Salvar Produto</button>
                                    {editingProduct.id && (
                                        <button onClick={() => confirm('Remover?') && (db.ref(`products/${editingProduct.id}`).remove(), setEditingProduct(null))} className="bg-rose-500/20 text-rose-500 px-6 rounded-2xl"><i data-lucide="trash-2"></i></button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Canal de Venda */}
                    {editingChannel && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-md" onClick={() => setEditingChannel(null)}></div>
                            <div className="glass w-full max-w-md rounded-[3rem] p-8 relative">
                                <h2 className="text-xl font-black mb-6 uppercase tracking-tighter">Configurar Canal</h2>
                                <div className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Nome do Canal</label>
                                        <input value={editingChannel.name} onChange={e => setEditingChannel({...editingChannel, name: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Comissão (%)</label>
                                            <input type="number" value={editingChannel.commission} onChange={e => setEditingChannel({...editingChannel, commission: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Taxa Fixa (R$)</label>
                                            <input type="number" value={editingChannel.fixed} onChange={e => setEditingChannel({...editingChannel, fixed: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">Imposto/Outros (%)</label>
                                        <input type="number" value={editingChannel.tax} onChange={e => setEditingChannel({...editingChannel, tax: e.target.value})} className="w-full bg-white/5 p-4 rounded-2xl font-bold" />
                                    </div>
                                </div>
                                <button onClick={() => {
                                    const id = editingChannel.id || db.ref('channels').push().key;
                                    db.ref(`channels/${id}`).set({...editingChannel, id});
                                    setEditingChannel(null);
                                }} className="w-full gold-gradient text-slate-900 py-5 rounded-2xl font-black uppercase mt-8">Salvar Canal</button>
                            </div>
                        </div>
                    )}

                    {/* Nav Flutuante */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 glass px-10 py-5 rounded-full flex gap-16 z-40 border-amber-500/20 shadow-2xl">
                        <button onClick={() => setActiveTab('estoque')} className={`flex flex-col items-center gap-1 ${activeTab === 'estoque' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <i data-lucide="layout-grid" className="w-6 h-6"></i>
                            <span className="text-[8px] font-black uppercase tracking-widest">Estoque</span>
                        </button>
                        <button onClick={() => setActiveTab('logistica')} className={`flex flex-col items-center gap-1 ${activeTab === 'logistica' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <i data-lucide="truck" className="w-6 h-6"></i>
                            <span className="text-[8px] font-black uppercase tracking-widest">Logística</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
