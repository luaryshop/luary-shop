<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luary Shop</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <!-- Ícones -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 🔥 CONFIG FIREBASE (COLOQUE SUA API KEY SE PRECISAR)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();

    // 🔹 Ícones
    const Icon = ({ name }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);

      return <i data-lucide={name}></i>;
    };

    const App = () => {
      const [products, setProducts] = useState([]);
      const [editingProduct, setEditingProduct] = useState(null);

      // 🔄 Carregar dados
      useEffect(() => {
        db.ref("products").on("value", (snap) => {
          const data = snap.val() || {};
          setProducts(Object.values(data));
        });
      }, []);

      // ➕ Criar produto
      const addProduct = () => {
        const id = db.ref("products").push().key;

        db.ref(`products/${id}`).set({
          id,
          name: "Novo Produto",
          sku: "REF-00",
          price: 0,
          margin: 50
        });
      };

      // 🧮 Cálculo
      const calculate = (p) => {
        const cost = Number(p.price || 0);
        const margin = Number(p.margin || 50) / 100;

        const sale = cost / (1 - margin);
        const profit = sale - cost;

        return { sale, profit };
      };

      return (
        <div className="p-10 text-white max-w-6xl mx-auto">

          {/* HEADER */}
          <div className="flex justify-between mb-10">
            <h1 className="text-3xl font-black flex items-center gap-2">
              Luary Shop <Icon name="gem" />
            </h1>

            <button
              onClick={addProduct}
              className="bg-amber-500 px-6 py-3 rounded-xl font-bold flex items-center gap-2"
            >
              <Icon name="plus" /> Produto
            </button>
          </div>

          {/* LISTA */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {products.map((p) => {
              const calc = calculate(p);

              return (
                <div
                  key={p.id}
                  className="bg-slate-800 p-6 rounded-2xl cursor-pointer hover:scale-105 transition"
                  onClick={() => setEditingProduct(p)}
                >
                  <h2 className="font-bold text-lg">{p.name}</h2>
                  <p className="text-sm text-slate-400">{p.sku}</p>

                  <div className="mt-4 space-y-1">
                    <p>💰 Venda: R$ {calc.sale.toFixed(2)}</p>
                    <p className="text-emerald-400">
                      Lucro: R$ {calc.profit.toFixed(2)}
                    </p>
                  </div>
                </div>
              );
            })}
          </div>

          {/* MODAL */}
          {editingProduct && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center">

              <div className="bg-slate-900 p-10 rounded-3xl w-96 space-y-4">

                <h2 className="font-bold text-xl">Editar Produto</h2>

                <input
                  className="w-full p-3 rounded bg-slate-800"
                  placeholder="Nome"
                  value={editingProduct.name}
                  onChange={(e) =>
                    setEditingProduct({
                      ...editingProduct,
                      name: e.target.value
                    })
                  }
                />

                <input
                  className="w-full p-3 rounded bg-slate-800"
                  placeholder="SKU"
                  value={editingProduct.sku}
                  onChange={(e) =>
                    setEditingProduct({
                      ...editingProduct,
                      sku: e.target.value
                    })
                  }
                />

                <input
                  type="number"
                  className="w-full p-3 rounded bg-slate-800"
                  placeholder="Custo"
                  value={editingProduct.price}
                  onChange={(e) =>
                    setEditingProduct({
                      ...editingProduct,
                      price: e.target.value
                    })
                  }
                />

                <input
                  type="number"
                  className="w-full p-3 rounded bg-slate-800"
                  placeholder="Margem (%)"
                  value={editingProduct.margin}
                  onChange={(e) =>
                    setEditingProduct({
                      ...editingProduct,
                      margin: e.target.value
                    })
                  }
                />

                <button
                  onClick={() => {
                    db.ref(`products/${editingProduct.id}`).set(editingProduct);
                    setEditingProduct(null);
                  }}
                  className="w-full bg-amber-500 py-3 rounded-xl font-bold"
                >
                  Salvar
                </button>

                <button
                  onClick={() => setEditingProduct(null)}
                  className="w-full text-slate-400"
                >
                  Cancelar
                </button>

                <button
                  onClick={() => {
                    db.ref(`products/${editingProduct.id}`).remove();
                    setEditingProduct(null);
                  }}
                  className="w-full text-rose-500 text-sm"
                >
                  Excluir Produto
                </button>

              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
