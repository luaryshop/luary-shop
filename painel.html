<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luary Control</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>

<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

/* 🔥 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_AUTH_DOMAIN",
  databaseURL: "SUA_DATABASE_URL",
  projectId: "SEU_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* 🔐 LOGIN */
function Login({ setUser }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");

  const login = async () => {
    try {
      const user = await auth.signInWithEmailAndPassword(email, senha);
      setUser(user.user);
    } catch {
      alert("Erro ao logar");
    }
  };

  return (
    <div className="flex h-screen items-center justify-center">
      <div className="bg-white p-8 rounded-2xl shadow w-80">
        <h2 className="text-xl font-bold mb-4">Luary Control</h2>
        <input placeholder="Email" className="w-full p-2 border mb-2"
          onChange={e=>setEmail(e.target.value)} />
        <input type="password" placeholder="Senha" className="w-full p-2 border mb-4"
          onChange={e=>setSenha(e.target.value)} />
        <button onClick={login} className="w-full bg-black text-white p-2 rounded">
          Entrar
        </button>
      </div>
    </div>
  );
}

/* 🧠 CALCULO */
function calcular(prod, mp, logistics) {
  if (!prod) return {price:0, profit:0};

  const custoBanho = (prod.weight || 0) * (logistics.bath[prod.bath] || 0);
  const custoTotal = custoBanho + logistics.pack;

  const divisor = 1 - ((mp.commission + prod.margin) / 100);
  const preco = divisor > 0 ? (custoTotal + mp.fee) / divisor : 0;

  const lucro = preco - custoTotal - (preco * mp.commission/100) - mp.fee;

  return {price: preco, profit: lucro};
}

/* 🏠 APP */
function App() {
  const [user, setUser] = useState(null);
  const [products, setProducts] = useState([]);
  const [marketplaces, setMarketplaces] = useState([]);
  const [logistics, setLogistics] = useState({
    pack: 1.5,
    bath: { ouro: 0.8, prata: 0.6 }
  });

  const [newProd, setNewProd] = useState({
    name: "",
    weight: 0,
    bath: "ouro",
    margin: 50,
    marketplace: ""
  });

  useEffect(()=>{
    auth.onAuthStateChanged(u => setUser(u));

    db.ref("products").on("value", s=>{
      setProducts(Object.values(s.val() || {}));
    });

    db.ref("marketplaces").on("value", s=>{
      setMarketplaces(Object.values(s.val() || {}));
    });
  },[]);

  if (!user) return <Login setUser={setUser} />;

  const addProduct = () => {
    const id = Date.now();
    db.ref("products/"+id).set({...newProd, id});
  };

  return (
    <div className="p-6 max-w-5xl mx-auto">

      <div className="flex justify-between mb-6">
        <h1 className="text-2xl font-bold">Luary Control</h1>
        <button onClick={()=>auth.signOut()} className="text-red-500">
          Sair
        </button>
      </div>

      {/* NOVO PRODUTO */}
      <div className="bg-white p-4 rounded shadow mb-6">
        <h2 className="font-bold mb-2">Novo Produto</h2>

        <input placeholder="Nome" className="border p-2 w-full mb-2"
          onChange={e=>setNewProd({...newProd, name:e.target.value})}/>

        <input type="number" placeholder="Peso (g)" className="border p-2 w-full mb-2"
          onChange={e=>setNewProd({...newProd, weight:parseFloat(e.target.value)})}/>

        <select className="border p-2 w-full mb-2"
          onChange={e=>setNewProd({...newProd, bath:e.target.value})}>
          <option value="ouro">Ouro</option>
          <option value="prata">Prata</option>
        </select>

        <input type="number" placeholder="Margem %" className="border p-2 w-full mb-2"
          onChange={e=>setNewProd({...newProd, margin:parseFloat(e.target.value)})}/>

        <select className="border p-2 w-full mb-2"
          onChange={e=>setNewProd({...newProd, marketplace:e.target.value})}>
          <option>Selecione canal</option>
          {marketplaces.map(m=>(
            <option key={m.id} value={m.id}>{m.name}</option>
          ))}
        </select>

        <button onClick={addProduct} className="bg-black text-white px-4 py-2 rounded">
          Salvar
        </button>
      </div>

      {/* LISTA */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {products.map(p=>{
          const mp = marketplaces.find(m=>m.id === p.marketplace) || {commission:0, fee:0};
          const res = calcular(p, mp, logistics);

          return (
            <div key={p.id} className="bg-white p-4 rounded shadow">
              <h3 className="font-bold">{p.name}</h3>
              <p>Preço: R$ {res.price.toFixed(2)}</p>
              <p className={res.profit>0?"text-green-500":"text-red-500"}>
                Lucro: R$ {res.profit.toFixed(2)}
              </p>
            </div>
          );
        })}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
