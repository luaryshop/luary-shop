<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema Oficial</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select, textarea { background: #0f172a !important; color: white !important; border: 1px solid #334155 !important; }
        input:focus { border-color: #fbbf24 !important; outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 0, weight: 0 }, 
                bathCosts: { ouro: 0, prata: 0, niquel: 0 }, 
                extraLogistics: [] 
            });
            const [marketplaces, setMarketplaces] = useState([
                { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3, tax: 0 },
                { id: 'ml', name: 'Mercado Livre', commission: 16, fixedFee: 6, tax: 0 }
            ]);
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('logistics').on('value', s => { if(s.val()) setLogistics(s.val()); });
                db.ref('marketplaces').on('value', s => { if(s.val()) setMarketplaces(Object.values(s.val())); });
            }, []);

            const calculateProduct = (p) => {
                if (!p) return { totalWeight: 0, totalProdCost: 0, profit: 0, finalPrice: 0 };
                
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0];
                
                // Pesos - Proteção com Number e fallback para 0
                const packW = Number(logistics?.packaging?.weight || 0);
                const addW = (p.additionalCosts || []).reduce((a, c) => a + Number(c.weight || 0), 0);
                const mimW = (p.mimos || []).reduce((a, m) => a + Number(m.weight || 0), 0);
                const logW = (logistics?.extraLogistics || []).reduce((a, l) => a + Number(l.weight || 0), 0);
                const totalWeight = Number(p.baseWeight || 0) + packW + addW + mimW + logW;

                // Custos
                let bath = p.bathType !== 'sem_banho' ? Number(p.baseWeight || 0) * (Number(logistics?.bathCosts?.[p.bathType] || 0)) : 0;
                const packC = Number(logistics?.packaging?.cost || 0);
                const addC = (p.additionalCosts || []).reduce((a, c) => a + Number(c.value || 0), 0);
                const mimC = (p.mimos || []).reduce((a, m) => a + Number(m.value || 0), 0);
                const logC = (logistics?.extraLogistics || []).reduce((a, l) => a + Number(l.value || 0), 0);
                const totalProdCost = bath + addC + mimC + packC + logC;

                // Impostos
                const taxP = Number(mp.commission || 0) + Number(mp.tax || 0);
                const taxF = Number(mp.fixedFee || 0);

                const div = (1 - (taxP + Number(p.targetMargin || 0)) / 100);
                const finalPrice = p.strategy === 'margem' ? (totalProdCost + taxF) / (div > 0 ? div : 1) : Number(p.salePrice || 0);
                const profit = finalPrice - totalProdCost - (finalPrice * (taxP / 100)) - taxF;

                return { totalWeight, totalProdCost, finalPrice, profit };
            };

            const changeMarketplaceFast = (prod, direction) => {
                const currentIndex = marketplaces.findIndex(m => m.id === prod.selectedMarketplace);
                let nextIndex = (currentIndex + direction + marketplaces.length) % marketplaces.length;
                db.ref(`products/${prod.id}`).update({ selectedMarketplace: marketplaces[nextIndex].id });
            };

            useEffect(() => { if(window.lucide) lucide.createIcons(); });

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-64 border-r border-white/5 bg-slate-900/50 flex flex-col p-4 sticky top-0 h-screen">
                        <div className="h-20 flex items-center px-4 mb-10 text-amber-500 font-black text-2xl italic">LUARY</div>
                        <nav className="space-y-2">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full p-4 rounded-2xl flex items-center gap-4 transition-all ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="package"></i><span className="hidden lg:block">Estoque</span></button>
                            <button onClick={() => setActiveTab('marketplaces')} className={`w-full p-4 rounded-2xl flex items-center gap-4 transition-all ${activeTab === 'marketplaces' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="shopping-bag"></i><span className="hidden lg:block">Canais</span></button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full p-4 rounded-2xl flex items-center gap-4 transition-all ${activeTab === 'logistica' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-white/5'}`}><i data-lucide="truck"></i><span className="hidden lg:block">Logística</span></button>
                        </nav>
                    </aside>

                    <main className="flex-1 p-8">
                        {activeTab === 'catalogo' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-2xl font-black">Catálogo Luary Shop</h1>
                                    <button onClick={() => setEditingProduct({ id: Date.now().toString(), name: '', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 40, additionalCosts: [], mimos: [], selectedMarketplace: marketplaces[0].id })} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-xl font-bold hover:scale-105 transition-all">+ Novo SKU</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {products.map(p => {
                                        const res = calculateProduct(p);
                                        const mpName = marketplaces.find(m => m.id === p.selectedMarketplace)?.name;
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2rem] p-5 group relative border border-white/5">
                                                <button onClick={() => setEditingProduct(p)} className="absolute top-4 right-4 z-10 bg-amber-500 p-2 rounded-lg text-slate-950"><i data-lucide="edit-3" className="size-4"></i></button>
                                                <div className="h-40 bg-slate-800 rounded-2xl mb-4 overflow-hidden border border-white/5">
                                                    {p.imageUrl ? <img src={p.imageUrl} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center opacity-10"><i data-lucide="image" className="size-8"></i></div>}
                                                </div>
                                                <h3 className="font-bold text-xs mb-2 h-8 line-clamp-2 uppercase text-slate-200">{p.name}</h3>
                                                <div className="flex justify-between items-center bg-black/40 p-2 rounded-xl mb-4 border border-white/5">
                                                    <button onClick={() => changeMarketplaceFast(p, -1)} className="text-amber-500"><i data-lucide="chevron-left" className="size-4"></i></button>
                                                    <span className="text-[9px] font-black text-amber-500">{mpName}</span>
                                                    <button onClick={() => changeMarketplaceFast(p, 1)} className="text-amber-500"><i data-lucide="chevron-right" className="size-4"></i></button>
                                                </div>
                                                <div className="flex justify-between border-t border-white/5 pt-4">
                                                    <div><p className="text-[9px] text-slate-500 font-bold uppercase">Lucro</p><p className="text-lg font-black text-emerald-400">R$ {res.profit.toFixed(2)}</p></div>
                                                    <div className="text-right"><p className="text-[9px] text-slate-500 font-bold uppercase">Peso</p><p className="text-lg font-black text-slate-200">{res.totalWeight.toFixed(1)}g</p></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logistica' && (
                            <div className="max-w-2xl mx-auto glass-card p-10 rounded-[2.5rem] space-y-8">
                                <h2 className="text-xl font-black text-amber-500 uppercase italic">Logística Global</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase">Custo Caixa (R$)</label><input type="number" step="0.01" value={logistics.packaging.cost} onChange={e => {const d = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}}; setLogistics(d); db.ref('logistics').set(d)}} className="w-full p-4 rounded-xl mt-1"/></div>
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase">Peso Caixa (g)</label><input type="number" value={logistics.packaging.weight} onChange={e => {const d = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}}; setLogistics(d); db.ref('logistics').set(d)}} className="w-full p-4 rounded-xl mt-1"/></div>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b border-white/5 pb-2"><span className="text-[10px] font-black text-slate-400 uppercase">Mimos e Insumos Fixos</span><button onClick={() => {const d = {...logistics, extraLogistics: [...(logistics.extraLogistics || []), {name: '', value: 0, weight: 0}]}; setLogistics(d); db.ref('logistics').set(d)}} className="text-amber-500"><i data-lucide="plus-circle"></i></button></div>
                                    {(logistics.extraLogistics || []).map((it, i) => (
                                        <div key={i} className="flex gap-2">
                                            <input className="flex-1 p-3 rounded-xl text-xs" placeholder="Item" value={it.name} onChange={e => {const n = [...logistics.extraLogistics]; n[i].name = e.target.value; const d = {...logistics, extraLogistics: n}; setLogistics(d); db.ref('logistics').set(d)}} />
                                            <input type="number" className="w-20 p-3 rounded-xl text-xs" placeholder="g" value={it.weight} onChange={e => {const n = [...logistics.extraLogistics]; n[i].weight = e.target.value; const d = {...logistics, extraLogistics: n}; setLogistics(d); db.ref('logistics').set(d)}} />
                                            <input type="number" className="w-24 p-3 rounded-xl text-xs font-bold text-emerald-400" placeholder="R$" value={it.value} onChange={e => {const n = [...logistics.extraLogistics]; n[i].value = e.target.value; const d = {...logistics, extraLogistics: n}; setLogistics(d); db.ref('logistics').set(d)}} />
                                            <button onClick={() => {const n = logistics.extraLogistics.filter((_, idx) => idx !== i); const d = {...logistics, extraLogistics: n}; setLogistics(d); db.ref('logistics').set(d)}} className="text-rose-500"><i data-lucide="trash-2"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Editor de SKU */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 p-4 backdrop-blur-md">
                            <div className="bg-slate-900 w-full max-w-6xl rounded-[3rem] border border-white/10 flex flex-col max-h-[90vh] overflow-hidden shadow-2xl">
                                <div className="p-8 border-b border-white/5 flex justify-between items-center bg-black/20">
                                    <h2 className="text-amber-500 font-black uppercase tracking-widest italic">Editor de Peças</h2>
                                    <button onClick={() => setEditingProduct(null)} className="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-8 grid grid-cols-1 lg:grid-cols-2 gap-10 custom-scroll">
                                    <div className="space-y-6">
                                        <div className="space-y-4">
                                            <label className="text-[10px] font-black text-slate-500 uppercase">SKU Identificador</label>
                                            <input value={editingProduct.sku || ''} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} className="w-full p-4 rounded-2xl font-black text-amber-500" placeholder="Ex: CHV-FER-01" />
                                            <label className="text-[10px] font-black text-slate-500 uppercase">Nome da Peça</label>
                                            <textarea value={editingProduct.name || ''} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} className="w-full p-4 rounded-2xl text-sm h-20 font-bold" placeholder="Nome completo para o catálogo" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="p-4 bg-black/30 rounded-2xl border border-white/5">
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-1">Peso da Peça (g)</label>
                                                <input type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} className="w-full bg-transparent border-none text-2xl font-black focus:ring-0 p-0" />
                                            </div>
                                            <div className="p-4 bg-black/30 rounded-2xl border border-white/5">
                                                <label className="text-[10px] font-black text-slate-500 uppercase block mb-1">Tipo de Banho</label>
                                                <select value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})} className="w-full bg-transparent border-none text-sm font-black focus:ring-0 p-0 uppercase text-amber-500">
                                                    {Object.keys(logistics.bathCosts).map(b => <option key={b} value={b} className="bg-slate-900">{b}</option>)}
                                                    <option value="sem_banho" className="bg-slate-900">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center"><span className="text-[10px] font-black text-slate-500 uppercase">Mimos e Itens Extra (Desta Peça)</span><button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...(editingProduct.additionalCosts || []), {name: '', value: 0, weight: 0}]})} className="text-amber-500"><i data-lucide="plus"></i></button></div>
                                            {(editingProduct.additionalCosts || []).map((c, i) => (
                                                <div key={i} className="flex gap-2 items-center bg-black/20 p-2 rounded-xl">
                                                    <input placeholder="Item" value={c.name} onChange={e => {const n = [...editingProduct.additionalCosts]; n[i].name = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="flex-1 p-2 rounded-lg text-[10px]"/>
                                                    <input type="number" placeholder="g" value={c.weight} onChange={e => {const n = [...editingProduct.additionalCosts]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="w-16 p-2 rounded-lg text-[10px] text-center"/>
                                                    <input type="number" placeholder="R$" value={c.value} onChange={e => {const n = [...editingProduct.additionalCosts]; n[i].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: n})}} className="w-20 p-2 rounded-lg text-[10px] font-bold text-emerald-400"/>
                                                    <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: editingProduct.additionalCosts.filter((_, idx) => idx !== i)})} className="text-rose-500 px-2"><i data-lucide="trash-2" className="size-4"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-amber-500 rounded-[3rem] p-10 text-slate-950 flex flex-col justify-between shadow-xl">
                                        <div className="space-y-8">
                                            <div className="flex gap-2 p-1.5 bg-black/10 rounded-2xl w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-6 py-2 rounded-xl text-[10px] font-black transition-all ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>VALOR FIXO</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-6 py-2 rounded-xl text-[10px] font-black transition-all ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500' : 'opacity-40'}`}>MARGEM %</button>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase opacity-60 block">{editingProduct.strategy === 'fixo' ? 'Preço de Venda (R$)' : 'Margem Alvo (%)'}</label>
                                                <input type="number" step="0.01" value={editingProduct.strategy === 'fixo' ? editingProduct.salePrice : editingProduct.targetMargin} onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'fixo' ? 'salePrice' : 'targetMargin']: e.target.value})} className="bg-transparent border-none text-8xl font-black w-full focus:ring-0 p-0" />
                                            </div>
                                            <div className="border-t border-black/10 pt-8 grid grid-cols-2 gap-4">
                                                <div><p className="text-[10px] font-black opacity-60 uppercase">Peso Total Final</p><p className="text-3xl font-black italic">{calculateProduct(editingProduct).totalWeight.toFixed(1)}g</p></div>
                                                <div><p className="text-[10px] font-black opacity-60 uppercase">Lucro Líquido</p><p className="text-3xl font-black italic">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</p></div>
                                            </div>
                                        </div>
                                        <button onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} className="w-full py-7 bg-slate-950 text-amber-500 rounded-[2rem] font-black text-xl hover:scale-[1.02] transition-all uppercase tracking-tight shadow-2xl">Salvar SKU</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
