<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop - Gestor Oficial</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8FAFC; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [searchTerm, setSearchTerm] = useState('');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [logistics, setLogistics] = useState({ 
                packaging: { cost: 1.5 }, 
                bathCosts: { ouro: 0.8, prata: 0.6, niquel: 0.4, sem_banho: 0 } 
            });
            const [editingProduct, setEditingProduct] = useState(null);

            useEffect(() => {
                db.ref('products').on('value', s => setProducts(Object.entries(s.val() || {}).map(([id, v]) => ({id, ...v}))));
                db.ref('marketplaces').on('value', s => {
                    const data = s.val();
                    if (data) setMarketplaces(Object.entries(data).map(([id, v]) => ({id, ...v})));
                    else {
                        // Seed inicial se estiver vazio
                        const initialMP = [
                            { id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3 },
                            { id: 'ml', name: 'Mercado Livre', commission: 16.5, fixedFee: 6 }
                        ];
                        initialMP.forEach(m => db.ref(`marketplaces/${m.id}`).set(m));
                    }
                });
            }, []);

            // --- LÓGICA DE CÁLCULO IGUAL AO 222.TXT ---
            const calculateProduct = (prod) => {
                const mp = marketplaces.find(m => m.id === prod.selectedMarketplace) || marketplaces[0] || { commission: 0, fixedFee: 0 };
                const bathCost = (Number(prod.baseWeight) || 0) * (logistics.bathCosts[prod.bathType] || 0);
                const extraCosts = (prod.additionalCosts || []).reduce((acc, c) => acc + Number(c.value || 0), 0);
                
                const totalProdCost = bathCost + extraCosts + Number(logistics.packaging.cost);
                const divisor = (1 - (Number(mp.commission) + Number(prod.targetMargin || 0)) / 100);
                const suggestedPrice = divisor > 0 ? (totalProdCost + Number(mp.fixedFee)) / divisor : 0;
                
                const finalPrice = prod.strategy === 'margem' ? suggestedPrice : Number(prod.salePrice || 0);
                const feesVal = (finalPrice * (Number(mp.commission) / 100)) + Number(mp.fixedFee);
                const profit = finalPrice - totalProdCost - feesVal;

                return { totalProdCost, suggestedPrice, finalPrice, profit };
            };

            const handleSave = () => {
                db.ref(`products/${editingProduct.id}`).update(editingProduct);
                setEditingProduct(null);
            };

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar Estilo 222.txt */}
                    <aside className="w-64 bg-slate-900 text-white p-8 fixed h-full flex flex-col">
                        <div className="mb-12">
                            <h1 className="text-2xl font-black tracking-tighter italic">LUARY SHOP</h1>
                            <p className="text-[9px] font-bold text-amber-500 tracking-[0.2em] uppercase">Gestor de Negócios</p>
                        </div>
                        <nav className="space-y-4">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full text-left p-4 rounded-3xl font-bold flex items-center gap-3 ${activeTab === 'catalogo' ? 'bg-amber-500 text-slate-900' : 'text-slate-400 hover:bg-white/5'}`}>
                                <span>📦</span> Catálogo
                            </button>
                            <button onClick={() => setActiveTab('vendas')} className={`w-full text-left p-4 rounded-3xl font-bold flex items-center gap-3 ${activeTab === 'vendas' ? 'bg-amber-500 text-slate-900' : 'text-slate-400 hover:bg-white/5'}`}>
                                <span>💰</span> Canais
                            </button>
                        </nav>
                    </aside>

                    <main className="ml-64 p-12 w-full">
                        {activeTab === 'catalogo' && (
                            <div className="animate-in fade-in duration-700">
                                <div className="flex justify-between items-center mb-12">
                                    <div className="relative w-96">
                                        <input className="w-full p-5 bg-white rounded-[2rem] shadow-sm border-0 outline-none focus:ring-2 ring-amber-500/30 font-bold" placeholder="Procurar SKU..." onChange={e => setSearchTerm(e.target.value)} />
                                    </div>
                                    <button onClick={() => {
                                        const key = db.ref('products').push().key;
                                        const newP = { id: key, sku: 'NOVO', name: 'Novo Item', baseWeight: 0, bathType: 'ouro', strategy: 'margem', targetMargin: 50, selectedMarketplace: 'shopee', additionalCosts: [] };
                                        db.ref(`products/${key}`).set(newP);
                                        setEditingProduct(newP);
                                    }} className="bg-slate-900 text-white px-10 py-5 rounded-[2rem] font-black shadow-xl hover:scale-105 transition-all">
                                        CADASTRAR SKU
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                                    {products.filter(p => p.sku?.toLowerCase().includes(searchTerm.toLowerCase())).map(prod => {
                                        const res = calculateProduct(prod);
                                        return (
                                            <div key={prod.id} className="bg-white rounded-[3rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-2xl transition-all group">
                                                <div className="aspect-square bg-slate-50 relative">
                                                    {prod.imageUrl ? <img src={prod.imageUrl} className="w-full h-full object-cover" /> : <div className="h-full flex items-center justify-center text-slate-200">1:1</div>}
                                                    <button onClick={() => setEditingProduct(prod)} className="absolute bottom-6 right-6 bg-amber-500 p-4 rounded-2xl font-black shadow-xl opacity-0 group-hover:opacity-100 transition-all scale-90 group-hover:scale-100">EDITAR</button>
                                                </div>
                                                <div className="p-8">
                                                    <span className="text-[10px] font-black text-amber-600 bg-amber-50 px-3 py-1 rounded-full uppercase mb-3 inline-block">{prod.sku}</span>
                                                    <h3 className="font-bold text-slate-800 leading-tight h-10 line-clamp-2">{prod.name}</h3>
                                                    <div className="mt-6 pt-6 border-t border-slate-50 flex justify-between items-end">
                                                        <div>
                                                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Venda</p>
                                                            <p className="text-xl font-black text-slate-900">R$ {res.finalPrice.toFixed(2)}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Lucro</p>
                                                            <p className={`text-sm font-black ${res.profit > 0 ? 'text-emerald-500' : 'text-rose-500'}`}>R$ {res.profit.toFixed(2)}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DARK IGUAL AO 222.TXT */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-8">
                            <div className="bg-slate-900 text-white w-full max-w-6xl rounded-[4rem] p-12 flex flex-col max-h-[90vh] overflow-hidden shadow-[0_0_100px_rgba(245,158,11,0.1)]">
                                <div className="flex justify-between items-center mb-12">
                                    <div>
                                        <h2 className="text-4xl font-black italic">EDITOR TÉCNICO</h2>
                                        <p className="text-amber-500 font-bold text-xs uppercase tracking-widest">Configuração de Custos e Margens</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={() => setEditingProduct(null)} className="px-8 py-4 font-bold text-slate-500 hover:text-white transition">Fechar</button>
                                        <button onClick={handleSave} className="bg-amber-500 text-slate-900 px-12 py-5 rounded-3xl font-black text-lg shadow-xl hover:bg-amber-400 transition-all">SALVAR ALTERAÇÕES</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-12 gap-12 overflow-y-auto pr-6 custom-scroll">
                                    <div className="md:col-span-8 space-y-10">
                                        {/* Secção 1 */}
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase opacity-40 ml-4">Nome do Produto</label>
                                                <input className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl font-bold outline-none focus:border-amber-500" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black uppercase opacity-40 ml-4">SKU</label>
                                                    <input className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl font-bold text-amber-500 outline-none uppercase" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black uppercase opacity-40 ml-4">Peso (g)</label>
                                                    <input className="w-full bg-white/5 border border-white/10 p-6 rounded-3xl font-bold outline-none" type="number" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Custos Extras Estilo 222.txt */}
                                        <div className="bg-white/5 p-8 rounded-[3rem] border border-white/5">
                                            <div className="flex justify-between items-center mb-6">
                                                <h4 className="font-black text-sm uppercase tracking-tighter">Custos de Insumos Adicionais</h4>
                                                <button onClick={() => setEditingProduct({...editingProduct, additionalCosts: [...(editingProduct.additionalCosts || []), {item: '', value: 0}]})} className="bg-amber-500 text-slate-900 text-[10px] font-black px-4 py-2 rounded-full">+ NOVO CUSTO</button>
                                            </div>
                                            <div className="space-y-3">
                                                {(editingProduct.additionalCosts || []).map((cost, idx) => (
                                                    <div key={idx} className="flex gap-4">
                                                        <input className="flex-1 bg-slate-800 p-4 rounded-2xl text-xs font-bold outline-none" placeholder="Ex: Argola Luxo" value={cost.item} onChange={e => {
                                                            const nc = [...editingProduct.additionalCosts]; nc[idx].item = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} />
                                                        <input className="w-32 bg-slate-800 p-4 rounded-2xl text-xs font-bold outline-none text-emerald-400" type="number" placeholder="R$" value={cost.value} onChange={e => {
                                                            const nc = [...editingProduct.additionalCosts]; nc[idx].value = e.target.value; setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} />
                                                        <button onClick={() => {
                                                            const nc = editingProduct.additionalCosts.filter((_, i) => i !== idx); setEditingProduct({...editingProduct, additionalCosts: nc});
                                                        }} className="text-rose-500 font-bold px-4 hover:scale-125 transition">×</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Marketplaces e Estratégia */}
                                        <div className="grid grid-cols-3 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase opacity-40 ml-4">Marketplace</label>
                                                <select className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-bold outline-none appearance-none" value={editingProduct.selectedMarketplace} onChange={e => setEditingProduct({...editingProduct, selectedMarketplace: e.target.value})}>
                                                    {marketplaces.map(m => <option key={m.id} value={m.id} className="bg-slate-900">{m.name}</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase opacity-40 ml-4">Tipo de Banho</label>
                                                <select className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-bold outline-none appearance-none" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}>
                                                    <option value="ouro" className="bg-slate-900">Ouro 18k</option>
                                                    <option value="prata" className="bg-slate-900">Prata 925</option>
                                                    <option value="niquel" className="bg-slate-900">Níquel</option>
                                                    <option value="sem_banho" className="bg-slate-900">Sem Banho</option>
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black uppercase opacity-40 ml-4">Estratégia</label>
                                                <select className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl font-bold outline-none appearance-none" value={editingProduct.strategy} onChange={e => setEditingProduct({...editingProduct, strategy: e.target.value})}>
                                                    <option value="margem" className="bg-slate-900">Por Margem %</option>
                                                    <option value="fixo" className="bg-slate-900">Preço Fixo</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Sidebar de Resultados Estilo 222.txt */}
                                    <div className="md:col-span-4 bg-white/5 rounded-[3rem] p-10 flex flex-col justify-between border border-white/5">
                                        <div className="space-y-8">
                                            {editingProduct.strategy === 'fixo' ? (
                                                <div>
                                                    <label className="text-[10px] font-black uppercase opacity-40 block mb-2">Preço Final de Venda</label>
                                                    <input type="number" className="bg-transparent text-6xl font-black outline-none w-full text-amber-500" value={editingProduct.salePrice} onChange={e => setEditingProduct({...editingProduct, salePrice: e.target.value})} />
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="text-[10px] font-black uppercase opacity-40 block mb-2">Margem de Lucro Desejada %</label>
                                                    <input type="number" className="bg-transparent text-6xl font-black outline-none w-full text-amber-500" value={editingProduct.targetMargin} onChange={e => setEditingProduct({...editingProduct, targetMargin: e.target.value})} />
                                                </div>
                                            )}

                                            <div className="space-y-6 pt-10 border-t border-white/10">
                                                <div className="flex justify-between items-end">
                                                    <p className="text-[10px] font-black uppercase opacity-40">Lucro Estimado</p>
                                                    <p className="text-3xl font-black text-emerald-400">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</p>
                                                </div>
                                                <div className="flex justify-between items-end">
                                                    <p className="text-[10px] font-black uppercase opacity-40">Custo Total</p>
                                                    <p className="text-xl font-black text-slate-300">R$ {calculateProduct(editingProduct).totalProdCost.toFixed(2)}</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="mt-8 text-center">
                                            <button onClick={() => { if(confirm("Remover SKU permanentemente?")) { db.ref(`products/${editingProduct.id}`).remove(); setEditingProduct(null); }}} className="text-rose-500 text-[10px] font-black uppercase tracking-widest hover:underline">Remover Produto</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
