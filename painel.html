<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luary Shop | Sistema de Engenharia de Custos</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .gold-glow { box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); }
        .input-luary { 
            background: #0f172a !important; 
            color: white !important; 
            border: 1px solid #334155 !important; 
            border-radius: 12px !important; 
            padding: 12px 16px !important;
            width: 100%;
            outline: none;
            transition: all 0.2s;
        }
        .input-luary:focus { border-color: #fbbf24 !important; ring: 2px solid #fbbf24; }
        label { 
            font-size: 10px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #64748b; 
            margin-bottom: 6px; 
            display: block;
            letter-spacing: 1px;
        }
        .tab-active { background: #fbbf24; color: #0f172a; font-weight: 900; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD62Yef2ggoAFSc-qKPlBTaRPRn20D91ug",
            databaseURL: "https://luary-shop-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [marketplaces, setMarketplaces] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            
            // Estado inicial robusto para evitar quebras de renderização
            const [logistics, setLogistics] = useState({
                packaging: { cost: 0, weight: 0 },
                bathCosts: { ouro: 0, prata: 0, niquel: 0, sem_banho: 0 },
                globalExtras: []
            });

            // Carregamento de Dados do Firebase
            useEffect(() => {
                db.ref('products').on('value', s => setProducts(s.val() ? Object.values(s.val()) : []));
                db.ref('marketplaces').on('value', s => {
                    const data = s.val();
                    if (data) setMarketplaces(Object.values(data));
                    else setMarketplaces([{id: 'shopee', name: 'Shopee', commission: 20, fixedFee: 3}]);
                });
                db.ref('logistics').on('value', s => {
                    if (s.val()) setLogistics(s.val());
                });
            }, []);

            // MOTOR DE CÁLCULO PROFISSIONAL
            const calculateProduct = (p) => {
                if (!p) return { totalProdCost: 0, totalWeight: 0, finalPrice: 0, profit: 0, suggested: 0 };
                
                const mp = marketplaces.find(m => m.id === p.selectedMarketplace) || marketplaces[0] || {commission: 20, fixedFee: 3};
                
                // 1. Custo do Banho (Somente peça bruta)
                const bathUnitCost = p.bathType === 'sem_banho' ? 0 : Number(logistics?.bathCosts?.[p.bathType] || 0);
                const totalBathCost = Number(p.baseWeight || 0) * bathUnitCost;

                // 2. Componentes Individuais (Argolas, Correntes, Pingentes, etc)
                const componentsValue = (p.components || []).reduce((a, b) => a + Number(b.value || 0), 0);
                const componentsWeight = (p.components || []).reduce((a, b) => a + Number(b.weight || 0), 0);

                // 3. Custos Fixos (Embalagem da Logística)
                const packCost = Number(logistics?.packaging?.cost || 0);
                const packWeight = Number(logistics?.packaging?.weight || 0);

                // Totais de Produção
                const totalProdCost = totalBathCost + componentsValue + packCost;
                const totalWeight = Number(p.baseWeight || 0) + componentsWeight + packWeight;

                // 4. Precificação e Marketplace
                const comm = Number(mp.commission || 0) / 100;
                const fee = Number(mp.fixedFee || 0);
                const margin = Number(p.targetMargin || 0) / 100;

                // Cálculo de Preço Sugerido (Pela Margem)
                const divisor = (1 - comm - margin);
                const suggested = divisor > 0 ? (totalProdCost + fee) / divisor : 0;

                // Preço Final (Se estratégia for Fixo, usa salePrice. Se for Margem, usa sugerido)
                const finalPrice = p.strategy === 'margem' ? suggested : Number(p.salePrice || 0);
                
                // Lucro Líquido Real
                const profit = finalPrice - totalProdCost - (finalPrice * comm) - fee;

                return { totalProdCost, totalWeight, finalPrice, profit, suggested };
            };

            const duplicateProduct = (p) => {
                const newId = Date.now().toString();
                const newP = { ...p, id: newId, name: p.name + " (Cópia)", sku: p.sku + "-copy" };
                db.ref(`products/${newId}`).set(newP);
            };

            const deleteProduct = (id) => {
                if(window.confirm("Deseja excluir este produto definitivamente?")) {
                    db.ref(`products/${id}`).remove();
                }
            };

            // Filtragem de busca
            const filteredProducts = products.filter(p => 
                p.name?.toLowerCase().includes(searchTerm.toLowerCase()) || 
                p.sku?.toLowerCase().includes(searchTerm.toLowerCase())
            );

            useEffect(() => { if(window.lucide) lucide.createIcons(); });
            return (
                <div className="flex min-h-screen">
                    {/* MENU LATERAL */}
                    <aside className="w-64 border-r border-white/5 bg-slate-900/50 p-6 flex flex-col gap-4 sticky top-0 h-screen z-40">
                        <div className="text-amber-500 font-black text-2xl mb-10 italic tracking-tighter">LUARY SHOP</div>
                        <nav className="space-y-2 flex-1">
                            <button onClick={() => setActiveTab('catalogo')} className={`w-full p-4 rounded-xl flex items-center gap-3 transition-all ${activeTab === 'catalogo' ? 'tab-active shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="layout-grid" className="size-5"></i> Catálogo
                            </button>
                            <button onClick={() => setActiveTab('logistica')} className={`w-full p-4 rounded-xl flex items-center gap-3 transition-all ${activeTab === 'logistica' ? 'tab-active shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="truck" className="size-5"></i> Logística
                            </button>
                            <button onClick={() => setActiveTab('canais')} className={`w-full p-4 rounded-xl flex items-center gap-3 transition-all ${activeTab === 'canais' ? 'tab-active shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:bg-white/5'}`}>
                                <i data-lucide="shopping-bag" className="size-5"></i> Canais
                            </button>
                        </nav>
                        <div className="pt-4 border-t border-white/5">
                            <p className="text-[9px] font-bold text-slate-500 uppercase text-center italic">Engenharia de Custos v2.0</p>
                        </div>
                    </aside>

                    {/* ÁREA DE CONTEÚDO */}
                    <main className="flex-1 p-10 bg-slate-950/20">
                        {activeTab === 'catalogo' && (
                            <div className="space-y-10 animate-in fade-in slide-in-from-top-4 duration-500">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                    <h1 className="text-4xl font-black italic uppercase tracking-tighter">Estoque & Lucratividade</h1>
                                    <div className="flex gap-4 w-full md:w-auto">
                                        <div className="relative flex-1 md:w-64">
                                            <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 size-4 text-slate-500"></i>
                                            <input 
                                                className="input-luary !pl-12 !py-3" 
                                                placeholder="Buscar por nome ou SKU..." 
                                                value={searchTerm}
                                                onChange={e => setSearchTerm(e.target.value)}
                                            />
                                        </div>
                                        <button 
                                            onClick={() => setEditingProduct({ 
                                                id: Date.now().toString(), 
                                                sku: '', 
                                                name: '', 
                                                baseWeight: 0, 
                                                bathType: 'ouro', 
                                                components: [], 
                                                strategy: 'margem', 
                                                targetMargin: 40, 
                                                selectedMarketplace: marketplaces[0]?.id 
                                            })} 
                                            className="bg-amber-500 text-slate-950 px-8 py-3 rounded-xl font-black hover:scale-105 transition-all shadow-xl shadow-amber-500/20 flex items-center gap-2"
                                        >
                                            <i data-lucide="plus" className="size-5"></i> NOVO SKU
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filteredProducts.map(p => {
                                        const res = calculateProduct(p);
                                        return (
                                            <div key={p.id} className="glass-card rounded-[2.5rem] p-7 border border-white/5 hover:border-amber-500/40 transition-all group relative overflow-hidden">
                                                <div className="flex justify-between items-start mb-6">
                                                    <div className="h-24 w-24 bg-slate-800 rounded-3xl overflow-hidden border border-white/10 shadow-inner">
                                                        {p.image ? <img src={p.image} className="w-full h-full object-cover" /> : <div className="flex items-center justify-center h-full opacity-10"><i data-lucide="image" className="size-10"></i></div>}
                                                    </div>
                                                    <div className="flex flex-col gap-2">
                                                        <button onClick={() => duplicateProduct(p)} className="p-2.5 bg-white/5 rounded-xl hover:bg-amber-500 hover:text-slate-950 transition-all" title="Duplicar"><i data-lucide="copy" className="size-4"></i></button>
                                                        <button onClick={() => setEditingProduct(p)} className="p-2.5 bg-white/5 rounded-xl hover:bg-amber-500 hover:text-slate-950 transition-all" title="Editar"><i data-lucide="edit-3" className="size-4"></i></button>
                                                        <button onClick={() => deleteProduct(p.id)} className="p-2.5 bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500 hover:text-white transition-all" title="Excluir"><i data-lucide="trash-2" className="size-4"></i></button>
                                                    </div>
                                                </div>
                                                <div className="mb-6">
                                                    <span className="text-[10px] font-black text-amber-500 uppercase tracking-widest">{p.sku || 'N/A'}</span>
                                                    <h3 className="font-bold text-xl leading-tight line-clamp-1">{p.name || 'Novo Produto'}</h3>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4 border-t border-white/5 pt-5 mb-5">
                                                    <div><label>Venda Sugerida</label><p className="text-2xl font-black">R$ {res.finalPrice.toFixed(2)}</p></div>
                                                    <div className="text-right"><label>Lucro Real</label><p className="text-2xl font-black text-emerald-400">R$ {res.profit.toFixed(2)}</p></div>
                                                </div>
                                                <div className="flex gap-2 overflow-x-auto pb-2 custom-scroll">
                                                    {marketplaces.map(m => (
                                                        <button 
                                                            key={m.id} 
                                                            onClick={() => db.ref(`products/${p.id}`).update({selectedMarketplace: m.id})} 
                                                            className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap transition-all ${p.selectedMarketplace === m.id ? 'bg-amber-500 text-slate-950 shadow-lg' : 'bg-white/5 text-slate-500 hover:bg-white/10'}`}
                                                        >
                                                            {m.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                        {activeTab === 'logistica' && (
                            <div className="max-w-4xl space-y-10 animate-in slide-in-from-bottom-6 duration-500">
                                <h2 className="text-3xl font-black italic uppercase">Painel de Custos Operacionais</h2>
                                
                                <div className="glass-card p-10 rounded-[3rem] space-y-10">
                                    <div className="space-y-6">
                                        <h3 className="text-amber-500 font-black text-xs uppercase tracking-[3px] flex items-center gap-3"><i data-lucide="droplet" className="size-4"></i> Valor do Banho por Grama</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {['ouro', 'prata', 'niquel'].map(type => (
                                                <div key={type} className="bg-black/20 p-6 rounded-[2rem] border border-white/5">
                                                    <label>{type}</label>
                                                    <input 
                                                        type="number" step="0.01" 
                                                        value={logistics.bathCosts[type]} 
                                                        onChange={e => {
                                                            const nl = {...logistics, bathCosts: {...logistics.bathCosts, [type]: e.target.value}};
                                                            setLogistics(nl); db.ref('logistics').set(nl);
                                                        }} 
                                                        className="bg-transparent border-none text-3xl font-black p-0 focus:ring-0 w-full" 
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-6 pt-10 border-t border-white/5">
                                        <h3 className="text-amber-500 font-black text-xs uppercase tracking-[3px] flex items-center gap-3"><i data-lucide="package" className="size-4"></i> Embalagem e Envio Padrão</h3>
                                        <div className="grid grid-cols-2 gap-8">
                                            <div className="bg-black/20 p-6 rounded-[2rem] border border-white/5">
                                                <label>Custo Unitário da Caixa (R$)</label>
                                                <input 
                                                    type="number" step="0.01" 
                                                    value={logistics.packaging.cost} 
                                                    onChange={e => {
                                                        const nl = {...logistics, packaging: {...logistics.packaging, cost: e.target.value}};
                                                        setLogistics(nl); db.ref('logistics').set(nl);
                                                    }} 
                                                    className="bg-transparent border-none text-3xl font-black p-0 focus:ring-0 w-full"
                                                />
                                            </div>
                                            <div className="bg-black/20 p-6 rounded-[2rem] border border-white/5">
                                                <label>Peso da Caixa Vazia (g)</label>
                                                <input 
                                                    type="number" 
                                                    value={logistics.packaging.weight} 
                                                    onChange={e => {
                                                        const nl = {...logistics, packaging: {...logistics.packaging, weight: e.target.value}};
                                                        setLogistics(nl); db.ref('logistics').set(nl);
                                                    }} 
                                                    className="bg-transparent border-none text-3xl font-black p-0 focus:ring-0 w-full"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'canais' && (
                            <div className="max-w-5xl space-y-10 animate-in slide-in-from-bottom-6 duration-500">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black italic uppercase">Marketplaces Configurados</h2>
                                    <button 
                                        onClick={() => {
                                            const id = Date.now().toString();
                                            const n = [...marketplaces, {id, name: 'Nova Loja', commission: 0, fixedFee: 0}];
                                            setMarketplaces(n); db.ref('marketplaces').set(n);
                                        }} 
                                        className="text-amber-500 font-black text-xs uppercase border border-amber-500/30 px-6 py-3 rounded-xl hover:bg-amber-500 hover:text-slate-950 transition-all"
                                    >
                                        + ADICIONAR CANAL
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {marketplaces.map((m, i) => (
                                        <div key={m.id} className="glass-card p-8 rounded-[2rem] grid grid-cols-1 md:grid-cols-4 gap-6 items-end group">
                                            <div><label>Nome do Canal</label><input value={m.name} onChange={e => {const n = [...marketplaces]; n[i].name = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="input-luary font-bold" /></div>
                                            <div><label>Comissão (%)</label><input type="number" value={m.commission} onChange={e => {const n = [...marketplaces]; n[i].commission = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="input-luary" /></div>
                                            <div><label>Taxa Fixa (R$)</label><input type="number" value={m.fixedFee} onChange={e => {const n = [...marketplaces]; n[i].fixedFee = e.target.value; setMarketplaces(n); db.ref('marketplaces').set(n)}} className="input-luary" /></div>
                                            <div className="flex justify-end">
                                                <button onClick={() => {const n = marketplaces.filter(it => it.id !== m.id); setMarketplaces(n); db.ref('marketplaces').set(n)}} className="p-4 bg-rose-500/10 text-rose-500 rounded-2xl hover:bg-rose-500 hover:text-white transition-all"><i data-lucide="trash-2"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                    {/* MODAL EDITOR DE PRODUTO */}
                    {editingProduct && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4 overflow-hidden">
                            <div className="bg-slate-900 w-full max-w-7xl rounded-[4rem] border border-white/10 flex flex-col max-h-[96vh] shadow-2xl animate-in zoom-in-95 duration-300">
                                <div className="p-10 border-b border-white/5 flex justify-between items-center bg-black/20">
                                    <div>
                                        <h2 className="text-amber-500 font-black uppercase tracking-widest italic text-2xl">Configuração de SKU</h2>
                                        <p className="text-slate-500 text-xs font-bold mt-1">Defina custos, componentes e estratégia de lucro</p>
                                    </div>
                                    <button onClick={() => setEditingProduct(null)} className="p-4 bg-white/5 rounded-full text-slate-500 hover:text-white hover:bg-rose-500 transition-all shadow-xl"><i data-lucide="x" className="size-6"></i></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-12 grid grid-cols-1 lg:grid-cols-2 gap-16 custom-scroll">
                                    {/* COLUNA ESQUERDA: CADASTRO */}
                                    <div className="space-y-10">
                                        <div className="space-y-6">
                                            <div className="grid grid-cols-3 gap-4">
                                                <div className="col-span-1"><label>SKU / Ref</label><input className="input-luary !text-amber-500 font-black uppercase" value={editingProduct.sku} onChange={e => setEditingProduct({...editingProduct, sku: e.target.value})} placeholder="Ex: LUARY-001" /></div>
                                                <div className="col-span-2"><label>Nome do Produto no Catálogo</label><input className="input-luary font-bold" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} placeholder="Ex: Chaveiro Ferradura Ouro" /></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label>Canal de Venda Principal</label>
                                                    <select className="input-luary font-bold uppercase text-[10px]" value={editingProduct.selectedMarketplace} onChange={e => setEditingProduct({...editingProduct, selectedMarketplace: e.target.value})}>
                                                        {marketplaces.map(m => <option key={m.id} value={m.id} className="bg-slate-900">{m.name}</option>)}
                                                    </select>
                                                </div>
                                                <div><label>URL da Imagem</label><input className="input-luary text-[10px]" value={editingProduct.image} onChange={e => setEditingProduct({...editingProduct, image: e.target.value})} placeholder="https://..." /></div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-8 p-10 bg-black/40 rounded-[3rem] border border-white/5 relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-2 h-full bg-amber-500"></div>
                                            <div><label className="text-amber-500">Peso Bruto da Peça (g)</label><input type="number" className="bg-transparent border-none text-6xl font-black p-0 focus:ring-0 w-full" value={editingProduct.baseWeight} onChange={e => setEditingProduct({...editingProduct, baseWeight: e.target.value})} /></div>
                                            <div><label className="text-amber-500">Banho Selecionado</label>
                                                <select className="bg-transparent border-none text-2xl font-black p-0 focus:ring-0 text-white uppercase w-full mt-2" value={editingProduct.bathType} onChange={e => setEditingProduct({...editingProduct, bathType: e.target.value})}>
                                                    <option value="ouro" className="bg-slate-900">Ouro</option>
                                                    <option value="prata" className="bg-slate-900">Prata</option>
                                                    <option value="niquel" className="bg-slate-900">Níquel</option>
                                                    <option value="sem_banho" className="bg-slate-900">Sem Banho</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="flex justify-between items-center border-b border-white/5 pb-4"><h3 className="text-xs font-black uppercase text-slate-500 tracking-widest italic">Composição de Itens Agregados</h3><button onClick={() => setEditingProduct({...editingProduct, components: [...(editingProduct.components || []), {name:'', value:0, weight:0}]})} className="bg-amber-500 text-slate-950 px-5 py-2 rounded-xl text-[10px] font-black hover:scale-105 transition-all shadow-lg">+ ADICIONAR ITEM</button></div>
                                            <div className="space-y-3">
                                                {(editingProduct.components || []).map((c, i) => (
                                                    <div key={i} className="flex gap-3 items-center bg-white/5 p-4 rounded-2xl group/item">
                                                        <div className="flex-1"><label>Nome Item</label><input className="bg-transparent border-none p-0 text-sm font-bold focus:ring-0" placeholder="Ex: Argola Aço" value={c.name} onChange={e => {const n = [...editingProduct.components]; n[i].name = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                        <div className="w-20"><label>Peso(g)</label><input type="number" className="bg-transparent border-none p-0 text-sm text-center focus:ring-0" value={c.weight} onChange={e => {const n = [...editingProduct.components]; n[i].weight = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                        <div className="w-24"><label>Custo(R$)</label><input type="number" className="bg-transparent border-none p-0 text-sm font-black text-emerald-400 focus:ring-0 text-right" value={c.value} onChange={e => {const n = [...editingProduct.components]; n[i].value = e.target.value; setEditingProduct({...editingProduct, components: n})}} /></div>
                                                        <button onClick={() => setEditingProduct({...editingProduct, components: editingProduct.components.filter((_, idx) => idx !== i)})} className="p-2 text-slate-600 hover:text-rose-500 transition-all opacity-0 group-hover/item:opacity-100"><i data-lucide="trash-2" className="size-4"></i></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* COLUNA DIREITA: RESULTADOS FINANCEIROS */}
                                    <div className="bg-amber-500 rounded-[4rem] p-12 text-slate-950 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                                        <div className="space-y-12">
                                            <div className="flex gap-2 p-1.5 bg-black/10 rounded-[2rem] w-fit">
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'margem'})} className={`px-10 py-4 rounded-[1.5rem] text-[10px] font-black transition-all ${editingProduct.strategy === 'margem' ? 'bg-slate-950 text-amber-500 shadow-2xl' : 'opacity-40'}`}>MARGEM % DESEJADA</button>
                                                <button onClick={() => setEditingProduct({...editingProduct, strategy: 'fixo'})} className={`px-10 py-4 rounded-[1.5rem] text-[10px] font-black transition-all ${editingProduct.strategy === 'fixo' ? 'bg-slate-950 text-amber-500 shadow-2xl' : 'opacity-40'}`}>VALOR FINAL DE VENDA</button>
                                            </div>

                                            <div className="animate-in fade-in duration-500">
                                                <label className="text-slate-900 font-black text-xs uppercase opacity-70 mb-2 block">{editingProduct.strategy === 'margem' ? 'Quanto você quer de lucro líquido (%)?' : 'Por quanto o item será vendido no site (R$)?'}</label>
                                                <div className="flex items-center">
                                                    <span className="text-4xl font-black mr-2 opacity-40">{editingProduct.strategy === 'margem' ? '%' : 'R$'}</span>
                                                    <input 
                                                        type="number" step="0.01" 
                                                        value={editingProduct.strategy === 'margem' ? editingProduct.targetMargin : editingProduct.salePrice} 
                                                        onChange={e => setEditingProduct({...editingProduct, [editingProduct.strategy === 'margem' ? 'targetMargin' : 'salePrice']: e.target.value})} 
                                                        className="bg-transparent border-none text-[8rem] font-black w-full p-0 focus:ring-0 leading-none tracking-tighter" 
                                                    />
                                                </div>
                                            </div>

                                            <div className="pt-10 border-t border-black/10 grid grid-cols-2 gap-10">
                                                <div className="space-y-1">
                                                    <label className="text-slate-900 opacity-60">Custo Total de Produção</label>
                                                    <p className="text-4xl font-black italic">R$ {calculateProduct(editingProduct).totalProdCost.toFixed(2)}</p>
                                                </div>
                                                <div className="space-y-1 text-right">
                                                    <label className="text-slate-900 opacity-60">Peso Final do Pacote</label>
                                                    <p className="text-4xl font-black italic">{calculateProduct(editingProduct).totalWeight.toFixed(1)}g</p>
                                                </div>
                                                <div className="col-span-2 bg-slate-950/10 p-8 rounded-[2.5rem] flex justify-between items-center border border-black/5 shadow-inner">
                                                    <div className="space-y-1">
                                                        <label className="text-slate-900 font-black uppercase tracking-widest text-[10px]">LUCRO LÍQUIDO REAL</label>
                                                        <p className="text-6xl font-black text-slate-950 italic">R$ {calculateProduct(editingProduct).profit.toFixed(2)}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <i data-lucide="dollar-sign" className="size-16 opacity-10"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => { db.ref(`products/${editingProduct.id}`).set(editingProduct); setEditingProduct(null); }} 
                                            className="w-full py-10 bg-slate-950 text-amber-500 rounded-[2.5rem] font-black text-3xl uppercase tracking-tighter hover:scale-[1.02] active:scale-95 transition-all shadow-2xl flex items-center justify-center gap-4 mt-12"
                                        >
                                            <i data-lucide="save" className="size-8"></i> Gravar Alterações
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
